  <style>
    /* ---------- Reset & base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    /* Lock page to viewport so the bottom nav can never scroll off screen.
       Inner .scroll-area elements do the actual scrolling. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.35;
      color: #1A1A1A;
      background: #EAE4D8;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      /* Prevent iOS double-tap zoom + accidental text selection on long-press */
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    input, select { font: inherit; color: inherit; }
    h1, h2, h3, h4 { margin: 0; font-weight: 600; }
    ul, ol { margin: 0; padding: 0; list-style: none; }

    /* ---------- App shell ---------- */
    #app {
      display: flex;
      flex-direction: column;
      /* Fixed viewport height — prevents body overflow and keeps bottom nav anchored.
         100dvh handles mobile browser chrome (address bar collapse). Fallback: 100vh. */
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      max-width: 720px;
      margin: 0 auto;
      background: #EAE4D8;
    }
    /* Kein App-Titel mehr — der Header traegt nur noch die (seltene) Storage-
       Warnung und kollabiert sonst auf 0 Hoehe, damit oben kein Platz verloren
       geht (App-Look). */
    #topbar {
      flex: 0 0 auto;
      background: #EAE4D8;
      display: flex;
      justify-content: center;
    }
    #topbar .storage-warn {
      font-size: 12px;
      color: #B23A3A;
      padding: 6px 14px;
      border-bottom: 1px solid #E4B4B4;
    }
    #main {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .screen {
      display: none;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
    }
    .screen.is-active { display: flex; }

    /* ---------- Ladebildschirm (Splash) ----------
       Steht ganz oben im <body>, damit er beim Streaming der grossen HTML-Datei
       sofort erscheint. Icon + Balken nutzen NUR transform/opacity -> laufen auf
       dem Compositor-Thread weiter, auch waehrend der Hauptthread die eingebettete
       Kurs-DB aufbaut (sonst wuerde die Animation einfrieren und wie ein Haenger
       aussehen). */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #EAE4D8;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.45s ease;
    }
    #splash.is-hidden { opacity: 0; pointer-events: none; }
    #splash .splash-box {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      width: 80%; max-width: 320px; text-align: center;
    }
    #splash .splash-icon {
      width: 92px; height: 92px; display: block;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12));
      animation: splash-bob 1.15s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes splash-bob {
      0%,100% { transform: translateY(0) rotate(-4deg); }
      50%     { transform: translateY(-11px) rotate(4deg); }
    }
    #splash .splash-title {
      font: 700 20px/1.2 system-ui, -apple-system, sans-serif;
      color: #2F6B3A; letter-spacing: 0.02em;
    }
    #splash .splash-track {
      position: relative; width: 100%; height: 10px;
      background: #D8D6CF; border-radius: 999px; overflow: hidden;
    }
    #splash .splash-fill {
      position: absolute; left: 0; top: 0; height: 100%; width: 0;
      background: linear-gradient(90deg, #2F6B3A, #5FA06E);
      border-radius: 999px; transition: width 0.35s ease;
    }
    #splash .splash-stripe {
      position: absolute; top: 0; height: 100%; width: 42%; border-radius: 999px;
      background: linear-gradient(90deg, rgba(47,107,58,0), #2F6B3A, rgba(47,107,58,0));
      animation: splash-slide 1.15s linear infinite; will-change: transform;
    }
    @keyframes splash-slide {
      from { transform: translateX(-110%); }
      to   { transform: translateX(360%); }
    }
    #splash .splash-status {
      font: 500 13px/1.35 system-ui, -apple-system, sans-serif;
      color: #746E63; min-height: 18px;
    }

    /* ---------- Bottom navigation ---------- */
    #bottomnav {
      /* Permanently pinned: flex-shrink locked + safe-area padding keeps the
         bar visible under browser chrome / iOS home indicator. */
      flex: 0 0 auto;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid #D8D6CF;
      background: #EAE4D8;
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 50;
    }
    #bottomnav button {
      min-height: 56px;
      background: none;
      border: 0;
      border-right: 1px solid #D8D6CF;
      padding: 6px 2px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #746E63;
      font-size: 11px;
    }
    #bottomnav button:last-child { border-right: 0; }
    #bottomnav button .nav-icon {
      font-size: 18px;
      line-height: 1;
    }
    #bottomnav button.is-active {
      color: #2F6B3A;
      font-weight: 600;
    }
    #bottomnav button.is-disabled {
      color: #BBBBBB;
      opacity: 0.55;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 14px;
      /* Warm-neutral card-like button: warmer border, sand-tinted surface */
      border: 1px solid #C8C1B2;
      border-radius: 6px;
      background: #F7F3EA;
      color: #1A1A1A;
      font-size: 14px;
      font-weight: 500;
    }
    /* Ruhiges visuelles Feedback beim Tippen (keine Animation, keine Bewegung) */
    .btn:active:not(:disabled):not(.is-disabled) {
      background: #ECE5D8;
    }
    .btn:disabled, .btn.is-disabled {
      color: #BBBBBB;
      background: #F2F1ED;
      border-color: #E2E0D9;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #2F6B3A;
      border-color: #2F6B3A;
      color: #FFFFFF;
    }
    .btn-primary:disabled, .btn-primary.is-disabled {
      background: #C7D5C9;
      border-color: #C7D5C9;
      color: #FFFFFF;
    }
    .btn-danger {
      background: #FFFFFF;
      border-color: #B23A3A;
      color: #B23A3A;
    }
    .btn-block {
      width: 100%;
    }
    .btn-large {
      min-height: 56px;
      font-size: 16px;
      font-weight: 600;
    }

    /* ---------- Generic blocks ---------- */
    .scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .padded { padding: 12px 14px; }
    .stack > * + * { margin-top: 12px; }
    .label {
      display: block;
      font-size: 12px;
      color: #746E63;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .info-line {
      font-size: 12px;
      color: #746E63;
    }
    .divider {
      height: 1px;
      background: #D8D6CF;
      margin: 14px 0;
    }
    .warn-text {
      color: #B23A3A;
      font-size: 12px;
    }
    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: #746E63;
      font-size: 13px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #746E63;
      margin: 8px 0 6px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.between { justify-content: space-between; }
    .grow { flex: 1 1 auto; }

    /* ---------- Setup screen ---------- */
    #screen-setup .course-card {
      border: 1px solid #D8D6CF;
      border-radius: 8px;
      padding: 10px 12px;
      background: #FFFFFF;
    }
    #screen-setup .course-card .course-name {
      font-size: 16px;
      font-weight: 600;
    }
    #screen-setup .course-card .course-meta {
      font-size: 12px;
      color: #746E63;
      margin-top: 2px;
    }
    .tee-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tee-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #D8D6CF;
      background: #FFFFFF;
      font-size: 13px;
      min-height: 36px;
    }
    .tee-pill .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #888;
    }
    .tee-pill.is-selected {
      border-color: #2F6B3A;
      background: #EAF1EB;
      color: #2F6B3A;
      font-weight: 600;
    }
    .tee-dot-white  { background: #FFFFFF; }
    .tee-dot-yellow { background: #F2C500; border-color: #C7A200; }
    .tee-dot-blue   { background: #2A6FBA; border-color: #1F4F85; }
    .tee-dot-red    { background: #C13A3A; border-color: #8E2B2B; }
    .tee-dot-black  { background: #1A1A1A; border-color: #000000; }

    .player-row {
      border: 1px solid #D8D6CF;
      border-radius: 8px;
      padding: 10px 12px;
      background: #FFFFFF;
    }
    .player-row.has-error { border-color: #B23A3A; }
    .player-row .top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-row .name {
      font-weight: 600;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-row .icon-btn {
      background: none;
      border: 0;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #746E63;
      font-size: 18px;
    }
    .player-row .icon-btn.danger { color: #B23A3A; }
    .player-row .row-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid #D8D6CF;
      border-radius: 6px;
      overflow: hidden;
      background: #FFFFFF;
    }
    .stepper button {
      width: 36px;
      height: 36px;
      border: 0;
      background: #FFFFFF;
      font-size: 18px;
      color: #1A1A1A;
    }
    .stepper button:disabled { color: #C7C7C7; }
    .stepper .value {
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      padding: 0 4px;
    }
    .err-mark {
      color: #B23A3A;
      font-size: 14px;
      margin-left: 4px;
    }

    .accordion {
      border: 1px solid #D8D6CF;
      border-radius: 8px;
      background: #FFFFFF;
      overflow: hidden;
    }
    .accordion summary {
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .accordion summary::-webkit-details-marker { display: none; }
    .accordion summary::after {
      content: "▾";
      font-size: 12px;
      color: #746E63;
    }
    .accordion[open] summary::after { content: "▴"; }
    .accordion .accordion-body {
      padding: 0 12px 12px;
      border-top: 1px solid #D8D6CF;
    }

    /* ---------- Play screen ---------- */
    .play-header {
      flex: 0 0 auto;
      border-bottom: 1px solid #D8D6CF;
      background: #EAE4D8;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .play-header .ph-left { min-width: 0; }
    .play-header .ph-club {
      font-size: 15px;
      font-weight: 700;
      color: #1A1A1A;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .play-header .ph-date { font-size: 12px; color: #746E63; }
    .segment {
      display: inline-flex;
      flex: 0 0 auto;
      border: 1px solid #D8D6CF;
      border-radius: 999px;
      overflow: hidden;
      background: #FFFFFF;
    }
    .segment button {
      min-width: 74px;
      min-height: 34px;
      padding: 5px 14px;
      background: transparent;
      border: 0;
      color: #746E63;
      font-weight: 500;
      font-size: 14px;
      transition: opacity 100ms linear;
    }
    .segment button.is-active {
      background: #2F6B3A;
      color: #FFFFFF;
      font-weight: 600;
    }

    .play-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .play-pane {
      display: none;
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
      opacity: 1;
      transition: opacity 100ms linear;
    }
    .play-pane.is-active { display: flex; }

    /* Live pane — compact but prominent hole header */
    .hole-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid #D8D6CF;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .hole-header .hole-num {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .hole-header .hole-meta {
      font-size: 13px;
      font-weight: 600;
      color: #1A1A1A;
      display: flex;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }
    /* v1.6 density: compact enough to fit 4 player blocks on ~6.5" screens
       without vertical scroll while keeping score dominant. */
    .player-blocks {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 6px 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .player-block {
      /* Waermerer Border, damit Karten besser in den Sandton integriert sind */
      border: 1px solid #C8C1B2;
      border-left-width: 4px;
      border-radius: 8px;
      background: #FFFFFF;
      padding: 6px 8px 7px;
      /* Subtile Tiefe — nur ein einziger Effekt, fast unbewusst wahrnehmbar */
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03);
    }
    .player-block .pb-row1 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      /* Mikro-Kontrast: Name/HCP zart zurueckgenommen, Fokus auf Score-Zeile */
      opacity: 0.9;
    }
    .player-block .pb-row2 {
      /* Row2 (Score) bleibt visuell dominant */
      opacity: 1;
    }
    .player-block .pb-name {
      font-weight: 600;
      font-size: 14px;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #1A1A1A;
    }
    .player-block .pb-hcp {
      color: #746E63;
      font-size: 12px;
      font-weight: 500;
    }
    .player-block .pb-slash {
      color: #B23A3A;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }
    .player-block .pb-row2 {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }
    .player-block .stroke-btn {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      border: 1px solid #D8D6CF;
      background: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      color: #1A1A1A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .player-block .stroke-btn:active:not(:disabled) {
      background: #EAF1EB;
      border-color: #2F6B3A;
    }
    .player-block .stroke-btn:disabled { color: #C7C7C7; background: #F4F2EC; }
    /* Score is the visual center — markedly larger and heavier than metrics.
       clamp() skaliert zwischen 28 und 36 px, damit die Score-Zelle bei
       4-Spieler-Dichte nicht den Block sprengt. */
    .player-block .stroke-value {
      text-align: center;
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: #1A1713;
    }
    .player-block .stroke-value.is-empty { color: #BBBBBB; font-weight: 400; }
    .player-block .pb-row3 {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 11px;
      color: #746E63;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .player-block .pb-row3 > span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-block .pb-row3 strong {
      color: #1A1A1A;
      font-weight: 700;
      font-size: 14px;
      margin-left: 2px;
    }

    /* Dezente Spielerveredelung:
       - zart getoentes Card-Background (ca. 3% Saettigung)
       - 4px Akzentstrich links als Player-Color-Code
       - pb-row1 bekommt eine feine farbige Unterkante, sodass Name+HCP wie
         eine klassische Titelzeile wirkt, ohne in eine bunte Flaeche zu kippen
       - Spielername in gedeckter Akzentfarbe, Zahlen/Werte bleiben Anthrazit */
    .player-block .pb-row1 {
      padding-bottom: 3px;
      margin-bottom: 3px;
      border-bottom: 1px solid #E2E0D9;
    }
    .player-block.p-1 { background: #FFFBEE; border-left-color: #B8922B; }
    .player-block.p-2 { background: #F3F6FA; border-left-color: #345E96; }
    .player-block.p-3 { background: #F2F6F1; border-left-color: #456C3A; }
    .player-block.p-4 { background: #FAF1F3; border-left-color: #91405A; }
    .player-block.p-1 .pb-row1 { border-bottom-color: #E8D9A8; }
    .player-block.p-2 .pb-row1 { border-bottom-color: #C0CFE1; }
    .player-block.p-3 .pb-row1 { border-bottom-color: #C3D3BE; }
    .player-block.p-4 .pb-row1 { border-bottom-color: #E0C3CC; }
    .player-block.p-1 .pb-name { color: #5C4100; }
    .player-block.p-2 .pb-name { color: #1B3558; }
    .player-block.p-3 .pb-name { color: #24481E; }
    .player-block.p-4 .pb-name { color: #631B33; }
    /* Leichter Tap-Highlight beim aktiven Block-Bereich (nur wenn Karte angetippt) */
    .player-block:active { filter: brightness(0.99); }

    .hole-nav {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px 12px 8px;
      border-top: 1px solid #D8D6CF;
      background: #EAE4D8;
    }
    .hole-nav .btn { min-height: 48px; font-size: 14px; font-weight: 700; }

    /* Card pane */
    /* ---------- Tournament Scorecard (paper-style: holes = rows, players = column blocks) ---------- */
    .card-pane { background: #FFFFFF; }
    .card-pane .card-mini-header {
      padding: 8px 12px 6px;
      font-size: 12px;
      color: #746E63;
      border-bottom: 1px solid #BFBDB4;
      background: #F4F2EC;
    }
    .card-mini-header .course-line { font-weight: 700; color: #1A1A1A; font-size: 13px; }
    .card-mini-header .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .card-mini-header .legend .player-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #1A1A1A; }
    .card-mini-header .legend .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #888; display: inline-block; }

    .scorecard-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #FFFFFF;
      /* Ein-Finger-Scrollen nativ; Zwei-Finger-Zoom uebernimmt unsere JS-Logik
         (kein pinch-zoom hier, sonst wuerde der Browser dagegen arbeiten). */
      touch-action: pan-x pan-y;
    }
    .card-zoom { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .card-zoom .cz-label { font-size: 12px; color: #746E63; margin-right: 2px; }
    .card-zoom .cz-btn {
      min-width: 40px; height: 32px; border: 1px solid #D8D6CF; border-radius: 6px;
      background: #FFFFFF; font-size: 16px; font-weight: 700; color: #1A1A1A;
      display: inline-flex; align-items: center; justify-content: center; padding: 0 10px;
      touch-action: manipulation;
    }
    .card-zoom .cz-btn.cz-reset { font-size: 12px; font-weight: 600; }
    .card-zoom .cz-val {
      font-size: 13px; font-weight: 700; min-width: 46px; text-align: center;
      font-variant-numeric: tabular-nums;
    }
    table.scorecard {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      /* Auf volle Displayhoehe strecken: fuellt den leeren Bereich unten, ohne
         Querscrollen (alle Spieler sichtbar) und ohne manuelles Zoomen — passt
         sich jeder Bildschirmgroesse an. Bei zu wenig Platz (kleines Handy)
         behaelt die Tabelle ihre natuerliche Hoehe und scrollt vertikal. */
      height: 100%;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: #1A1A1A;
    }
    table.scorecard th,
    table.scorecard td {
      border-right: 1px solid #BFBDB4;
      border-bottom: 1px solid #BFBDB4;
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
      background: #FFFFFF;
      height: 26px;
      line-height: 1.1;
    }
    table.scorecard th:last-child, table.scorecard td:last-child { border-right: 0; }

    /* --- Column widths (compact) --- */
    table.scorecard .col-loch  { min-width: 34px; width: 34px; }
    table.scorecard .col-si    { min-width: 26px; width: 26px; }
    table.scorecard .col-par   { min-width: 26px; width: 26px; }
    table.scorecard .col-gelb  { min-width: 38px; width: 38px; }
    table.scorecard .col-schl  { min-width: 34px; width: 34px; }
    table.scorecard .col-slash { min-width: 22px; width: 22px; }
    table.scorecard .col-stbf  { min-width: 26px; width: 26px; }

    /* --- Header rows (NICHT fixiert) ---
       Frueher war die Kopfzeile sticky (top). Auf Touch-Geraeten wird ein
       sticky-Element auf einer eigenen Compositor-Ebene gezeichnet und hinkt
       beim Querscrollen dem Tabellenkoerper hinterher -> der gruene Kopf
       "verschob" sich sichtbar. Ohne Fixierung scrollt die ganze Karte als eine
       Einheit (kein Versatz). Bei 100% fuellt die Karte ohnehin den Schirm ohne
       Scrollen; nur beim manuellen Reinzoomen scrollt der Kopf normal mit. */
    table.scorecard thead th {
      position: static;
      background: #2F6B3A;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 11px;
      border-right-color: #1F4A28;
      border-bottom-color: #1F4A28;
    }
    table.scorecard thead tr.hdr-row-1 th { top: 0; height: 22px; }
    table.scorecard thead tr.hdr-row-2 th { top: 22px; height: 20px; font-size: 10px; letter-spacing: 0.02em; }
    table.scorecard thead th.player-header { padding: 2px 6px; white-space: nowrap; }
    table.scorecard thead th.player-header .ph-dot {
      width: 8px; height: 8px; margin-right: 4px; vertical-align: middle; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.6); display: inline-block;
    }
    table.scorecard thead th.corner-cell { background: #1F4A28; }

    /* --- Sticky left columns (Loch/SI/Par/Gelb) --- */
    table.scorecard tbody th.col-loch,
    table.scorecard tbody td.col-si,
    table.scorecard tbody td.col-par,
    table.scorecard tbody td.col-gelb {
      position: sticky;
      z-index: 1;
      font-weight: 600;
    }
    table.scorecard tbody th.col-loch { left: 0; }
    table.scorecard tbody td.col-si   { left: 34px; }
    table.scorecard tbody td.col-par  { left: 60px; }
    table.scorecard tbody td.col-gelb { left: 86px; }

    /* Header-row-2 (data labels) sticky positions */
    table.scorecard thead tr.hdr-row-2 th.col-loch  { left: 0;   z-index: 3; }
    table.scorecard thead tr.hdr-row-2 th.col-si    { left: 34px; z-index: 3; }
    table.scorecard thead tr.hdr-row-2 th.col-par   { left: 60px; z-index: 3; }
    table.scorecard thead tr.hdr-row-2 th.col-gelb  { left: 86px; z-index: 3; }
    /* Header-row-1 corner block spans the 4 fixed cols */
    table.scorecard thead tr.hdr-row-1 th.hdr-fixed { left: 0; z-index: 3; }

    /* Linke Spalten NICHT horizontal fixieren: beim starken Reinzoomen wuerde der
       breite Vorgabe-Block (Loch/SI/Par/Gelb) sonst fast den ganzen Schirm
       verdecken und die Spielerdaten unsichtbar machen. Bei 100% fuellt die Karte
       ohnehin die Breite (kein Querscrollen), daher kein Verlust. Die Kopfzeile
       bleibt oben fixiert (top), nur die Links-Fixierung faellt weg. */
    table.scorecard tbody th.col-loch,
    table.scorecard tbody td.col-si,
    table.scorecard tbody td.col-par,
    table.scorecard tbody td.col-gelb { position: static; }
    table.scorecard thead tr.hdr-row-1 th.hdr-fixed,
    table.scorecard thead tr.hdr-row-2 th.col-loch,
    table.scorecard thead tr.hdr-row-2 th.col-si,
    table.scorecard thead tr.hdr-row-2 th.col-par,
    table.scorecard thead tr.hdr-row-2 th.col-gelb { left: auto; }

    /* --- Player block separators (thick left border starts each player, thick right ends) --- */
    table.scorecard thead th.player-header { border-left: 2px solid #8A8878; border-right: 2px solid #8A8878; }
    table.scorecard thead tr.hdr-row-2 th.col-schl.col-schl--first-of-player,
    table.scorecard tbody td.col-schl.col-schl--first-of-player {
      border-left: 2px solid #8A8878;
    }
    table.scorecard thead tr.hdr-row-2 th.col-stbf,
    table.scorecard tbody td.col-stbf {
      border-right: 2px solid #8A8878;
    }

    /* --- Alternating row colors for hole rows --- */
    table.scorecard tr.row-hole.row-a td,
    table.scorecard tr.row-hole.row-a th { background: #FFFFFF; }
    table.scorecard tr.row-hole.row-b td,
    table.scorecard tr.row-hole.row-b th { background: #F7F6EF; }

    /* Left fixed cells get slightly stronger background so they remain readable when sticky */
    table.scorecard tr.row-hole.row-a th.col-loch,
    table.scorecard tr.row-hole.row-a td.col-si,
    table.scorecard tr.row-hole.row-a td.col-par,
    table.scorecard tr.row-hole.row-a td.col-gelb { background: #F4F2EC; color: #1A1A1A; }
    table.scorecard tr.row-hole.row-b th.col-loch,
    table.scorecard tr.row-hole.row-b td.col-si,
    table.scorecard tr.row-hole.row-b td.col-par,
    table.scorecard tr.row-hole.row-b td.col-gelb { background: #EDEBE2; color: #1A1A1A; }

    /* SI cells slightly gray */
    table.scorecard tbody td.col-si { color: #746E63; font-size: 11px; font-weight: 500; }

    /* Slash cells: sekundaer */
    table.scorecard td.col-slash {
      font-size: 11px;
      color: #B23A3A;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    /* Stbf cells: klar sichtbar, etwas ruhiger */
    table.scorecard td.col-stbf {
      font-weight: 600;
      font-size: 12px;
      color: #1A1A1A;
    }
    /* Schl cells: dominant */
    table.scorecard td.col-schl {
      font-weight: 700;
      font-size: 14px;
      color: #1A1A1A;
      cursor: pointer;
    }
    table.scorecard td.col-schl:hover { background: #EFF4EF; }
    table.scorecard td.col-schl.is-empty { color: #BBBBBB; font-weight: 400; }

    /* --- Summary rows: OUT / IN / TOTAL --- */
    table.scorecard tr.row-summary td,
    table.scorecard tr.row-summary th {
      background: #ECEAE3;
      font-weight: 700;
      color: #1A1A1A;
      border-top: 2px solid #8A8878;
    }
    table.scorecard tr.row-summary th.col-loch,
    table.scorecard tr.row-summary td.col-si,
    table.scorecard tr.row-summary td.col-par,
    table.scorecard tr.row-summary td.col-gelb { background: #DCDAD0; }
    /* TOT row extra emphasis */
    table.scorecard tr.row-total td,
    table.scorecard tr.row-total th {
      background: #2F6B3A;
      color: #FFFFFF;
      border-top: 2px solid #1F4A28;
      border-bottom: 2px solid #1F4A28;
      font-weight: 800;
    }
    table.scorecard tr.row-total th.col-loch,
    table.scorecard tr.row-total td.col-si,
    table.scorecard tr.row-total td.col-par,
    table.scorecard tr.row-total td.col-gelb { background: #1F4A28; color: #FFFFFF; }

    /* --- 4-player density: denser columns, shorter header text handled in JS --- */
    table.scorecard.is-4players { font-size: 11px; }
    table.scorecard.is-4players .col-loch  { min-width: 30px; width: 30px; }
    table.scorecard.is-4players .col-si    { min-width: 24px; width: 24px; }
    table.scorecard.is-4players .col-par   { min-width: 24px; width: 24px; }
    table.scorecard.is-4players .col-gelb  { min-width: 32px; width: 32px; }
    table.scorecard.is-4players .col-schl  { min-width: 30px; width: 30px; }
    table.scorecard.is-4players .col-slash { min-width: 18px; width: 18px; }
    table.scorecard.is-4players .col-stbf  { min-width: 22px; width: 22px; }
    table.scorecard.is-4players th,
    table.scorecard.is-4players td {
      padding: 1px 2px;
      height: 24px;
    }
    table.scorecard.is-4players td.col-schl { font-size: 13px; }
    table.scorecard.is-4players td.col-stbf { font-size: 11px; }
    table.scorecard.is-4players td.col-slash { font-size: 10px; }
    /* Adjust sticky left column offsets for 4-player mode */
    table.scorecard.is-4players tbody td.col-si   { left: 30px; }
    table.scorecard.is-4players tbody td.col-par  { left: 54px; }
    table.scorecard.is-4players tbody td.col-gelb { left: 78px; }
    table.scorecard.is-4players thead tr.hdr-row-2 th.col-si   { left: 30px; }
    table.scorecard.is-4players thead tr.hdr-row-2 th.col-par  { left: 54px; }
    table.scorecard.is-4players thead tr.hdr-row-2 th.col-gelb { left: 78px; }

    /* --- Print button in card mini header --- */
    .card-mini-header .mini-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-mini-header .print-btn {
      padding: 4px 10px;
      min-height: 30px;
      font-size: 11px;
      border: 1px solid #D8D6CF;
      border-radius: 6px;
      background: #FFFFFF;
      color: #1A1A1A;
      cursor: pointer;
    }

    /* --- Print / PDF view --- */
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      html, body { background: #FFFFFF; }
      /* Hide everything except the active play screen's card pane */
      #topbar, #bottomnav, .play-header, .play-pane:not(.is-active), .card-mini-header .print-btn,
      .gps-row, .scroll-area > *:not(.scorecard-wrap), #overlay-root, #toast,
      #screen-setup, #screen-results, #screen-data { display: none !important; }
      #app { max-width: none; margin: 0; }
      .card-pane { display: flex !important; flex-direction: column; }
      .card-mini-header {
        border-bottom: 1px solid #000000;
        background: #FFFFFF;
        padding: 4px 0 6px;
      }
      .card-mini-header .course-line { font-size: 14px; }
      .scorecard-wrap {
        overflow: visible !important;
        background: #FFFFFF;
      }
      /* Neutralize sticky so nothing floats weirdly on paper */
      table.scorecard thead th,
      table.scorecard tbody th.col-loch,
      table.scorecard tbody td.col-si,
      table.scorecard tbody td.col-par,
      table.scorecard tbody td.col-gelb {
        position: static !important;
        box-shadow: none !important;
      }
      /* Ensure table header repeats across printed pages; auf Papier natuerliche
         Hoehe statt Display-Fuellung (height:100% ist nur fuer den Screen). */
      table.scorecard { page-break-inside: auto; height: auto !important; }
      table.scorecard thead { display: table-header-group; }
      table.scorecard tfoot { display: table-footer-group; }
      table.scorecard tr { page-break-inside: avoid; page-break-after: auto; }
      /* Sharper print lines */
      table.scorecard th, table.scorecard td {
        border-right: 1px solid #000000 !important;
        border-bottom: 1px solid #000000 !important;
        padding: 2px 3px;
      }
      table.scorecard thead th {
        background: #FFFFFF !important;
        color: #000000 !important;
        border-bottom: 2px solid #000000 !important;
      }
      table.scorecard thead th.corner-cell,
      table.scorecard thead th.player-header {
        background: #E8E8E8 !important;
        color: #000000 !important;
      }
      /* Mute alternating row tint so print stays clean */
      table.scorecard tr.row-hole.row-b td,
      table.scorecard tr.row-hole.row-b th { background: #F7F7F7 !important; }
      table.scorecard tr.row-hole.row-a td,
      table.scorecard tr.row-hole.row-a th { background: #FFFFFF !important; }
      table.scorecard tr.row-hole.is-active td,
      table.scorecard tr.row-hole.is-active th { background: #FFFFFF !important; box-shadow: none !important; }
      /* Summary: bold print */
      table.scorecard tr.row-summary td,
      table.scorecard tr.row-summary th {
        background: #E0E0E0 !important; color: #000000 !important;
        border-top: 2px solid #000000 !important;
      }
      table.scorecard tr.row-total td,
      table.scorecard tr.row-total th {
        background: #C8C8C8 !important; color: #000000 !important;
        border-top: 2px solid #000000 !important;
        border-bottom: 2px solid #000000 !important;
      }
      /* Ensure browser prints our chosen backgrounds */
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact; }
    }

    /* --- Active hole row highlight --- */
    table.scorecard tr.row-hole.is-active td,
    table.scorecard tr.row-hole.is-active th { background: #EAF1EB !important; }
    table.scorecard tr.row-hole.is-active th.col-loch {
      background: #C9E0CD !important;
      box-shadow: inset 3px 0 0 0 #2F6B3A;
    }
    table.scorecard tr.row-hole.is-active td.col-si,
    table.scorecard tr.row-hole.is-active td.col-par,
    table.scorecard tr.row-hole.is-active td.col-gelb { background: #D7E6D9 !important; }

    /* ---------- Results screen ---------- */
    .ranking-card {
      border: 1px solid #D8D6CF;
      border-radius: 10px;
      background: #FFFFFF;
      padding: 12px;
    }
    .ranking-card.is-leader {
      border-left: 4px solid #2F6B3A;
    }
    .ranking-card .rc-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .ranking-card .rc-rank {
      font-size: 22px;
      font-weight: 700;
    }
    .ranking-card .rc-stbl {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .ranking-card .rc-name {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
    }
    .ranking-card .rc-hcp {
      font-size: 12px;
      color: #746E63;
    }
    .ranking-card .rc-stats {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: #746E63;
      margin-top: 8px;
      flex-wrap: wrap;
      font-variant-numeric: tabular-nums;
    }
    .ranking-card .rc-stats strong { color: #1A1A1A; font-weight: 600; }
    .ranking-card .rc-spark {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      gap: 2px;
      margin-top: 8px;
    }
    .ranking-card .rc-spark .pt {
      font-size: 9px;
      text-align: center;
      padding: 2px 0;
      background: #F4F2EC;
      border-radius: 2px;
      font-variant-numeric: tabular-nums;
      color: #746E63;
    }
    .ranking-card .rc-spark .pt.empty { color: #BBBBBB; }
    .ranking-card .rc-spark .pt.p0 { background: #F4F2EC; }
    .ranking-card .rc-spark .pt.p1 { background: #EAEAEA; }
    .ranking-card .rc-spark .pt.p2 { background: #DDEAE0; color: #1A1A1A; }
    .ranking-card .rc-spark .pt.p3 { background: #BFD9C5; color: #1A1A1A; }
    .ranking-card .rc-spark .pt.p4,
    .ranking-card .rc-spark .pt.p5 { background: #2F6B3A; color: #FFFFFF; }
    .results-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    /* ---------- Data screen ---------- */
    .data-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .data-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #D8D6CF;
      border-radius: 8px;
      background: #FFFFFF;
    }
    .data-row .meta {
      font-size: 12px;
      color: #746E63;
    }
    .data-row .name {
      font-weight: 600;
    }
    .data-row .actions {
      display: flex;
      gap: 6px;
    }
    .data-row .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid #D8D6CF;
      background: #FFFFFF;
      color: #746E63;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .data-row .icon-btn.danger { color: #B23A3A; border-color: #E6C5C5; }

    /* ---------- Overlay (modals & sheets) ---------- */
    #overlay-root {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
    }
    #overlay-root.is-open { display: block; }
    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 20, 0.4);
    }
    .overlay-content {
      position: absolute;
      left: 0;
      right: 0;
      max-width: 720px;
      margin: 0 auto;
      background: #FFFFFF;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      /* --ovh (sichtbare Hoehe ueber der Tastatur) wird per JS gesetzt; ohne
         Tastatur = 90vh. So bleibt der Overlay-Inhalt IMMER scrollbar/sichtbar. */
      max-height: var(--ovh, 90vh);
      overflow-y: auto;
    }
    .overlay-content.sheet {
      /* --kb = Hoehe der Bildschirmtastatur (per JS). Damit steht das Sheet
         IMMER oberhalb der Tastatur statt darunter. Ohne Tastatur = 0. */
      bottom: var(--kb, 0px);
      transition: bottom 0.15s ease;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .overlay-content.dialog {
      /* --dtop = Mitte des SICHTBAREN Viewports (per JS), damit der Dialog bei
         eingeblendeter Tastatur nicht dahinter rutscht. Ohne Tastatur = 50%. */
      top: var(--dtop, 50%);
      transform: translateY(-50%);
      border-radius: 12px;
      max-width: 440px;
      margin: 0 14px;
      left: 0; right: 0;
    }
    .overlay-header {
      padding: 14px 14px 6px;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 1px solid #E2E0D9;
    }
    .overlay-body {
      padding: 14px;
    }
    .overlay-actions {
      padding: 12px 14px 16px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      border-top: 1px solid #E2E0D9;
    }
    .overlay-actions .btn { min-width: 100px; }

    .field {
      display: block;
      margin-bottom: 12px;
    }
    .field input[type="text"],
    .field input[type="number"] {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid #D8D6CF;
      border-radius: 6px;
      background: #FFFFFF;
      font-size: 15px;
    }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      background: #1A1A1A;
      color: #FFFFFF;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms linear;
      max-width: 80%;
      text-align: center;
    }
    #toast.is-visible { opacity: 1; }

    /* ---------- Misc helpers ---------- */
    .hidden { display: none !important; }
    .nowrap { white-space: nowrap; }
    .small { font-size: 12px; color: #746E63; }

    /* Sub-view header (Back + Title) */
    .subview-header {

    /* ---------- Open rounds list on Setup (v1.5) ---------- */
    .open-rounds-block {
      border: 1px solid #2F6B3A;

      padding: 10px 12px;

    /* ---------- History table (v1.3) ---------- */
    .history-wrap { padding: 10px 14px 14px; }

    .history-subtitle { font-size: 12px; color: #746E63; margin-bottom: 10px; }
    table.history-table {
      width: 100%;

      background: #FFFFFF;
      font-size: 13px;
    }
    table.history-table thead th {

      padding: 8px 10px;

      border-bottom: 1px solid #BFBDB4;

      font-size: 11px;

    /* ---------- GPS & Nearby (v1.1) ---------- */
    .gps-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #D8D6CF;
      border-radius: 8px;
      background: #FFFFFF;
      min-height: 44px;

      font-size: 12px;
      color: #1A1A1A;

      padding: 4px 0;
      font-size: 16px;
      line-height: 1;

    .nearby-list { display: flex; flex-direction: column; gap: 6px; }

      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 12px;
      border: 1px solid #D8D6CF;
      border-radius: 8px;

      white-space: nowrap;

    .filter-bar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .filter-bar .filter-row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .filter-bar input,
    .filter-bar select {
      width: 100%;
      min-height: 40px;
      padding: 6px 8px;
      border: 1px solid #D8D6CF;
      border-radius: 6px;
      background: #FFFFFF;
      font-size: 14px;
      /* type="search" nicht mit nativer Such-Optik rendern (gleiche Optik wie zuvor) */

    /* Falls doch ein natives Such-Clear-Icon erscheint: ausblenden. */

    .filter-bar input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; }

      flex-direction: column;

      border: 1px solid #E0DED6; border-radius: 8px; padding: 8px 10px; background: #FCFBF7;

<body>
  <!-- Ladebildschirm: steht ganz oben, damit er beim Streaming der grossen
       HTML-Datei sofort erscheint (bevor die eingebettete DB den Thread belegt). -->

  <div id="app">

    </header>

    <main id="main">
