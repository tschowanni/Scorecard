    // ============================================================
    // Play screen rendering
    // ============================================================
    function renderPlay() {
      const root = document.getElementById('screen-play');
      root.innerHTML = '';
      const round = state.activeRound;
      if (!round) {
        const empty = el('div', { class: 'empty-state padded' }, [
          'Es laeuft keine Runde. Wechsle zu Setup, um eine Runde zu starten.'
        ]);
        root.appendChild(empty);
        return;
      }
      const course = getCourseForRound(round);

      // Banner for saved/finished rounds (read-only mode)
      if (round.status === 'finished') {
        root.appendChild(el('div', { class: 'history-banner' }, [
          'Gespeicherte Runde · ', el('strong', {}, [course.name]),
          ' · ', formatDate(round.date)
        ]));
      }

      // Header: Clubname (Zeile 1) + Datum (Zeile 2) links, Live/Karte rechts —
      // spart Hoehe, damit alle Spieler ohne Scrollen auf einen Screen passen.
      const header = el('div', { class: 'play-header' });
      const left = el('div', { class: 'ph-left' });
      left.appendChild(el('div', { class: 'ph-club' }, [course.name]));
      left.appendChild(el('div', { class: 'ph-date' }, [formatDate(round.date)]));
      header.appendChild(left);
      const seg = el('div', { class: 'segment', role: 'tablist' });
      const segLive = el('button', {
        class: state.segment === 'live' ? 'is-active' : '',
        type: 'button', role: 'tab',
        'aria-selected': state.segment === 'live' ? 'true' : 'false'
      }, ['Live']);
      const segCard = el('button', {
        class: state.segment === 'card' ? 'is-active' : '',
        type: 'button', role: 'tab',
        'aria-selected': state.segment === 'card' ? 'true' : 'false'
      }, ['Karte']);
      segLive.addEventListener('click', function () { setSegment('live'); });
      segCard.addEventListener('click', function () { setSegment('card'); });
      seg.appendChild(segLive);
      seg.appendChild(segCard);
      header.appendChild(seg);
      root.appendChild(header);

      // Body
      const body = el('div', { class: 'play-body' });
      const livePane = el('div', { class: 'play-pane' + (state.segment === 'live' ? ' is-active' : '') });
      const cardPane = el('div', { class: 'play-pane card-pane' + (state.segment === 'card' ? ' is-active' : '') });
      renderLivePane(livePane, round, course);
      renderCardPane(cardPane, round, course);
      body.appendChild(livePane);
      body.appendChild(cardPane);
      root.appendChild(body);
    }
    function renderLivePane(pane, round, course) {
      // Last playable hole of this round (9 for a 9-hole course, 18 for 18).
      const lastHole = (Array.isArray(round.holeNumbers) && round.holeNumbers.length)
        ? round.holeNumbers[round.holeNumbers.length - 1]
        : (course.holeCount || (course.holes && course.holes.length) || 18);
      const hole = getHole(course, round.currentHole);
      // Hole header
      const hdr = el('div', { class: 'hole-header' });
      hdr.appendChild(el('div', { class: 'hole-num' }, ['Loch ' + hole.holeNumber]));
      const meta = el('div', { class: 'hole-meta' });
      meta.appendChild(el('span', {}, ['Par ' + hole.par]));
      meta.appendChild(el('span', {}, ['SI ' + hole.strokeIndex]));
      hdr.appendChild(meta);
      pane.appendChild(hdr);

      // Player blocks
      const blocks = el('div', { class: 'player-blocks' });
      round.playersInRound.forEach(function (pir, idx) {
        blocks.appendChild(renderPlayerBlock(round, course, hole, pir, idx));
      });
      pane.appendChild(blocks);

      // Hole nav
      const nav = el('div', { class: 'hole-nav' });
      const prev = el('button', {
        class: 'btn' + (round.currentHole === 1 ? ' is-disabled' : ''),
        type: 'button'
      }, ['‹ Loch ' + Math.max(1, round.currentHole - 1)]);
      if (round.currentHole === 1) prev.disabled = true;
      prev.addEventListener('click', function () {
        if (round.currentHole > 1) {
          round.currentHole--;
          scheduleAutosave();
          renderPlay();
        }
      });
      const nextLabel = round.currentHole >= lastHole ? 'Runde abschliessen' : ('Loch ' + (round.currentHole + 1) + ' ›');
      const next = el('button', { class: 'btn btn-primary', type: 'button' }, [nextLabel]);
      next.addEventListener('click', function () {
        if (round.currentHole < lastHole) {
          round.currentHole++;
          scheduleAutosave();
          renderPlay();
        } else {
          openDialog({
            title: 'Runde abschliessen?',
            message: 'Moechtest du die Runde jetzt abschliessen und zur Ergebnisansicht wechseln?',
            confirmText: 'Ja, abschliessen',
            cancelText: 'Nein, weiterspielen',
            onConfirm: function () {
              finishActiveRound();
              setScreen('results');
            }
          });
        }
      });
      nav.appendChild(prev);
      nav.appendChild(next);
      pane.appendChild(nav);
    }
    // Nur den EINEN Spielerblock neu rendern (statt renderPlay), damit die
    // Scrollposition der Spielerliste bei +/- erhalten bleibt — sonst sprang die
    // Anzeige bei jedem Klick nach oben. Ein Stroke aendert nur die Summen DIESES
    // Spielers, daher genuegt der eigene Block.
    function updateLivePlayerBlock(round, course, hole, idx) {
      const blocks = document.querySelector('#screen-play .player-blocks');
      const old = blocks && blocks.querySelector('.player-block[data-player-idx="' + idx + '"]');
      if (!blocks || !old) { renderPlay(); return; }
      const fresh = renderPlayerBlock(round, course, hole, round.playersInRound[idx], idx);
      old.parentNode.replaceChild(fresh, old);
    }
    function renderPlayerBlock(round, course, hole, pir, idx) {
      // Subtle per-player color accent (idx 0..3 -> p-1..p-4, cycles for 5+)
      const colorClass = 'p-' + ((idx % 4) + 1);
      const block = el('div', {
        class: 'player-block ' + colorClass,
        'data-player-idx': String(idx)
      });
      const given = pir.strokesPerHole[hole.holeNumber - 1] || 0;
      const strokes = getStrokesForPlayerHole(round, idx, hole.holeNumber);
      const totals = computeTotals(round, idx);
      const readOnly = (round.status === 'finished');

      const row1 = el('div', { class: 'pb-row1' });
      row1.appendChild(el('span', { class: 'pb-name' }, [pir.displayName]));
      row1.appendChild(el('span', { class: 'pb-hcp' }, ['(HCP ' + pir.handicapIndexAtRound.toFixed(1) + ', SPH ' + pir.playingHandicap + ')']));
      const slash = slashChars(given);
      if (slash) row1.appendChild(el('span', { class: 'pb-slash', 'aria-label': 'Vorgabeschlaege' }, [slash]));
      block.appendChild(row1);

      const row2 = el('div', { class: 'pb-row2' });
      const minus = el('button', {
        class: 'stroke-btn',
        type: 'button',
        'aria-label': 'Schlag minus'
      }, ['−']);
      if (strokes <= 0 || readOnly) minus.disabled = true;
      minus.addEventListener('click', function () {
        if (readOnly) return;
        let s = strokes;
        if (s <= 0) return;
        s = Math.max(0, s - 1);
        setStrokesForPlayerHole(round, idx, hole.holeNumber, s);
        scheduleAutosave();
        updateLivePlayerBlock(round, course, hole, idx);
      });
      const value = el('div', {
        class: 'stroke-value' + (strokes <= 0 ? ' is-empty' : '')
      }, [strokes > 0 ? String(strokes) : '—']);
      const plus = el('button', {
        class: 'stroke-btn',
        type: 'button',
        'aria-label': 'Schlag plus'
      }, ['+']);
      if (strokes >= 15 || readOnly) plus.disabled = true;
      plus.addEventListener('click', function () {
        if (readOnly) return;
        let s = strokes;
        if (s <= 0) {
          s = hole.par;
        } else if (s < 15) {
          s += 1;
        } else {
          return;
        }
        setStrokesForPlayerHole(round, idx, hole.holeNumber, s);
        scheduleAutosave();
        updateLivePlayerBlock(round, course, hole, idx);
      });
      row2.appendChild(minus);
      row2.appendChild(value);
      row2.appendChild(plus);
      block.appendChild(row2);

      // Row 3: compact metrics — short labels so 4 items fit on one line
      // even on 375px-wide devices without wrapping.
      const row3 = el('div', { class: 'pb-row3' });
      const stbl = strokes > 0 ? stablefordForHole(strokes, hole.par, given) : 0;
      const net = strokes > 0 ? (strokes - given) : 0;
      row3.appendChild(el('span', {}, ['Stbl ', el('strong', {}, [strokes > 0 ? String(stbl) : '—'])]));
      row3.appendChild(el('span', {}, ['Net ', el('strong', {}, [strokes > 0 ? String(net) : '—'])]));
      row3.appendChild(el('span', {}, ['Tot ', el('strong', {}, [String(totals.grossTotal)])]));
      row3.appendChild(el('span', {}, ['Σ ', el('strong', {}, [String(totals.stablefordTotal)])]));
      block.appendChild(row3);

      return block;
    }
    // Scorekarten-Zoom bleibt ueber Re-Renders hinweg erhalten (Modul-Variable).
    let __cardZoom = 1;
    function renderCardPane(pane, round, course) {
      // Mini header (tournament-style) with print button
      const mini = el('div', { class: 'card-mini-header' });
      const topRow = el('div', { class: 'mini-header-top' });
      topRow.appendChild(el('div', { class: 'course-line' }, [course.name + ' — ' + formatDate(round.date)]));
      const printBtn = el('button', { class: 'print-btn', type: 'button' }, ['Drucken / PDF']);
      printBtn.addEventListener('click', function () { window.print(); });
      topRow.appendChild(printBtn);
      mini.appendChild(topRow);
      const legend = el('div', { class: 'legend' });
      round.playersInRound.forEach(function (pir) {
        const tag = el('span', { class: 'player-tag' });
        tag.appendChild(el('span', { class: 'dot tee-dot-' + pir.teeColorKey }));
        tag.appendChild(document.createTextNode(' ' + shortName(pir.displayName, 14) + ' (' + (TEE_LABELS[pir.teeColorKey] || pir.teeColorKey) + ')'));
        legend.appendChild(tag);
      });
      mini.appendChild(legend);
      pane.appendChild(mini);

      // Scrollable table (paper scorecard layout: holes = rows, players = column blocks)
      const wrap = el('div', { class: 'scorecard-wrap' });
      const nPlayers = round.playersInRound.length;
      // v1.2: denser classes for 4-player mode
      const table = el('table', { class: 'scorecard' + (nPlayers >= 4 ? ' is-4players' : '') });

      // Eigener Scorekarten-Zoom (Pinch + Buttons). Noetig, weil der Browser-
      // Finger-Zoom im Vollbildmodus deaktiviert ist. CSS 'zoom' vergroessert die
      // LAYOUT-Box (anders als transform), daher schwenkt der overflow:auto-
      // Container natuerlich mit.
      // Min = 100%: die Karte fuellt bei 100% bereits die Breite (min-width:100%),
      // kleiner waere nur unlesbar mit leerem Rand. Zoomen geht daher nur HINEIN.
      const CZ_MIN = 1, CZ_MAX = 3;
      const clampZoom = function (z) { return Math.min(CZ_MAX, Math.max(CZ_MIN, Math.round(z * 100) / 100)); };
      const zLabel = el('span', { class: 'cz-val' }, [Math.round(__cardZoom * 100) + '%']);
      const applyZoom = function () {
        table.style.zoom = String(__cardZoom);
        zLabel.textContent = Math.round(__cardZoom * 100) + '%';
      };
      const zoomRow = el('div', { class: 'card-zoom' });
      zoomRow.appendChild(el('span', { class: 'cz-label' }, ['Zoom']));
      const zMinus = el('button', { class: 'cz-btn', type: 'button', 'aria-label': 'Karte kleiner' }, ['−']);
      zMinus.addEventListener('click', function () { __cardZoom = clampZoom(__cardZoom - 0.2); applyZoom(); });
      const zPlus = el('button', { class: 'cz-btn', type: 'button', 'aria-label': 'Karte groesser' }, ['+']);
      zPlus.addEventListener('click', function () { __cardZoom = clampZoom(__cardZoom + 0.2); applyZoom(); });
      const zReset = el('button', { class: 'cz-btn cz-reset', type: 'button' }, ['Zuruecksetzen']);
      zReset.addEventListener('click', function () { __cardZoom = 1; applyZoom(); });
      zoomRow.appendChild(zMinus);
      zoomRow.appendChild(zLabel);
      zoomRow.appendChild(zPlus);
      zoomRow.appendChild(zReset);
      mini.appendChild(zoomRow);
      table.style.zoom = String(__cardZoom);   // gespeicherten Zoom initial anwenden

      // Distance column: pick the dominant tee to display in the left block.
      // Prefer yellow (classical men's tee), fallback to any tee that actually has yardages.
      let domTee = getTee(course, 'yellow');
      if (!domTee || !Array.isArray(domTee.holeYardage) || domTee.holeYardage.length === 0) {
        const withYard = (course.tees || []).find(function (t) {
          return Array.isArray(t.holeYardage) && t.holeYardage.length > 0;
        });
        if (withYard) domTee = withYard;
      }
      const teeHasYards = !!(domTee && Array.isArray(domTee.holeYardage) && domTee.holeYardage.length > 0);
      // Dynamic label: use actual tee color label if known, otherwise generic "Tee"
      const teeColLabel = domTee ? (domTee.colorLabel || TEE_LABELS[domTee.colorKey] || 'Tee') : 'Tee';
      function yardFor(h) {
        if (!teeHasYards) return '–';
        const y = domTee.holeYardage[h - 1];
        return (typeof y === 'number' && y > 0) ? String(y) : '–';
      }

      // --- thead: 2 rows ---
      const thead = el('thead');

      // Row 1: corner (spans Loch/SI/Par/Gelb) + each player name (spans Schl | / | Stbf = colspan 3)
      const tr1 = el('tr', { class: 'hdr-row-1' });
      tr1.appendChild(el('th', { class: 'corner-cell hdr-fixed', colspan: '4' }, ['Lochdaten']));
      round.playersInRound.forEach(function (pir) {
        const th = el('th', { class: 'player-header', colspan: '3' });
        th.appendChild(el('span', { class: 'ph-dot tee-dot-' + pir.teeColorKey }));
        th.appendChild(document.createTextNode(shortName(pir.displayName, 10)));
        tr1.appendChild(th);
      });
      thead.appendChild(tr1);

      // Row 2: Loch | SI | Par | Gelb | (Schl | / | Stbf) per player
      const tr2 = el('tr', { class: 'hdr-row-2' });
      tr2.appendChild(el('th', { class: 'col-loch' }, ['Loch']));
      tr2.appendChild(el('th', { class: 'col-si'   }, ['SI']));
      tr2.appendChild(el('th', { class: 'col-par'  }, ['Par']));
      tr2.appendChild(el('th', { class: 'col-gelb', title: 'Distanz ' + teeColLabel }, [teeColLabel]));
      round.playersInRound.forEach(function () {
        tr2.appendChild(el('th', { class: 'col-schl col-schl--first-of-player' }, ['Schl']));
        tr2.appendChild(el('th', { class: 'col-slash' }, ['/']));
        tr2.appendChild(el('th', { class: 'col-stbf' }, ['Stbf']));
      });
      thead.appendChild(tr2);
      table.appendChild(thead);

      // --- tbody ---
      const tbody = el('tbody');

      // Per-player accumulators for OUT / IN
      const outAcc = round.playersInRound.map(function () { return { schl: 0, stbl: 0, any: false }; });
      const inAcc  = round.playersInRound.map(function () { return { schl: 0, stbl: 0, any: false }; });
      let parOut = 0, parIn = 0;

      // Build one hole row: Loch | SI | Par | Gelb | per player (Schl | / | Stbf)
      function buildHoleRow(h, altClass) {
        const hole = getHole(course, h);
        const tr = el('tr', { class: 'row-hole ' + altClass + (h === round.currentHole ? ' is-active' : '') });
        tr.appendChild(el('th', { class: 'col-loch' }, [String(h)]));
        tr.appendChild(el('td', { class: 'col-si'   }, [String(hole.strokeIndex)]));
        tr.appendChild(el('td', { class: 'col-par'  }, [String(hole.par)]));
        tr.appendChild(el('td', { class: 'col-gelb' }, [yardFor(h)]));

        // player blocks: 3 columns each
        round.playersInRound.forEach(function (pir, idx) {
          const given = pir.strokesPerHole[h - 1] || 0;
          const strokes = getStrokesForPlayerHole(round, idx, h);

          // Schlagzahl (click jumps to live mode on this hole)
          const schlTd = el('td', {
            class: 'col-schl col-schl--first-of-player' + (strokes <= 0 ? ' is-empty' : '')
          }, [strokes > 0 ? String(strokes) : '—']);
          schlTd.addEventListener('click', function () {
            round.currentHole = h;
            scheduleAutosave();
            state.segment = 'live';
            renderPlay();
            renderBottomNav();
          });
          tr.appendChild(schlTd);

          // Slash-Spalte (own column, separate from Schl)
          tr.appendChild(el('td', { class: 'col-slash' }, [slashChars(given)]));

          // Stableford-Spalte
          const pts = strokes > 0 ? stablefordForHole(strokes, hole.par, given) : 0;
          tr.appendChild(el('td', { class: 'col-stbf' }, [strokes > 0 ? String(pts) : '']));
        });
        return tr;
      }

      // Accumulate per-player OUT / IN from actual entries
      function accumulateHole(h, accArr) {
        const hole = getHole(course, h);
        round.playersInRound.forEach(function (pir, idx) {
          const given = pir.strokesPerHole[h - 1] || 0;
          const strokes = getStrokesForPlayerHole(round, idx, h);
          if (strokes > 0) {
            accArr[idx].schl += strokes;
            accArr[idx].stbl += stablefordForHole(strokes, hole.par, given);
            accArr[idx].any = true;
          }
        });
        return hole.par;
      }

      // How many holes this course actually has (9 or 18). Drives whether the
      // IN block (holes 10+) is rendered at all — a 9-hole course would
      // otherwise deref getHole(course,10..18) === null and crash the pane.
      const nHoles = course.holeCount || (course.holes && course.holes.length) || 18;

      // --- Front holes (1 .. min(9, nHoles)), alternating row A/B ---
      for (let h = 1; h <= Math.min(9, nHoles); h++) {
        parOut += accumulateHole(h, outAcc);
        tbody.appendChild(buildHoleRow(h, (h % 2 === 1) ? 'row-a' : 'row-b'));
      }

      // --- OUT summary row ---
      const outRow = el('tr', { class: 'row-summary row-out' });
      outRow.appendChild(el('th', { class: 'col-loch' }, ['OUT']));
      outRow.appendChild(el('td', { class: 'col-si'   }, ['']));
      outRow.appendChild(el('td', { class: 'col-par'  }, [String(parOut)]));
      outRow.appendChild(el('td', { class: 'col-gelb' }, ['']));
      round.playersInRound.forEach(function (_, idx) {
        const a = outAcc[idx];
        outRow.appendChild(el('td', { class: 'col-schl col-schl--first-of-player' }, [a.any ? String(a.schl) : '']));
        outRow.appendChild(el('td', { class: 'col-slash' }, ['']));
        outRow.appendChild(el('td', { class: 'col-stbf' }, [a.any ? String(a.stbl) : '']));
      });
      tbody.appendChild(outRow);

      // --- Back holes (10 .. nHoles) + IN summary — only for >9-hole courses ---
      if (nHoles > 9) {
        for (let h = 10; h <= nHoles; h++) {
          parIn += accumulateHole(h, inAcc);
          tbody.appendChild(buildHoleRow(h, (h % 2 === 1) ? 'row-a' : 'row-b'));
        }

        const inRow = el('tr', { class: 'row-summary row-in' });
        inRow.appendChild(el('th', { class: 'col-loch' }, ['IN']));
        inRow.appendChild(el('td', { class: 'col-si'   }, ['']));
        inRow.appendChild(el('td', { class: 'col-par'  }, [String(parIn)]));
        inRow.appendChild(el('td', { class: 'col-gelb' }, ['']));
        round.playersInRound.forEach(function (_, idx) {
          const a = inAcc[idx];
          inRow.appendChild(el('td', { class: 'col-schl col-schl--first-of-player' }, [a.any ? String(a.schl) : '']));
          inRow.appendChild(el('td', { class: 'col-slash' }, ['']));
          inRow.appendChild(el('td', { class: 'col-stbf' }, [a.any ? String(a.stbl) : '']));
        });
        tbody.appendChild(inRow);
      }

      // --- TOTAL row ---
      const totalRow = el('tr', { class: 'row-summary row-total' });
      totalRow.appendChild(el('th', { class: 'col-loch' }, ['TOT']));
      totalRow.appendChild(el('td', { class: 'col-si'   }, ['']));
      totalRow.appendChild(el('td', { class: 'col-par'  }, [String(parOut + parIn)]));
      totalRow.appendChild(el('td', { class: 'col-gelb' }, ['']));
      round.playersInRound.forEach(function (_, idx) {
        const any = outAcc[idx].any || inAcc[idx].any;
        const s = outAcc[idx].schl + inAcc[idx].schl;
        const p = outAcc[idx].stbl + inAcc[idx].stbl;
        totalRow.appendChild(el('td', { class: 'col-schl col-schl--first-of-player' }, [any ? String(s) : '']));
        totalRow.appendChild(el('td', { class: 'col-slash' }, ['']));
        totalRow.appendChild(el('td', { class: 'col-stbf' }, [any ? String(p) : '']));
      });
      tbody.appendChild(totalRow);

      table.appendChild(tbody);
      wrap.appendChild(table);
      pane.appendChild(wrap);

      // Pinch-to-Zoom auf der Scorekarte (funktioniert auch im Vollbild, wo der
      // Browser-Finger-Zoom deaktiviert ist). Ein-Finger-Scrollen bleibt nativ.
      (function () {
        let startDist = 0, startZoom = 1;
        const dist2 = function (touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        };
        wrap.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2) { startDist = dist2(e.touches); startZoom = __cardZoom; }
        }, { passive: true });
        wrap.addEventListener('touchmove', function (e) {
          if (e.touches.length === 2 && startDist > 0) {
            e.preventDefault();   // eigenen Zoom statt Browser-Geste/Scroll
            __cardZoom = clampZoom(startZoom * (dist2(e.touches) / startDist));
            applyZoom();
          }
        }, { passive: false });
        wrap.addEventListener('touchend', function (e) {
          if (e.touches.length < 2) startDist = 0;
        }, { passive: true });
      })();

      // Scroll active hole row into view (vertical)
      requestAnimationFrame(function () {
        const target = wrap.querySelector('tr.row-hole.is-active');
        if (target) {
          const wRect = wrap.getBoundingClientRect();
          const tRect = target.getBoundingClientRect();
          const offset = (tRect.top - wRect.top) - (wRect.height / 2) + (tRect.height / 2);
          wrap.scrollTop += offset;
        }
      });
    }
    function buildStrokeCell(round, course, idx, pir, holeNumber) {
      const hole = getHole(course, holeNumber);
      const given = pir.strokesPerHole[holeNumber - 1] || 0;
      const strokes = getStrokesForPlayerHole(round, idx, holeNumber);
      const td = el('td', { class: 'stroke-cell' });
      const num = el('span', { class: 'stroke-num' + (strokes <= 0 ? ' is-empty' : '') }, [strokes > 0 ? String(strokes) : '—']);
      td.appendChild(num);
      const slash = slashChars(given);
      if (slash) {
        td.appendChild(el('span', { class: 'stroke-slash' }, [slash]));
      }
      if (holeNumber === round.currentHole) {
        td.classList.add('active-hole-mark');
        td.classList.add('active-hole-col');
      }
      td.addEventListener('click', function () {
        round.currentHole = holeNumber;
        saveState();
        state.segment = 'live';
        renderPlay();
        renderBottomNav();
        // Scroll to player block
        requestAnimationFrame(function () {
          const block = document.querySelector('.player-block[data-player-idx="' + idx + '"]');
          if (block && block.scrollIntoView) {
            block.scrollIntoView({ block: 'center', behavior: 'auto' });
          }
        });
      });
      return td;
    }

    // ============================================================
    // Results screen rendering
    // ============================================================
    function renderResults() {
      const root = document.getElementById('screen-results');
      root.innerHTML = '';
      const round = state.activeRound;
      if (!round) {
        root.appendChild(el('div', { class: 'empty-state padded' }, [
          'Keine aktive Runde. Starte eine Runde im Setup.'
        ]));
        return;
      }
      const course = getCourseForRound(round);
      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });

      const hdr = el('div', {});
      hdr.appendChild(el('h2', { style: 'font-size:16px;' }, [
        round.status === 'finished' ? 'Runde abgeschlossen' : 'Aktueller Stand'
      ]));
      hdr.appendChild(el('div', { class: 'small' }, [course.name + ' — ' + formatDate(round.date)]));
      padded.appendChild(hdr);

      const ranking = getRanking(round);
      ranking.forEach(function (entry) {
        padded.appendChild(renderRankingCard(entry, round, course));
      });

      const actions = el('div', { class: 'results-actions' });
      const exportBtn = el('button', { class: 'btn', type: 'button' }, ['Exportieren']);
      exportBtn.addEventListener('click', exportData);
      const newRound = el('button', { class: 'btn btn-primary', type: 'button' }, ['Neue Runde']);
      newRound.addEventListener('click', function () {
        openDialog({
          title: 'Neue Runde starten?',
          message: 'Die aktuelle Runde wird beendet und entfernt. Setup-Daten der Runde werden verworfen.',
          confirmText: 'Ja, beenden',
          confirmKind: 'danger',
          onConfirm: function () {
            discardActiveRound();
            state.setupDraft = null;
            setScreen('setup');
          }
        });
      });
      actions.appendChild(exportBtn);
      actions.appendChild(newRound);
      padded.appendChild(actions);

      scroll.appendChild(padded);
      root.appendChild(scroll);
    }
    function renderRankingCard(entry, round, course) {
      const card = el('div', { class: 'ranking-card' + (entry.rank === 1 ? ' is-leader' : '') });
      const top = el('div', { class: 'rc-top' });
      top.appendChild(el('div', { class: 'rc-rank' }, [entry.rank + '.']));
      top.appendChild(el('div', { class: 'rc-stbl' }, [entry.totals.stablefordTotal + ' Pkt']));
      card.appendChild(top);
      card.appendChild(el('div', { class: 'rc-name' }, [entry.pir.displayName]));
      card.appendChild(el('div', { class: 'rc-hcp' }, [
        'HCP ' + entry.pir.handicapIndexAtRound.toFixed(1) +
        ' · SPH ' + entry.pir.playingHandicap +
        ' · ' + (TEE_LABELS[entry.pir.teeColorKey] || entry.pir.teeColorKey)
      ]));
      const stats = el('div', { class: 'rc-stats' });
      stats.appendChild(el('span', {}, ['Brutto: ', el('strong', {}, [String(entry.totals.grossTotal)])]));
      stats.appendChild(el('span', {}, ['Netto: ', el('strong', {}, [String(entry.totals.netTotal)])]));
      stats.appendChild(el('span', {}, ['+/−: ', el('strong', {}, [
        entry.totals.anyEntered ? formatToPar(entry.totals.toParGross) : '—'
      ])]));
      card.appendChild(stats);
      // Spark
      const spark = el('div', { class: 'rc-spark' });
      const nSparkHoles = course.holeCount || (course.holes && course.holes.length) || 18;
      for (let h = 1; h <= nSparkHoles; h++) {
        const s = getStrokesForPlayerHole(round, entry.idx, h);
        const hole = getHole(course, h);
        const given = entry.pir.strokesPerHole[h - 1] || 0;
        const pts = s > 0 ? stablefordForHole(s, hole.par, given) : null;
        const cls = pts === null ? 'pt empty' : ('pt p' + pts);
        spark.appendChild(el('div', { class: cls, title: 'Loch ' + h }, [pts === null ? '·' : String(pts)]));
      }
      card.appendChild(spark);
      return card;
    }

    // ============================================================
    // Data screen rendering
    // ============================================================
    // Nach einer Spieler-DB-Aenderung den gerade sichtbaren Verwaltungs-Screen neu
    // zeichnen: entweder den Daten-Screen ODER die Hub-Spielerverwaltung.
    function rerenderPlayerAdmin() {
      if (state.activeScreen === 'data') renderData();
      else renderSetup();   // Setup -> aktuelle Unteransicht (playersDb) neu rendern
    }
    // Vollwertige Spieler-DB (Liste + Bearbeiten + Loeschen + Neu). Wird von BEIDEN
    // Orten genutzt: Daten-Screen und der Hub-Spielerverwaltung — eine Quelle,
    // damit sich beide nie auseinanderentwickeln. Loeschen hier ist DAUERHAFT
    // (filter + saveState), im Browser als persistent verifiziert.
    function renderPlayerAdminSection(container) {
      container.appendChild(el('div', { class: 'section-title', style: 'margin-top:14px;' }, ['Spieler']));
      const playerList = el('div', { class: 'data-list' });
      if (state.appState.players.length === 0) {
        playerList.appendChild(el('div', { class: 'empty-state' }, ['Keine Spieler vorhanden.']));
      } else {
        state.appState.players.forEach(function (p) {
          const row = el('div', { class: 'data-row' });
          const info = el('div', { class: 'grow' });
          info.appendChild(el('div', { class: 'name' }, [p.name]));
          info.appendChild(el('div', { class: 'meta' }, [
            'HCP ' + p.handicapIndex.toFixed(1) +
            (p.defaultTeeColorKey ? ' · ' + (TEE_LABELS[p.defaultTeeColorKey] || p.defaultTeeColorKey) : '')
          ]));
          row.appendChild(info);
          const editBtn = el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Bearbeiten' }, ['✎']);
          editBtn.addEventListener('click', function () { openEditPlayerSheet(p.id); });
          const delBtn = el('button', { class: 'icon-btn danger', type: 'button', 'aria-label': 'Loeschen' }, ['🗑']);
          delBtn.addEventListener('click', function () {
            openDialog({
              title: 'Spieler loeschen?',
              message: 'Spieler "' + p.name + '" aus der Datenbank entfernen?',
              confirmText: 'Loeschen',
              confirmKind: 'danger',
              onConfirm: function () {
                state.appState.players = state.appState.players.filter(function (x) { return x.id !== p.id; });
                saveState();
                rerenderPlayerAdmin();
              }
            });
          });
          const actionsBox = el('div', { class: 'actions' });
          actionsBox.appendChild(editBtn);
          actionsBox.appendChild(delBtn);
          row.appendChild(actionsBox);
          playerList.appendChild(row);
        });
      }
      container.appendChild(playerList);
      const addPBtn = el('button', { class: 'btn', type: 'button' }, ['+ Spieler']);
      addPBtn.addEventListener('click', openNewPlayerInDatabaseSheet);
      container.appendChild(addPBtn);
    }
    // Eigene Hub-Unteransicht "Spieler verwalten" (Zurueck -> Hub). Braucht KEINEN
    // gewaehlten Platz — reine Datenbank-Pflege.
    function renderSetupPlayersDbView(root) {
      root.appendChild(buildSubViewHeader('Spieler verwalten'));
      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });
      padded.appendChild(el('div', { class: 'small' }, [
        'Spieler anlegen, HCP/Tee bearbeiten oder loeschen — unabhaengig von einer Runde.'
      ]));
      renderPlayerAdminSection(padded);
      scroll.appendChild(padded);
      root.appendChild(scroll);
    }
    function renderData() {
      const root = document.getElementById('screen-data');
      root.innerHTML = '';
      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });

      // Darstellung / Vollbild (App-Ansicht ohne Browser-/Systemleisten)
      if (appFullscreenSupported()) {
        padded.appendChild(el('div', { class: 'section-title' }, ['Darstellung']));
        const fsLabel = function () { return isAppFullscreen() ? 'Vollbild verlassen' : 'Vollbild — App-Ansicht'; };
        const fsBtn = el('button', { class: 'btn btn-block', type: 'button' }, [fsLabel()]);
        fsBtn.addEventListener('click', function () {
          toggleAppFullscreen();
          setTimeout(function () { fsBtn.textContent = fsLabel(); }, 120);
        });
        padded.appendChild(fsBtn);
        padded.appendChild(el('div', { class: 'small' }, [
          'Blendet Browser- und Android-Leisten aus. Zum Anzeigen von unten nach oben wischen. ' +
          'Fuer eine echte App-Kachel: Browser-Menue → "Zum Startbildschirm hinzufuegen".'
        ]));
      }

      // Spieler section (geteilte CRUD — auch ueber Hub -> "Spieler" erreichbar)
      renderPlayerAdminSection(padded);

      // Plaetze section — nur eine Vorschau, NICHT die ganze DB als DOM (bei
      // tausenden Plaetzen wuerde das den Screen blockieren). Die vollstaendige,
      // durchsuchbare Auswahl gibt es bei der Platzauswahl.
      padded.appendChild(el('div', { class: 'section-title', style: 'margin-top:14px;' }, ['Plaetze']));
      const courseList = el('div', { class: 'data-list' });
      const PLATZ_CAP = 50;
      const courseView = state.appState.courses.slice()
        .sort(function (a, b) { return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()); });
      courseView.slice(0, PLATZ_CAP).forEach(function (c) {
        const row = el('div', { class: 'data-row' });
        const info = el('div', { class: 'grow' });
        info.appendChild(el('div', { class: 'name' }, [c.name]));
        info.appendChild(el('div', { class: 'meta' }, [
          countryDisplayName(c.country) + (c.region ? ' / ' + c.region : '') +
          ' · ' + c.tees.length + ' Tees · ' + (c.holeCount || 18) + ' Loecher'
        ]));
        row.appendChild(info);
        courseList.appendChild(row);

    // ============================================================
    // Single-round export / import (v1.7)
    // Device-to-device sharing of individual finished rounds, without cloud.
    // ============================================================
    const SINGLE_ROUND_SCHEMA_VERSION = 1;

    // Filename-safe short slug for course name (Muenchen-Riedhof -> muenchen-riedhof)
    function slugifyCourseName(name) {
      const s = (name || 'runde').toString().toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
      return (s || 'runde').slice(0, 40);
    }

    // Build a self-contained single-round export payload (deep clone of the round).
    function buildSingleRoundPayload(round) {
      return {
        schemaVersion: SINGLE_ROUND_SCHEMA_VERSION,
        exportType: 'single-round',
        exportedAt: new Date().toISOString(),
        round: JSON.parse(JSON.stringify(round))
      };
    }

    // Export one round to a downloadable .json file.
    // Filename pattern: jjjj.tt.mm_<slug>_round.json
    function exportSingleRound(roundId) {
      const round = (state.appState.rounds || []).find(function (r) { return r.id === roundId; })
        || getOpenRounds().find(function (r) { return r.id === roundId; });
      if (!round) { showToast('Runde nicht gefunden.'); return; }
      const payload = buildSingleRoundPayload(round);
      const data = JSON.stringify(payload, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = formatDateFile(round.date || round.createdAt);
      const slug = slugifyCourseName(round.courseName);
      a.href = url;
      a.download = stamp + '_' + slug + '_round.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 0);
      showToast('Runde exportiert');
    }

    // Defensive validation of the single-round export structure.
    // Returns { ok: true, round } on success or { ok: false, reason }.
    function validateSingleRoundPayload(parsed) {
      if (!parsed || typeof parsed !== 'object') return { ok: false, reason: 'Ungueltige Datei' };
      if (parsed.exportType !== 'single-round') return { ok: false, reason: 'Kein Einzelrunden-Format' };
      if (parsed.schemaVersion !== SINGLE_ROUND_SCHEMA_VERSION) {
        return { ok: false, reason: 'Inkompatible Schema-Version (erwartet ' + SINGLE_ROUND_SCHEMA_VERSION + ')' };
      }
      const r = parsed.round;
      if (!r || typeof r !== 'object') return { ok: false, reason: 'Runde fehlt' };
      if (!r.id) return { ok: false, reason: 'Runde ohne ID' };
      if (!r.courseId) return { ok: false, reason: 'Runde ohne Kurs-Referenz' };
      if (!Array.isArray(r.playersInRound) || r.playersInRound.length === 0) {
        return { ok: false, reason: 'Runde ohne Spieler' };
      }
      return { ok: true, round: r };
    }

    // Fill in any fields an imported round may be missing, purely defensively.
    function ensureImportedRoundShape(r) {
      if (!r.courseLayoutId) r.courseLayoutId = 'standard';
      if (!Array.isArray(r.holeNumbers) || r.holeNumbers.length === 0) {
        const n = (r.courseSnapshot && r.courseSnapshot.holeCount) || 18;
        const arr = [];
        for (let i = 1; i <= n; i++) arr.push(i);
        r.holeNumbers = arr;
      }
      if (!r.createdAt) r.createdAt = r.date || new Date().toISOString();
      if (!r.updatedAt) r.updatedAt = r.createdAt;
      if (!r.courseName) r.courseName = (r.courseSnapshot && r.courseSnapshot.name) || 'Unbekannter Platz';
      if (!Array.isArray(r.holeScores)) r.holeScores = [];
      if (typeof r.currentHole !== 'number' || r.currentHole < 1) r.currentHole = 1;
      // Imported rounds are archival — always finished in the receiving device.
      r.status = 'finished';
      return r;
    }

    // Shallow equality of two rounds for duplicate detection.
    function roundsLookIdentical(a, b) {
      try {
        return JSON.stringify(a) === JSON.stringify(b);
      } catch (e) { return false; }
    }

    function importSingleRoundFromFile(file) {
      const reader = new FileReader();
      reader.onload = function () {
        let parsed;
        try {
          parsed = JSON.parse(String(reader.result));
        } catch (e) {
          openDialog({
            title: 'Import fehlgeschlagen',
            message: 'Die Datei enthaelt kein gueltiges JSON.',
            confirmText: 'OK', hideCancel: true
          });
          return;
        }
        const check = validateSingleRoundPayload(parsed);
        if (!check.ok) {
          openDialog({
            title: 'Import fehlgeschlagen',
            message: 'Die Datei ist keine gueltige Einzelrunde: ' + check.reason + '.',
            confirmText: 'OK', hideCancel: true
          });
          return;
        }
        const r = ensureImportedRoundShape(check.round);

        // Duplicate handling: same id already known? Auch offene Runden
        // pruefen — sonst entsteht dieselbe Runde doppelt (offen + History),
        // wenn eine noch laufende Runde exportiert und re-importiert wird.
        const openDup = (state.appState.openRounds || []).find(function (x) { return x.id === r.id; });
        if (openDup) {
          openDialog({
            title: 'Runde noch offen',
            message: 'Diese Runde laeuft auf diesem Geraet noch (offenes Spiel). ' +
                     'Bitte dort weiterspielen oder sie zuerst beenden.',
            confirmText: 'OK', hideCancel: true
          });
          return;
        }
        const existing = (state.appState.rounds || []).find(function (x) { return x.id === r.id; });
        if (existing) {
          if (roundsLookIdentical(existing, r)) {
            openDialog({
              title: 'Bereits importiert',
              message: 'Diese Runde ist bereits in deiner History vorhanden.',
              confirmText: 'OK', hideCancel: true
            });
            return;
          }
          openDialog({
            title: 'Runde bereits vorhanden',
            message: 'Eine Runde mit derselben ID existiert bereits, aber die Inhalte unterscheiden sich. Soll sie durch die importierte Version ersetzt werden?',
            confirmText: 'Ersetzen',
            confirmKind: 'danger',
            onConfirm: function () {
              const idx = state.appState.rounds.findIndex(function (x) { return x.id === r.id; });
              if (idx >= 0) state.appState.rounds[idx] = r;
              saveState();
              renderHistory();
              showToast('Runde ersetzt');
            }
          });
          return;
        }
        // Not a duplicate -> show preview dialog and append on confirm.
        showSingleRoundImportPreview(r);
      };
      reader.onerror = function () {
        openDialog({
          title: 'Import fehlgeschlagen',
          message: 'Datei konnte nicht gelesen werden.',
          confirmText: 'OK', hideCancel: true
        });
      };
      reader.readAsText(file);
    }

    function showSingleRoundImportPreview(r) {
      const content = el('div');
      content.appendChild(el('div', { class: 'overlay-header' }, ['Runde importieren?']));

      info.appendChild(el('div', {}, [el('strong', {}, ['Spieler: ']), names || '-']));
      info.appendChild(el('div', {}, [el('strong', {}, ['Loecher: ']), String((r.holeNumbers || []).length)]));
      body.appendChild(info);

        'Die Runde wird in deine History uebernommen (nur lesbar).'
      ]));

    function triggerSingleRoundImport() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.addEventListener('change', function () {
        const file = input.files && input.files[0];
        if (!file) return;
        importSingleRoundFromFile(file);
      });
      input.click();
    }

    // Feature detection for Web Share API with file support.
    // Cached: the probe creates a tiny File to test navigator.canShare.
    let __webShareFilesSupported = null;
    function canShareFiles() {
      if (__webShareFilesSupported !== null) return __webShareFilesSupported;
      try {
        if (!navigator.share || !navigator.canShare || typeof File === 'undefined') {
          __webShareFilesSupported = false;
          return false;
        }
        const probe = new File([''], 'probe.json', { type: 'application/json' });
        __webShareFilesSupported = !!navigator.canShare({ files: [probe] });
      } catch (e) {
        __webShareFilesSupported = false;
      }
      return __webShareFilesSupported;
    }

    // Share a single round via the native OS share sheet (Web Share API L2).
    // Falls back to a regular download if the share flow is unavailable or fails.
    function shareSingleRound(roundId) {
      const round = (state.appState.rounds || []).find(function (r) { return r.id === roundId; })
        || getOpenRounds().find(function (r) { return r.id === roundId; });
      if (!round) { showToast('Runde nicht gefunden.'); return; }
      const payload = buildSingleRoundPayload(round);
      const data = JSON.stringify(payload, null, 2);
      const stamp = formatDateFile(round.date || round.createdAt);
      const slug = slugifyCourseName(round.courseName);
      const filename = stamp + '_' + slug + '_round.json';

      if (!canShareFiles()) {
        // No Web Share -> fallback to download.
        exportSingleRound(roundId);
        return;
      }
      try {
        const file = new File([data], filename, { type: 'application/json' });
        if (!navigator.canShare({ files: [file] })) {
          exportSingleRound(roundId);
          return;
        }
        const shareData = {
          files: [file],
          title: 'Golf-Runde teilen',
          text: 'Runde vom ' + formatDate(round.date || round.createdAt) +
                ' · ' + (round.courseName || '')
        };
        navigator.share(shareData).catch(function (err) {
          // AbortError = user cancelled the native share sheet -> silent noop.
          if (err && err.name === 'AbortError') return;
          // Any other share failure -> fall back to a plain download.
          exportSingleRound(roundId);
        });
      } catch (e) {
        exportSingleRound(roundId);
      }
    }

    // ============================================================
    // History screen (v1.3)
    // ============================================================
    // Build a sorted snapshot of all saved rounds for the history table.
    // Rounds are sorted by updatedAt desc (fallback createdAt / date).
    function getHistoryRounds() {
      const list = (state.appState.rounds || []).slice();
      list.sort(function (a, b) {
        const ta = new Date(a.updatedAt || a.createdAt || a.date || 0).getTime();
        const tb = new Date(b.updatedAt || b.createdAt || b.date || 0).getTime();
        return tb - ta;
      });
      return list;
    }
    function renderHistory() {
      const root = document.getElementById('screen-history');
      root.innerHTML = '';
      const scroll = el('div', { class: 'scroll-area' });
      const wrap = el('div', { class: 'history-wrap' });

        // Action buttons: Share (via Web Share API) + Download + Delete

    // ============================================================

    // ============================================================
    // Toast
    // ============================================================
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('is-visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {

      }, 2000);
    }

    // ============================================================
    // Helpers
    // ============================================================
    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const k in attrs) {
          if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
          if (k === 'class') node.className = attrs[k];
          else node.setAttribute(k, attrs[k]);
        }
      }
      if (children) {
        children.forEach(function (c) {
          if (c == null || c === false) return;
          if (typeof c === 'string' || typeof c === 'number') {
            node.appendChild(document.createTextNode(String(c)));
          } else {
            node.appendChild(c);
          }
        });
      }
      return node;
    }
    // Attribut-Satz, der Androids/Chromes Autofill davon abhaelt, ein Feld als
    // Login-/Adress-/Zahlungsfeld zu behandeln (verhindert das Anbieten echter
    // Passwoerter/Karten/Adressen und die entsprechenden Chips). Die System-Leiste
    // selbst ist Browser-UI und nicht ausblendbar — das hier haelt aber die Daten
    // fern. `nameToken` muss neutral sein (keine Woerter wie name/mail/tel/adresse).
    function noAutofillAttrs(nameToken) {
      return {
        name: nameToken,
        autocomplete: 'off',
        autocorrect: 'off',
        spellcheck: 'false',
        'data-1p-ignore': '',
        'data-lpignore': 'true',
        'data-bwignore': '',
        'data-form-type': 'other',
        'data-protonpass-ignore': ''
      };
    }
    // UI date: tt.mm.jjjj (dd.mm.yyyy)
    function formatDate(iso) {
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = d.getFullYear();
        return dd + '.' + mm + '.' + yy;
      } catch (e) {
        return '';
      }
    }
    // UI time: HH:MM
    function formatTime(iso) {
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return hh + ':' + mi;
      } catch (e) {
        return '';
      }
    }
    // Filename date: jjjj.tt.mm (yyyy.dd.mm) for backups / exports
    function formatDateFile(iso) {
      try {
        const d = iso ? new Date(iso) : new Date();
        if (isNaN(d.getTime())) return '';
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = d.getFullYear();
        return yy + '.' + dd + '.' + mm;
      } catch (e) {
        return '';
      }
    }

    // ============================================================
    // Master render & init
    // ============================================================
    function renderAll() {
      // toggle screen visibility (local var 'screenEl' avoids shadowing 'el' helper)
      ['setup', 'play', 'results', 'history', 'data'].forEach(function (name) {
        const screenEl = document.getElementById('screen-' + name);
        screenEl.classList.toggle('is-active', name === state.activeScreen);
      });
      renderTopbar();
      renderBottomNav();
      if (state.activeScreen === 'setup') renderSetup();
      else if (state.activeScreen === 'play') renderPlay();
      else if (state.activeScreen === 'results') renderResults();
      else if (state.activeScreen === 'history') renderHistory();
      else if (state.activeScreen === 'data') renderData();
    }

    function bindGlobalEvents() {
      const nav = document.getElementById('bottomnav');
      nav.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const target = btn.getAttribute('data-screen');
          setScreen(target);
        });
      });
      // overlay backdrop close
      overlayRoot.addEventListener('click', function (e) {
        if (e.target && e.target.getAttribute('data-overlay-close') === 'true') {
          closeOverlay();
        }
      });
      // ESC closes overlay
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlayRoot.classList.contains('is-open')) {
          closeOverlay();
        }
      });
      // Flush pending autosave before unload / tab hide so no input is lost.
      window.addEventListener('beforeunload', function () { flushAutosave(); });
      window.addEventListener('pagehide', function () { flushAutosave(); });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') flushAutosave();
      });
      // Vollbild nach unbeabsichtigtem Verlassen (Wischen/Zurueck) beim naechsten
      // Tipp wieder herstellen -> die Leisten bleiben "immer" aus, bis man die
      // App bewusst verlaesst (oder den Vollbild-Schalter nutzt).
      function onFsChange() {
        if (!isAppFullscreen()) {
          if (__fsSuppressReArm) { __fsSuppressReArm = false; return; }
          __fsArmed = false;
          armFullscreenOnFirstGesture();
        }
      }
      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('webkitfullscreenchange', onFsChange);
      // Bildschirmtastatur: dafuer sorgen, dass Eingabefelder NIE verdeckt werden.
      setupKeyboardAwareness();
    }

    // ============================================================
    // Tastatur-Bewusstsein (Eingabefelder nie von der Tastatur verdeckt)
    // ============================================================
    // Auf dem Handy verkleinert die Bildschirmtastatur nur den SICHTBAREN
    // (visual) Viewport, nicht das fixierte App-Layout (html/body height:100%).
    // Ein Sheet ist am unteren Rand verankert und liegt dann hinter der Tastatur.
    // Loesung – projektweit fuer JEDES Feld:
    //   (a) --kb  = gemessene Tastaturhoehe -> Sheets werden darueber gehoben,
    //   (b) --ovh = sichtbare Hoehe        -> Overlay-Inhalt bleibt scrollbar,
    //   (c) --dtop= Mitte des sichtbaren Bereichs -> Dialoge bleiben zentriert,
    //   (d) das fokussierte Feld wird in den sichtbaren Bereich gescrollt.
    function isEditableField(el) {
      if (!el || el.nodeType !== 1) return false;
      const t = el.tagName;
      if (t === 'TEXTAREA' || t === 'SELECT') return true;
      if (t === 'INPUT') {
        const it = (el.getAttribute('type') || 'text').toLowerCase();
        // Nur Felder, die eine Tastatur oeffnen (Buttons/Checkboxen/Slider nicht).
        return ['button', 'submit', 'reset', 'checkbox', 'radio', 'range',
                'file', 'color', 'hidden', 'image'].indexOf(it) === -1;
      }
      return el.isContentEditable === true;
    }
    function scrollFocusedIntoView() {
      const el = document.activeElement;
      if (!isEditableField(el)) return;
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      catch (e) { try { el.scrollIntoView(); } catch (_) {} }
    }
    let __kbSetupDone = false;
    function setupKeyboardAwareness() {
      if (__kbSetupDone) return;   // nur einmal Listener registrieren
      __kbSetupDone = true;
      const root = document.documentElement;
      const vv = window.visualViewport;
      if (vv) {
        const update = function () {
          const h = vv.height;
          if (!h) return;   // Viewport noch nicht bereit -> CSS-Defaults (90vh/50%/0)
          // Tastaturhoehe = Layout-Hoehe minus sichtbare Hoehe (minus evtl. Offset).
          const kb = Math.max(0, Math.round(window.innerHeight - h - vv.offsetTop));
          if (kb > 120) {
            // Echte Bildschirmtastatur sichtbar -> Overlays in den Restbereich zwingen.
            root.style.setProperty('--kb', kb + 'px');
            root.style.setProperty('--ovh', Math.max(160, Math.round(h - 12)) + 'px');
            root.style.setProperty('--dtop', Math.round(vv.offsetTop + h / 2) + 'px');
          } else {
            // Keine Tastatur (oder Layout wurde nativ verkleinert) -> Original-Defaults.
            root.style.setProperty('--kb', '0px');
            root.style.removeProperty('--ovh');
            root.style.removeProperty('--dtop');
          }
        };
        update();
        vv.addEventListener('resize', function () { update(); setTimeout(scrollFocusedIntoView, 60); });
        vv.addEventListener('scroll', update);
        window.addEventListener('resize', update);
        window.addEventListener('orientationchange', function () { setTimeout(update, 200); });
      }
      // Immer (auch ohne visualViewport-API): nach dem Fokussieren – sobald die
      // Tastatur oben ist – das Feld in den sichtbaren Bereich scrollen.
      document.addEventListener('focusin', function (e) {
        if (isEditableField(e.target)) setTimeout(scrollFocusedIntoView, 300);
      });
    }

    // ============================================================
    // App-Vollbild (Browser-/System-Leisten ausblenden)
    // ============================================================
    // Im Browser-Tab lassen sich URL-Leiste, Android-Statusbar und die unteren
    // Steuerelemente nur ueber die Fullscreen-API ausblenden — und die verlangt
    // eine Nutzergeste. Darum: beim ERSTEN Tippen einmalig Vollbild anfordern
    // (nur auf Touch-Geraeten, damit Desktop nicht ueberrascht wird). Wieder
    // sichtbar per Wischen von unten; ein Schalter auf dem Daten-Screen erlaubt
    // bewusstes Ein-/Ausschalten.
    function appFullscreenSupported() {
      const el = document.documentElement;
      return !!(el.requestFullscreen || el.webkitRequestFullscreen);
    }
    function isAppFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function enterAppFullscreen() {
      const el = document.documentElement;
      const rf = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!rf || isAppFullscreen()) return;
      try {
        const p = rf.call(el, { navigationUI: 'hide' });
        if (p && typeof p.catch === 'function') p.catch(function () {});
      } catch (e) {
        try { rf.call(el); } catch (_) {}
      }
    }
    function exitAppFullscreen() {
      const xf = document.exitFullscreen || document.webkitExitFullscreen;
      if (xf && isAppFullscreen()) { try { xf.call(document); } catch (e) {} }
    }
    let __fsSuppressReArm = false;
    function toggleAppFullscreen() {
      // Bewusstes Verlassen ueber den Schalter -> Leisten sichtbar lassen und
      // NICHT beim naechsten Tipp wieder verstecken.
      if (isAppFullscreen()) { __fsSuppressReArm = true; exitAppFullscreen(); }
      else enterAppFullscreen();
    }
    let __fsArmed = false;
    function armFullscreenOnFirstGesture() {
      const touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (__fsArmed || !touch || !appFullscreenSupported()) return;
      __fsArmed = true;
      const handler = function () {
        document.removeEventListener('touchend', handler, true);
        document.removeEventListener('click', handler, true);
        enterAppFullscreen();
      };
      // Capture-Phase: laeuft mit der ersten Geste, ohne den eigentlichen
      // Button-Klick zu verschlucken (kein preventDefault).
      document.addEventListener('touchend', handler, true);
      document.addEventListener('click', handler, true);
    }

    // Bittet den Browser, den lokalen Speicher (Spieler/Runden) als "persistent"
    // zu markieren. Das schuetzt vor automatischer Verdraengung bei Speicher-
    // knappheit und macht beilaeufiges Loeschen (nur "Cache leeren") unwahr-
    // scheinlicher — besonders, wenn die App per "Zum Startbildschirm hinzufuegen"
    // installiert ist. Ein bewusstes "Websitedaten/Cookies loeschen" kann es NICHT
    // verhindern (deshalb bleibt der Export/das Backup die Absicherung).
    function requestPersistentStorage() {
      try {
        if (navigator.storage && typeof navigator.storage.persist === 'function') {
          navigator.storage.persist().then(function (granted) {
            state.storagePersisted = !!granted;
          }).catch(function () {});
        }
      } catch (e) { /* ignore */ }
    }

    // Ladebildschirm-Steuerung: bestimmten Fortschritt setzen (schaltet die
    // Unbestimmt-Animation ab) und den Splash am Ende ausblenden.
    function splashProgress(pct, msg) {
      const stripe = document.getElementById('splash-stripe');
      const fill = document.getElementById('splash-fill');
      const status = document.getElementById('splash-status');
      if (stripe) stripe.style.display = 'none';
      if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
      if (status && msg) status.textContent = msg;
    }
    function splashDone() {
      const el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('is-hidden');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
    }

    // Kursdaten pro Land laden: aus dem Geraete-Cache (offline/schnell), und wenn
    // online per data/index.json pruefen, ob es neuere/neue Laender-Dateien gibt
    // -> nur die geaenderten nachladen. Fuellt LOADED_COURSE_DB.
    async function loadCourseData() {
      const CACHE_NAME = 'course-data-v1';
      const readJson = async function (cache, url) {
        try { const r = cache ? await cache.match(url) : null; return r ? await r.json() : null; }
        catch (e) { return null; }
      };
      let cache = null;
      try { if (self.caches) cache = await caches.open(CACHE_NAME); } catch (e) { cache = null; }

      let stored = await readJson(cache, 'data/index.json');
      let manifest = stored;

      if (navigator.onLine !== false) {
        try {
          const fresh = await (await fetch('data/index.json', { cache: 'no-store' })).json();
          if (fresh && Array.isArray(fresh.countries)) {
            const storedHash = {};
            ((stored && stored.countries) || []).forEach(function (c) { storedHash[c.file] = c.hash; });
            const toFetch = [];
            for (let i = 0; i < fresh.countries.length; i++) {
              const c = fresh.countries[i];
              const cached = cache ? await cache.match('data/' + c.file) : null;
              if (!cached || storedHash[c.file] !== c.hash) toFetch.push(c);
            }
            for (let i = 0; i < toFetch.length; i++) {
              const c = toFetch[i];
              splashProgress(12 + Math.round(70 * (i + 1) / toFetch.length),
                'Golfplätze werden geladen … ' + c.iso + ' (' + (i + 1) + '/' + toFetch.length + ')');
              try {
                const resp = await fetch('data/' + c.file, { cache: 'no-store' });
                if (cache && resp && resp.ok) await cache.put('data/' + c.file, resp.clone());
              } catch (e) { /* einzelne Datei fehlgeschlagen -> spaeter erneut */ }
            }
            if (cache) {
              try { await cache.put('data/index.json', new Response(JSON.stringify(fresh),
                { headers: { 'Content-Type': 'application/json' } })); } catch (e) {}
            }
            manifest = fresh;
          }
        } catch (e) { /* offline/Netzfehler -> gecachte Daten verwenden */ }
      }

      splashProgress(86, 'Kursdaten werden aufbereitet …');
      const courses = [];
      if (manifest && Array.isArray(manifest.countries)) {
        for (let i = 0; i < manifest.countries.length; i++) {
          const c = manifest.countries[i];
          let data = await readJson(cache, 'data/' + c.file);
          if (!data && navigator.onLine !== false) {
            try { data = await (await fetch('data/' + c.file)).json(); } catch (e) { data = null; }
          }
          if (Array.isArray(data)) courses.push.apply(courses, data);
        }
      }
      LOADED_COURSE_DB = { version: (manifest && manifest.version) || null, courses: courses };
      __embeddedIdSet = null;   // Cache der Id-Menge neu aufbauen lassen
      return courses.length;
    }

    async function init() {
      // Service Worker registrieren (App-Shell offline + immer aktuell wenn online).
      if ('serviceWorker' in navigator) {
        try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
      }
      splashProgress(8, 'Programm gestartet …');
      let loaded = 0;
      try { loaded = await loadCourseData(); } catch (e) { loaded = 0; }
      loadState();
      requestPersistentStorage();
      // Autoritativer Reset bei neuem Datenstand — VOR newSetupDraft.
      syncEmbeddedCourses();
      state.activeScreen = 'setup';
      state.setupSubScreen = 'hub';
      state.setupDraft = newSetupDraft();
      bindGlobalEvents();
      renderAll();
      armFullscreenOnFirstGesture();
      if (loaded === 0) {
        // Erststart ohne Netz (o.ae.): App laeuft, aber ohne Kursdaten.
        splashProgress(100, 'Keine Kursdaten — bitte einmal mit Internet starten.');
        setTimeout(splashDone, 1600);
      } else {
        splashProgress(100, 'Bereit');
        setTimeout(splashDone, 300);
      }
    }
    // Show a dedicated restore prompt with meaningful context about the draft.
    function showDraftRestoreDialog(draft) {
      const course = getCourseForRound(draft);
      const courseName = draft.courseName || (course ? course.name : 'Unbekannter Platz');
      const dateStr = formatDate(draft.date || draft.createdAt);
      const names = (draft.playersInRound || []).map(function (p) { return p.displayName; }).join(', ');
      const savedDate = formatDate(draft.updatedAt);
      const savedTime = formatTime(draft.updatedAt);
      const holeInfo = draft.currentHole ? ('Loch ' + draft.currentHole) : '';

      const content = el('div');
      content.appendChild(el('div', { class: 'overlay-header' }, ['Laufende Runde gefunden']));
      const body = el('div', { class: 'overlay-body' });
      const info = el('div', { style: 'display:flex; flex-direction:column; gap:4px; font-size:13px;' });
      info.appendChild(el('div', {}, [el('strong', {}, ['Platz: ']), courseName]));
      info.appendChild(el('div', {}, [el('strong', {}, ['Datum: ']), dateStr]));
      if (names) info.appendChild(el('div', {}, [el('strong', {}, ['Spieler: ']), names]));
      if (holeInfo) info.appendChild(el('div', {}, [el('strong', {}, ['Stand: ']), holeInfo]));
      info.appendChild(el('div', { class: 'small', style: 'margin-top:6px;' }, [
        'Zuletzt gespeichert: ' + savedDate + (savedTime ? ' um ' + savedTime + ' Uhr' : '')
      ]));
      body.appendChild(info);
      content.appendChild(body);

      const actions = el('div', { class: 'overlay-actions' });
      const discardBtn = el('button', { class: 'btn btn-danger', type: 'button' }, ['Verwerfen']);
      discardBtn.addEventListener('click', function () {
        closeOverlay();
        discardDraft();
        showToast('Entwurf verworfen');
        renderAll();
      });
      const restoreBtn = el('button', { class: 'btn btn-primary', type: 'button' }, ['Wiederherstellen']);
      restoreBtn.addEventListener('click', function () {
        closeOverlay();
        state.activeRound = draft;
        state.segment = 'live';
        setScreen('play');
      });
      actions.appendChild(discardBtn);
      actions.appendChild(restoreBtn);
      content.appendChild(actions);
      openDialogContent(content);
    }

    // Interner Test-Hook: macht die zentralen Daten-Funktionen fuer
    // automatisierte End-to-End-Pruefungen mit echten Daten erreichbar
    // (die App selbst ist in einer IIFE gekapselt). Keine UI-Funktion.
    window.__scorecardTest = {
      convertGolfAppExport: convertGolfAppExport,
      looksLikeGolfAppExport: looksLikeGolfAppExport,
      mergeCoursesIntoAppState: mergeCoursesIntoAppState,
      syncEmbeddedCourses: syncEmbeddedCourses,
      calculatePlayingHandicap: calculatePlayingHandicap,
      resolveTeeRatingHoles: resolveTeeRatingHoles,
      buildEmbeddedCourses: buildEmbeddedCourses,
      auditCourse: auditCourse,
      auditCourses: auditCourses,
      importCourseDatabaseFromFile: importCourseDatabaseFromFile,
      importDataFromFile: importDataFromFile,
      sanitizeAppState: sanitizeAppState,
      getState: function () { return state; },
      saveState: saveState
    };

    // Script is at end of <body>, so DOM is typically already parsed here.
    // Guard against DOMContentLoaded having already fired (in which case the
    // listener would never run).
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
