  <div id="overlay-root" aria-hidden="true">
    <div class="overlay-backdrop" data-overlay-close="true"></div>
    <div id="overlay-content" class="overlay-content"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    // ============================================================
    // Constants & sample data
    // ============================================================
    const STORAGE_KEY = 'golfScorecardAppStateV1';
    const SCHEMA_VERSION = 1;
    const COURSE_DB_SCHEMA_VERSION = 1;

    // ISO-3166 alpha-2 -> deutscher Anzeigename (fuer die Laender-Suche in der Platzauswahl).
    const COUNTRY_NAMES = {
      CH: 'Schweiz', DE: 'Deutschland', AT: 'Oesterreich', LI: 'Liechtenstein',
      FR: 'Frankreich', IT: 'Italien', ES: 'Spanien', PT: 'Portugal',
      GB: 'Grossbritannien', IE: 'Irland', NL: 'Niederlande', BE: 'Belgien',
      LU: 'Luxemburg', DK: 'Daenemark', SE: 'Schweden', NO: 'Norwegen', FI: 'Finnland',
      US: 'USA', CA: 'Kanada'
    };
    function countryDisplayName(iso) {
      if (!iso) return '';
      return COUNTRY_NAMES[iso] || iso;
    }
    // Distinct country codes present in the loaded course DB, sorted by display name.
    function availableCountries() {
      const set = {};
      state.appState.courses.forEach(function (c) { if (c.country) set[c.country] = true; });
      return Object.keys(set).sort(function (a, b) {
        return countryDisplayName(a).localeCompare(countryDisplayName(b));
      });
    }

    const TEE_LABELS = {
      white:  'Weiss',
      yellow: 'Gelb',
      blue:   'Blau',
      red:    'Rot',
      black:  'Schwarz'
    };
    const TEE_ORDER = ['black', 'white', 'yellow', 'blue', 'red'];

    function uid(prefix) {
      return prefix + '-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    }

    // ============================================================
    // golf-app-export/1.0.0 -> App-Format Konverter
    // ------------------------------------------------------------
    // Die Kursdaten kommen als EINE Export-JSON aus dem Kursdaten-Tool
    // (schemaVersion "golf-app-export/1.0.0"). Diese Logik ist 1:1 der
    // gepruefte Referenz-Konverter (gleich wie im Adapter):
    //  - Plaetze OHNE clubName werden uebersprungen (ohne Name/Land/GPS
    //    in der App nicht auffindbar; werden im Kursdaten-Tool bereinigt).
    //  - Leere angehaengte Loecher entfernt (18->9-Fehldeklarationen).
    //  - strokeIndex auf eine 1..N-Permutation normalisiert.
    //  - fehlende CR/SR neutral gesetzt (CR=Par, SR=113, ratingEstimated).
    //  - ratingHoles je Tee: deckt das Rating 18 Loch oder die eigene
    //    Lochzahl (CR > Par*1.5 => 18) — Basis der anteiligen Vorgabe.
    // ============================================================
    const REGION_DACH = { CH: 1, DE: 1, AT: 1, LI: 1 };
    const REGION_EU = {
      CH: 1, DE: 1, AT: 1, LI: 1, FR: 1, IT: 1, ES: 1, PT: 1, GB: 1, IE: 1,
      NL: 1, BE: 1, LU: 1, DK: 1, SE: 1, NO: 1, FI: 1
    };
    const REGION_NA = { US: 1, CA: 1 };
    const GAE_LENGTH_COLS = ['white', 'yellow', 'blue', 'red'];

    function buildRegionTags(iso) {
      let tags;
      if (REGION_DACH[iso]) tags = ['EU', 'DACH'];
      else if (REGION_EU[iso]) tags = ['EU'];
      else if (REGION_NA[iso]) tags = ['NA'];
      else tags = [];
      tags.push(countryDisplayName(iso) || '?');
      return tags;
    }
    function gaeIsNum(v) { return typeof v === 'number' && isFinite(v); }
    function gaeNumOr(v, fb) { return gaeIsNum(v) ? v : fb; }
    function gaeCombineName(club, course) {
      club = String(club || '').trim(); course = String(course || '').trim();
      if (!course || course === club) return club || course;
      return club + ' – ' + course;
    }
    // Platzhalter-Name = enthaelt keinen einzigen Buchstaben (nur Zahlen/Zeichen,
    // z.B. "17", "02-01", "14-1"). Solche OSM-Node-Titel sind in der Liste nutzlos.
    function gaeIsPlaceholderName(s) {
      s = String(s || '').trim();
      // Platzhalter = vorhanden, aber KEIN Buchstabe (nur Zahlen/Zeichen, z.B. "17").
      // \p{L} erkennt Buchstaben jeder Schrift (auch Griechisch/Kyrillisch), damit
      // nicht-lateinische Platznamen nicht faelschlich verworfen werden.
      return s.length > 0 && !/\p{L}/u.test(s);
    }
    function gaeMaxLen(h) {
      const L = h.lengths || {}; let best = 0;
      GAE_LENGTH_COLS.forEach(function (c) { const v = L[c]; if (gaeIsNum(v) && v > best) best = v; });
      return best;
    }
    function gaeEstimatePar(h) {
      const m = gaeMaxLen(h);
      if (m <= 0) return 4;
      if (m < 220) return 3;
      if (m <= 430) return 4;
      return 5;
    }
    function gaeHoleIsEmpty(h) {
      if (h.par != null || h.strokeIndex != null) return false;
      const L = h.lengths || {};
      return GAE_LENGTH_COLS.every(function (c) { return L[c] == null; });
    }
    function gaeIsPermutation(kept) {
      const n = kept.length; const seen = {};
      for (let i = 0; i < n; i++) {
        const s = kept[i].strokeIndex;
        if (!(typeof s === 'number' && isFinite(s) && s >= 1 && s <= n && Math.floor(s) === s)) return false;
        if (seen[s]) return false;
        seen[s] = 1;
      }
      return true;
    }
    function gaeValidSI(kept) {
      const seen = {};
      for (let i = 0; i < kept.length; i++) {
        const s = kept[i].strokeIndex;
        if (!(typeof s === 'number' && isFinite(s) && s >= 1 && Math.floor(s) === s)) return false;
        if (seen[s]) return false;
        seen[s] = 1;
      }
      return true;
    }
    function gaeCompressSI(kept) {
      const idx = kept.map(function (_, i) { return i; });
      idx.sort(function (a, b) { return kept[a].strokeIndex - kept[b].strokeIndex; });
      const si = new Array(kept.length);
      idx.forEach(function (orig, rank) { si[orig] = rank + 1; });
      return si;
    }
    function gaeSynthSI(kept) {
      const idx = kept.map(function (_, i) { return i; });
      idx.sort(function (a, b) {
        const ma = gaeMaxLen(kept[a]), mb = gaeMaxLen(kept[b]);
        if (mb !== ma) return mb - ma;
        const pa = kept[a].par || 0, pb = kept[b].par || 0;
        if (pb !== pa) return pb - pa;
        return a - b;
      });
      const si = new Array(kept.length);
      idx.forEach(function (orig, rank) { si[orig] = rank + 1; });
      return si;
    }
    // Ein golf-app-export-Kurs -> App-Kurs. null, wenn uebersprungen.
    function convertGolfAppExportCourse(src, warnings, stats) {
      const clubRaw = String(src.clubName || '').trim();
      const courseRaw = String(src.courseName || '').trim();
      const clubReal = clubRaw.length > 0 && !gaeIsPlaceholderName(clubRaw);
      const courseReal = courseRaw.length > 0 && !gaeIsPlaceholderName(courseRaw);
      // Nur ueberspringen, wenn es GAR keinen echten Namen gibt (weder Club noch
      // Course). Ist der Clubname nur eine Zahl, aber der courseName echt (z.B.
      // "16" / "GolfResort Semlin am See - Kombination B/C"), nimm den courseName.
      if (!clubReal && !courseReal) {
        stats.skippedUnnamed++;
        stats.skippedList.push({
          courseId: src.courseId || '(ohne id)',
          courseName: courseRaw || clubRaw || '(kein Name)',
          holes: src.holesCount
        });
        return null;
      }
      const iso = src.country;
      // Ohne Laender-Code ist ein Platz im laender-strukturierten Ablauf nicht
      // auffindbar (kein Land-Filter, meist keine Koordinaten). Ueberspringen und
      // auflisten, damit er im Dashboard Land/Clubname bekommt.
      if (!iso || !String(iso).trim()) {
        stats.skippedOther++;
        stats.skippedList.push({
          courseId: src.courseId || '(ohne id)',
          courseName: courseRaw || clubRaw || '(kein Name)',
          holes: src.holesCount,
          reason: 'kein Land'
        });
        return null;
      }
      const club = clubReal ? clubRaw : courseRaw;   // fuer den DB-Eintrag
      const label = clubReal ? gaeCombineName(clubRaw, courseReal ? courseRaw : '') : courseRaw;

      const holesSrc = Array.isArray(src.holes) ? src.holes : [];
      const kept = holesSrc.slice();
      while (kept.length && gaeHoleIsEmpty(kept[kept.length - 1])) kept.pop();
      if (!kept.length) { stats.skippedOther++; warnings.push(label + ': keine Lochdaten'); return null; }
      const holeAdjusted = kept.length !== holesSrc.length;
      if (holeAdjusted) warnings.push(label + ': holesCount ' + src.holesCount + ' → ' + kept.length);

      let parEst = false;
      const pars = kept.map(function (h) {
        if (h.par == null) { parEst = true; return gaeEstimatePar(h); }
        return h.par;
      });
      if (parEst) warnings.push(label + ': fehlende Par-Werte geschaetzt');

      let finalSI;
      if (gaeIsPermutation(kept)) finalSI = kept.map(function (h) { return h.strokeIndex; });
      else if (gaeValidSI(kept)) { finalSI = gaeCompressSI(kept); warnings.push(label + ': strokeIndex auf 1..N normalisiert'); }
      else { finalSI = gaeSynthSI(kept); warnings.push(label + ': strokeIndex neu berechnet'); }

      const outHoles = kept.map(function (h, i) {
        return { holeNumber: (h.number != null ? h.number : i + 1), par: pars[i], strokeIndex: finalSI[i] };
      });
      const parTotal = outHoles.reduce(function (a, h) { return a + h.par; }, 0);
      const holeCount = outHoles.length;

      const srcTees = (Array.isArray(src.tees) ? src.tees.slice() : []).sort(function (a, b) {
        const ia = TEE_ORDER.indexOf(a.color), ib = TEE_ORDER.indexOf(b.color);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      const outTees = srcTees.map(function (t) {
        const col = t.color;
        const ratingEst = (t.courseRating == null) || (t.slopeRating == null);
        const hy = kept.map(function (h) { const v = (h.lengths || {})[col]; return gaeIsNum(v) ? v : null; });
        const effCR = gaeNumOr(t.courseRating, parTotal);
        const ratingHoles = (holeCount < 18)
          ? (effCR > parTotal * 1.5 ? 18 : holeCount)
          : 18;
        return {
          colorKey: col,
          colorLabel: TEE_LABELS[col] || String(col || '').charAt(0).toUpperCase() + String(col || '').slice(1),
          courseRating: effCR,
          slopeRating: gaeNumOr(t.slopeRating, 113),
          par: parTotal,
          holeYardage: hy,
          totalDistance: (t.totalDistance != null ? t.totalDistance : null),
          unit: 'm',
          ratingHoles: ratingHoles,
          ratingEstimated: ratingEst
        };
      });
      if (!outTees.length) { stats.skippedOther++; warnings.push(label + ': keine Tees'); return null; }

      const course = {
        id: src.courseId,
        name: label,
        country: iso,
        countryName: countryDisplayName(iso) || '?',
        region: src.city || null,
        city: src.city || null,
        regionTags: buildRegionTags(iso),
        location: { lat: gaeIsNum(src.lat) ? src.lat : null, lng: gaeIsNum(src.lon) ? src.lon : null },
        holeCount: holeCount,
        layouts: [{ id: 'standard', name: holeCount + ' Loch',
                    holeNumbers: outHoles.map(function (h) { return h.holeNumber; }), isDefault: true }],
        source: 'golf-app-export',
        sourceSchema: 'golf-app-export/1.0.0',
        clubId: src.clubId,
        clubName: club,
        courseName: src.courseName,
        confirmedAt: src.confirmedAt || null,
        lastSyncedAt: src.confirmedAt || null,
        holes: outHoles,
        tees: outTees
      };
      if (holeAdjusted) course.holeCountAdjusted = true;
      return course;
    }
    // Ganze Export-Datei -> { courses, warnings, stats }
    function convertGolfAppExport(payload) {
      const raw = Array.isArray(payload) ? payload
        : (payload && Array.isArray(payload.courses)) ? payload.courses : null;
      if (!raw) throw new Error('shape');
      const warnings = [];
      const stats = { skippedUnnamed: 0, skippedOther: 0, skippedList: [] };
      const out = [];
      raw.forEach(function (src) {
        const c = convertGolfAppExportCourse(src, warnings, stats);
        if (c) out.push(c);
      });
      out.sort(function (a, b) { return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()); });
      return { courses: out, warnings: warnings, stats: stats };
    }
    // ============================================================
    // Datenpruefung — Auffaelligkeiten in Kursdaten aufspueren
    // ------------------------------------------------------------
    // Fachliche Plausibilitaet je Platz, damit Fehler (z.B. ein CR-Zahlendreher
    // wie Wylihof-Rot 26.2 statt 36.2, der die Spielvorgabe komplett verfaelscht)
    // direkt nach dem Import angezeigt werden — VOR der Runde auf dem Platz.
    function auditCourse(c) {
      const issues = [];
      const tees = Array.isArray(c.tees) ? c.tees : [];
      const teeName = function (t) { return t.colorLabel || t.colorKey || 'Tee'; };
      tees.forEach(function (t) {
        if (typeof t.slopeRating === 'number' && (t.slopeRating < 55 || t.slopeRating > 155)) {
          issues.push({ level: 'error', text: teeName(t) + ': Slope ' + t.slopeRating + ' ausserhalb 55–155' });
        }
        if (t.ratingEstimated) {
          issues.push({ level: 'warn', text: teeName(t) + ': CR/SR fehlte in den Daten (neutral gesetzt)' });
        }
      });
      // Par-Plausibilitaet: eine zu hohe Par-Summe deutet auf fehlerhafte
      // Loch-Pars hin (echter Fall: Wylihof "Gelb/Blau" hatte Par 82 statt 73 —
      // ein Par-6 und neun Par-5 in der Quelle). Nur nach OBEN pruefen: kurze
      // Executive-/Par-3-Plaetze (z.B. Nuembrecht Par 58 auf 18 Loch) sind
      // legitim tief. Bei kaputtem Par ist der CR/Par-Vergleich unten sinnlos,
      // darum wird er dann uebersprungen.
      let parSuspect = false;
      if (typeof c.holeCount === 'number' && c.holeCount > 0) {
        const parSum = (c.holes || []).reduce(function (a, h) {
          return a + (typeof h.par === 'number' ? h.par : 0); }, 0);
        if (parSum > c.holeCount * 4.3) {
          parSuspect = true;
          issues.push({ level: 'error', text: 'Par-Summe ' + parSum + ' ist fuer ' +
            c.holeCount + ' Loch zu hoch — Loch-Pars pruefen' });
        }
      }
      // CR-Plausibilitaet gegen das Par des Tees (faengt Zahlendreher wie
      // Wylihof-Rot Gelb 26.2 statt 36.2 oder Waldkirch 60.6 statt 70.6). Ein CR
      // gehoert entweder zu den EIGENEN Loechern (CR ~ Par) oder zu einer vollen
      // 18-Loch-Runde (CR ~ Par * 18/Loecher). Nur flaggen, wenn der CR zu KEINER
      // der beiden Basen passt — so bleiben Damen-Tees (CR hoeher als bei den
      // Herren) und gemischte 9/18-Loch-Ratings in einem Kurs unmarkiert, waehrend
      // ein echter Zahlendreher (CR weit unter Par) sicher auffaellt.
      if (!parSuspect) {
        const shortCourse = typeof c.holeCount === 'number' && c.holeCount > 0 && c.holeCount < 18;
        tees.forEach(function (t) {
          if (typeof t.courseRating !== 'number' || typeof t.par !== 'number' || t.par <= 0) return;
          const bases = [t.par];
          if (shortCourse) bases.push(t.par * 18 / c.holeCount);
          let fits = bases.some(function (p) {
            return t.courseRating >= p - 7 && t.courseRating <= p + 12; });
          // Ausnahme: ein Tee mit vollem 18-Loch-Rating auf einem <18-Loch-Platz
          // (z.B. Otelfingen Academy, 6 Loch, CR 73 ratingHoles=18) darf einen
          // normalen 18-Loch-CR tragen — die App skaliert ihn beim Spielen. Das
          // gilt bewusst NUR fuer Kurzplaetze, damit echte 18-Loch-Ausreisser
          // (deutsche Weiss/Blau-Cluster, Nuembrecht) markiert bleiben.
          if (!fits && shortCourse && resolveTeeRatingHoles(t, c.holeCount) === 18 &&
              t.courseRating >= 62 && t.courseRating <= 80) {
            fits = true;
          }
          if (!fits) {
            issues.push({ level: 'error', text: teeName(t) + ': CR ' + t.courseRating +
              ' passt nicht zum Par ' + t.par + ' — bitte pruefen (Zahlendreher?)' });
          }
        });
      }
      if (!c.location || typeof c.location.lat !== 'number' || typeof c.location.lng !== 'number') {
        issues.push({ level: 'warn', text: 'keine Koordinaten — nicht per GPS auffindbar' });
      }
      return issues;
    }
    // Prueft eine Liste von Plaetzen; liefert nur die mit Auffaelligkeiten.
    function auditCourses(courses) {
      const report = [];
      (courses || []).forEach(function (c) {
        const issues = auditCourse(c);
        if (issues.length) report.push({ id: c.id, name: c.name, issues: issues });
      });
      return report;
    }
    // Zeigt das Datenpruefungs-Ergebnis als scrollbare Liste (Platz + Hinweise).
    function renderAuditList(report) {
      const wrap = el('div', { class: 'audit-list' });
      (report.items || []).forEach(function (entry) {
        const box = el('div', { class: 'audit-item' });
        box.appendChild(el('div', { class: 'audit-course' }, [entry.name || entry.id]));
        entry.issues.forEach(function (iss) {
          box.appendChild(el('div', { class: 'audit-issue audit-' + (iss.level || 'warn') }, [
            (iss.level === 'error' ? '⚠ ' : '• ') + iss.text
          ]));
        });
        wrap.appendChild(box);
      });
      return wrap;
    }
    function showImportAuditDialog(report) {
      const content = el('div');
      content.appendChild(el('div', { class: 'overlay-header' }, ['Datenpruefung nach Import']));
      const body = el('div', { class: 'overlay-body' });
      const nErr = (report.items || []).reduce(function (a, e) {
        return a + e.issues.filter(function (i) { return i.level === 'error'; }).length;
      }, 0);
      if (report.count > 0) {
        body.appendChild(el('div', { class: 'small', style: 'margin-bottom:8px;' }, [
          report.count + ' Platz/Plaetze mit Auffaelligkeiten' +
          (nErr ? ' (' + nErr + ' kritisch)' : '') +
          '. Bitte im Kursdaten-Tool pruefen und korrigieren, BEVOR du damit auf den Platz gehst — ' +
          'ein falsches Course-Rating verfaelscht die Spielvorgabe.'
        ]));
        body.appendChild(renderAuditList(report));
      }
      // Uebersprungene Plaetze — nach GRUND gruppiert, damit der Rat stimmt
      // (kein Clubname vs. kein Land brauchen unterschiedliche Korrekturen).
      const skipped = report.skipped || [];
      if (skipped.length) {
        const renderSkipGroup = function (title, advice, list) {
          if (!list.length) return;
          body.appendChild(el('div', { class: 'section-title', style: 'margin-top:12px;' }, [title]));
          body.appendChild(el('div', { class: 'small', style: 'margin-bottom:6px;' }, [advice]));
          const box = el('div', { class: 'audit-list' });
          list.forEach(function (s) {
            const it = el('div', { class: 'audit-item' });
            it.appendChild(el('div', { class: 'audit-course' }, [s.courseName || '(kein Name)']));
            it.appendChild(el('div', { class: 'audit-issue audit-warn' }, [
              (s.holes ? s.holes + ' Loch · ' : '') + s.courseId ]));
            box.appendChild(it);
          });
          body.appendChild(box);
        };
        const noLand = skipped.filter(function (s) { return s.reason === 'kein Land'; });
        const noName = skipped.filter(function (s) { return s.reason !== 'kein Land'; });
        renderSkipGroup('Uebersprungen (kein Clubname)',
          noName.length + ' Platz/Plaetze wurden nicht uebernommen, weil in der Datei der Clubname ' +
          'fehlt. Im Dashboard einen Namen ergaenzen, dann kommen sie beim naechsten Import mit.',
          noName);
        renderSkipGroup('Uebersprungen (kein Land)',
          noLand.length + ' Platz/Plaetze wurden nicht uebernommen, weil in der Datei kein Land ' +
          'hinterlegt ist. Im Dashboard das Land (und ggf. den Clubnamen) ergaenzen, dann kommen sie ' +
          'beim naechsten Import mit.',
          noLand);
      }
      content.appendChild(body);
      const actions = el('div', { class: 'overlay-actions' });
      const ok = el('button', { class: 'btn btn-primary', type: 'button' }, ['Verstanden']);
      ok.addEventListener('click', closeOverlay);
      actions.appendChild(ok);
      content.appendChild(actions);
      openDialogContent(content);
    }

    // Erkennung: ist das eine golf-app-export-Datei (statt App-Format)?
    function looksLikeGolfAppExport(parsed) {
      if (!parsed || typeof parsed !== 'object') return false;
      if (typeof parsed.schemaVersion === 'string' && parsed.schemaVersion.indexOf('golf-app-export') === 0) return true;
      const cs = Array.isArray(parsed.courses) ? parsed.courses : (Array.isArray(parsed) ? parsed : []);
      return !!(cs.length && cs[0] && (cs[0].courseId || (cs[0].tees && cs[0].tees[0] && cs[0].tees[0].color)));
    }

    // Kursdaten stehen NICHT mehr im Code — sie werden zur Laufzeit pro Land
    // aus data/ geladen und auf dem Geraet gecacht (siehe loadCourseData()).
    let LOADED_COURSE_DB = { version: null, courses: [] };

    // Eingebettete Kurs-Datenbank -> App-Kurse (deep copy, damit spaetere
    // Mutationen am appState die eingebettete Vorlage nie veraendern).
    function buildEmbeddedCourses() {
      return JSON.parse(JSON.stringify(LOADED_COURSE_DB.courses || []));
    }
    function buildSamplePlayers() {
      const now = new Date().toISOString();
      return [
        { id: 'player-mueller', name: 'Mueller',  handicapIndex: 18.4, defaultTeeColorKey: 'yellow', createdAt: now },
        { id: 'player-schmidt', name: 'Schmidt',  handicapIndex: 28.1, defaultTeeColorKey: 'red',    createdAt: now },
        { id: 'player-weber',   name: 'Weber',    handicapIndex:  9.2, defaultTeeColorKey: 'white',  createdAt: now }
      ];
    }
    function defaultGpsState() {
      return { status: 'idle', lastError: null, accuracy: null, lat: null, lng: null, updatedAt: null };
    }
    function defaultAppState() {
      return {
        version: SCHEMA_VERSION,
        // Two separate layers:
        //  - rounds[]:     finished / manually archived rounds  (roundHistory)
        //  - openRounds[]: draft / in-progress rounds           (autosaved)
        rounds: [],
        openRounds: [],
        players: buildSamplePlayers(),
        courses: buildEmbeddedCourses(),
        // Frischer State enthaelt die volle eingebettete DB -> Stempel setzen,
        // damit syncEmbeddedCourses() nicht unnoetig erneut merged.
        embeddedDbVersion: LOADED_COURSE_DB.version || null,
        gps: defaultGpsState(),
        lastBackupAt: null   // Zeitpunkt des letzten "Alle Daten exportieren"
      };
    }

    // ============================================================
    // Runtime state
    // ============================================================
    const state = {
      appState: null,
      storageAvailable: true,
      activeScreen: 'setup',
      segment: 'live',
      setupDraft: null,
      activeRound: null
    };

    // ============================================================
    // Persistence
    // ============================================================
    // Ensure every round references a still-existing course; drop orphans to
    // avoid crashes when render accesses course.name / course.holes.
    function sanitizeCourse(c) {
      if (!c || typeof c !== 'object') return null;
      if (!c.id || !c.name) return null;
      c.name = String(c.name);
      c.tees = (Array.isArray(c.tees) ? c.tees : []).filter(function (t) {
        return t && typeof t === 'object';
      });
      c.holes = (Array.isArray(c.holes) ? c.holes : []).filter(function (h) {
        return h && typeof h === 'object' && typeof h.par === 'number';
      });
      if (typeof c.holeCount !== 'number' || c.holeCount <= 0) c.holeCount = c.holes.length || 18;
      // Tee-Zahlenfelder erzwingen: die App rechnet/rendert damit direkt
      // (.toFixed, Vorgabe-Formel). Kaputte Import-Daten -> neutrale Werte.
      const parSum = c.holes.reduce(function (a, h) { return a + h.par; }, 0) || 72;
      c.tees.forEach(function (t) {
        if (!t.colorKey) t.colorKey = 'yellow';
        if (!t.colorLabel) t.colorLabel = TEE_LABELS[t.colorKey] || String(t.colorKey);
        if (typeof t.par !== 'number' || !isFinite(t.par)) t.par = parSum;
        // Fehlendes CR/SR wird neutral ersetzt UND markiert, damit die
        // Datenpruefung es meldet (konsistent mit dem golf-app-export-Pfad).
        if (typeof t.courseRating !== 'number' || !isFinite(t.courseRating)) { t.courseRating = t.par; t.ratingEstimated = true; }
        if (typeof t.slopeRating !== 'number' || !isFinite(t.slopeRating)) { t.slopeRating = 113; t.ratingEstimated = true; }
        if (!Array.isArray(t.holeYardage)) t.holeYardage = [];
      });
      // Ohne Tees ist ein Platz nicht spielbar und crasht die Platzauswahl —
      // neutralen Standard-Tee ableiten statt Absturz (Werte sind markiert).
      if (c.tees.length === 0) {
        c.tees.push({ colorKey: 'yellow', colorLabel: 'Gelb', courseRating: parSum,
                      slopeRating: 113, par: parSum, holeYardage: [], ratingEstimated: true });
      }
      if (!Array.isArray(c.regionTags)) c.regionTags = [];
      if (!c.location || typeof c.location !== 'object') c.location = { lat: null, lng: null };
      if (typeof c.location.lat !== 'number') c.location.lat = null;
      if (typeof c.location.lng !== 'number') c.location.lng = null;
      if (!Array.isArray(c.layouts) || c.layouts.length === 0) {
        const nums = [];
        for (let i = 1; i <= c.holeCount; i++) nums.push(i);
        c.layouts = [{ id: 'standard', name: c.holeCount + ' Loch', holeNumbers: nums, isDefault: true }];
      }
      if (!c.source) c.source = 'imported';
      return c;
    }
    function sanitizeAppState(s) {
      if (!s || typeof s !== 'object') return defaultAppState();
      s.players = Array.isArray(s.players) ? s.players : [];
      s.courses = Array.isArray(s.courses) ? s.courses : [];
      s.rounds  = Array.isArray(s.rounds)  ? s.rounds  : [];
      s.courses = s.courses.map(sanitizeCourse).filter(Boolean);
      if (s.courses.length === 0) s.courses = buildEmbeddedCourses();
      const courseIds = new Set(s.courses.map(function (c) { return c.id; }));
      // Eine Runde braucht ihren Platz NUR, wenn sie keinen eigenen Snapshot
      // traegt: alle Render-Pfade bevorzugen r.courseSnapshot (getCourseForRound).
      // Frueher wurden hier Runden geloescht, deren Platz lokal fehlt — das
      // zerstoerte importierte Einzelrunden (geteilte Runde von fremdem Geraet)
      // und Runden auf Plaetzen, die nicht mehr in der Kurs-DB stehen.
      function roundHasUsableCourse(r) {
        if (courseIds.has(r.courseId)) return true;
        const snap = r.courseSnapshot;
        return !!(snap && typeof snap === 'object' && Array.isArray(snap.holes) && snap.holes.length > 0);
      }
      s.rounds = s.rounds.filter(function (r) {
        return r && r.courseId && Array.isArray(r.playersInRound) && roundHasUsableCourse(r);
      });
      // v1.5 migration: multiple open rounds.
      // Layered model:
      //   - rounds[]      : only finished rounds (history)
      //   - openRounds[]  : all in-progress rounds (draft / in_progress)
      if (!Array.isArray(s.openRounds)) s.openRounds = [];
      // Pull over a legacy single currentRoundDraft if present.
      if (s.currentRoundDraft && typeof s.currentRoundDraft === 'object') {
        if (s.currentRoundDraft.status === 'finished') {
          if (!s.rounds.some(function (r) { return r.id === s.currentRoundDraft.id; })) {
            s.rounds.push(s.currentRoundDraft);
          }
        } else {
          s.currentRoundDraft.status = 'in_progress';
          if (!s.openRounds.some(function (r) { return r.id === s.currentRoundDraft.id; })) {
            s.openRounds.push(s.currentRoundDraft);
          }
        }
        delete s.currentRoundDraft;
      }
      // Any non-finished round accidentally sitting in rounds[] moves into openRounds.
      const strays = s.rounds.filter(function (r) { return r.status !== 'finished'; });
      s.rounds = s.rounds.filter(function (r) { return r.status === 'finished'; });
      strays.forEach(function (r) {
        r.status = 'in_progress';
        if (!s.openRounds.some(function (x) { return x.id === r.id; })) s.openRounds.push(r);
      });
      // Legacy pointer no longer used — drop if present.
      if ('lastActiveRoundId' in s) delete s.lastActiveRoundId;
      // v1.1 migration: older rounds get default layout info + snapshot fields
      function sanitizeRoundFields(r, defaultStatus) {
        if (!r.courseLayoutId) r.courseLayoutId = 'standard';
        if (!Array.isArray(r.holeNumbers) || r.holeNumbers.length === 0) {
          const course = s.courses.find(function (c) { return c.id === r.courseId; });
          const n = (course && course.holeCount) || 18;
          const arr = [];
          for (let i = 1; i <= n; i++) arr.push(i);
          r.holeNumbers = arr;
        }
        if (!r.createdAt) r.createdAt = r.date || new Date().toISOString();
        if (!r.updatedAt) r.updatedAt = r.createdAt;
        if (!r.courseName) {
          const course = s.courses.find(function (c) { return c.id === r.courseId; });
          r.courseName = course ? course.name : 'Unbekannter Platz';
        }
        if (!r.courseSnapshot) {
          const course = s.courses.find(function (c) { return c.id === r.courseId; });
          if (course) r.courseSnapshot = JSON.parse(JSON.stringify(course));
        }
        if (!r.status) r.status = defaultStatus;
        if (!Array.isArray(r.holeScores)) r.holeScores = [];
        if (typeof r.currentHole !== 'number' || r.currentHole < 1) r.currentHole = 1;
        // Interna absichern (v.a. importierte Einzelrunden von fremden
        // Geraeten): jeder Spieler braucht ein strokesPerHole-Array, und
        // holeScores duerfen nur Loecher der Runde referenzieren — sonst
        // dereferenzieren computeTotals/Scorecard getHole(...) === null.
        const maxHole = r.holeNumbers[r.holeNumbers.length - 1] || 18;
        (Array.isArray(r.playersInRound) ? r.playersInRound : []).forEach(function (pir) {
          if (!pir || typeof pir !== 'object') return;
          if (!Array.isArray(pir.strokesPerHole)) pir.strokesPerHole = [];
          if (typeof pir.playingHandicap !== 'number' || !isFinite(pir.playingHandicap)) pir.playingHandicap = 0;
          if (typeof pir.handicapIndexAtRound !== 'number' || !isFinite(pir.handicapIndexAtRound)) pir.handicapIndexAtRound = 0;
        });
        r.holeScores = r.holeScores.filter(function (sc) {
          return sc && typeof sc === 'object' &&
                 typeof sc.holeNumber === 'number' && sc.holeNumber >= 1 && sc.holeNumber <= maxHole &&
                 typeof sc.playerInRoundIdx === 'number' &&
                 sc.playerInRoundIdx >= 0 && sc.playerInRoundIdx < (r.playersInRound || []).length;
        });
      }
      s.rounds.forEach(function (r) { sanitizeRoundFields(r, 'finished'); });
      // Sanitize & defensively filter open rounds.
      s.openRounds = s.openRounds.filter(function (r) {
        if (!r || !r.courseId) return false;
        if (!Array.isArray(r.playersInRound) || r.playersInRound.length === 0) return false;
        sanitizeRoundFields(r, 'in_progress');
        // Wie bei den beendeten Runden: ohne spielbaren Platz (weder in der DB
        // noch als Snapshot) wuerde die Play-Ansicht crashen -> nicht behalten.
        if (!roundHasUsableCourse(r)) return false;
        if (r.status === 'finished') {
          // Safety net: finished rounds must not live in openRounds
          s.rounds.push(r);
          return false;
        }
        return true;
      });
      if (typeof s.version !== 'number') s.version = SCHEMA_VERSION;
      if (!s.gps || typeof s.gps !== 'object') s.gps = defaultGpsState();
      return s;
    }

    // Ids aller eingebetteten Kurse (memoisiert). Die eingebettete DB steht im
    // Code — sie gehoert NICHT in den localStorage (Limit ~5-10 MB, waere sonst
    // bei tausenden Kursen gesprengt und jedes Autosave sehr langsam).
    let __embeddedIdSet = null;
    function embeddedIdSet() {
      if (!__embeddedIdSet) {
        __embeddedIdSet = new Set((LOADED_COURSE_DB.courses || []).map(function (c) { return c.id; }));
      }
      return __embeddedIdSet;
    }
    // Gespeicherte Extra-Kurse (UserDefined/importiert) mit der eingebetteten DB
    // zusammenfuehren (eingebettete zuerst, dann Extras, ohne Dubletten).
    function reconstituteCourses(extra) {
      const merged = buildEmbeddedCourses();
      const seen = {};
      merged.forEach(function (c) { seen[c.id] = true; });
      (extra || []).forEach(function (c) { if (c && c.id && !seen[c.id]) { seen[c.id] = true; merged.push(c); } });
      return merged;
    }
    function loadState() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
        state.storageAvailable = true;
      } catch (e) {
        state.storageAvailable = false;
      }
      if (!raw) {
        state.appState = defaultAppState();
        return;
      }
      // Unlesbarer/inkompatibler State wird durch die Standarddaten ersetzt —
      // der alte Blob wird aber gesichert, damit nichts stillschweigend
      // verloren geht (wiederherstellbar via DevTools/Support).
      function backupCorruptState() {
        try { localStorage.setItem(STORAGE_KEY + '_backup', raw); } catch (e) { /* voll/blockiert */ }
      }
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object' || parsed.version !== SCHEMA_VERSION) {
          backupCorruptState();
          state.appState = defaultAppState();
          return;
        }
        // Eingebettete Kurse aus dem Code wieder hinzufuegen (sie werden nicht
        // gespeichert) — VOR sanitize, damit die Runden-Pruefung die volle
        // Kursliste sieht.
        parsed.courses = reconstituteCourses(Array.isArray(parsed.courses) ? parsed.courses : []);
        state.appState = sanitizeAppState(parsed);
      } catch (e) {
        backupCorruptState();
        state.appState = defaultAppState();
      }
    }
    // Nur eine schlanke Sicht auf den State persistieren: eingebettete Kurse
    // weglassen (sie stehen im Code) — sonst sprengen tausende Kurse den
    // localStorage und verlangsamen jedes Autosave. Beim Laden werden sie via
    // reconstituteCourses wieder zusammengefuehrt.
    function slimAppStateForStorage() {
      const embIds = embeddedIdSet();
      const slim = {};
      for (const k in state.appState) {
        if (Object.prototype.hasOwnProperty.call(state.appState, k)) slim[k] = state.appState[k];
      }
      slim.courses = (state.appState.courses || []).filter(function (c) { return !embIds.has(c.id); });
      return slim;
    }
    function saveState() {
      if (!state.storageAvailable) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(slimAppStateForStorage()));
      } catch (e) {
        state.storageAvailable = false;
        renderTopbar();
      }
    }
    // --- Open-round helpers (multiple in-progress rounds) ---
    function getOpenRounds() {
      return (state.appState && Array.isArray(state.appState.openRounds))
        ? state.appState.openRounds : [];
    }
    function addOrUpdateOpenRound(round) {
      if (!state.appState.openRounds) state.appState.openRounds = [];
      const idx = state.appState.openRounds.findIndex(function (r) { return r.id === round.id; });
      if (idx >= 0) state.appState.openRounds[idx] = round;
      else state.appState.openRounds.push(round);
    }
    function removeOpenRound(id) {
      if (!state.appState.openRounds) return;
      state.appState.openRounds = state.appState.openRounds.filter(function (r) { return r.id !== id; });
    }
    function moveOpenRoundToHistory(id) {
      const idx = state.appState.openRounds.findIndex(function (r) { return r.id === id; });
      if (idx < 0) return null;
      const round = state.appState.openRounds[idx];
      round.status = 'finished';
      round.updatedAt = new Date().toISOString();
      state.appState.openRounds.splice(idx, 1);
      state.appState.rounds.push(round);
      saveState();
      return round;
    }

    // Autosave of the active draft — debounced so rapid tap sequences do not
    // hit localStorage on every click. Only touches openRounds[]; history is
    // never modified by autosave.
    let __autosaveTimer = null;
    let __lastAutosaveAt = null;
    function scheduleAutosave() {
      const ar = state.activeRound;
      if (!ar || ar.status === 'finished') {
        // Viewing a history round — no draft mutation, just persist directly.
        saveState();
        return;
      }
      ar.updatedAt = new Date().toISOString();
      addOrUpdateOpenRound(ar);
      if (__autosaveTimer) clearTimeout(__autosaveTimer);
      __autosaveTimer = setTimeout(function () {
        __autosaveTimer = null;
        saveState();
        __lastAutosaveAt = new Date().toISOString();
        updateAutosaveIndicator();
      }, 600);
    }
    function flushAutosave() {
      if (__autosaveTimer) {
        clearTimeout(__autosaveTimer);
        __autosaveTimer = null;
        saveState();
        __lastAutosaveAt = new Date().toISOString();
      }
    }
    function updateAutosaveIndicator() {
      const el = document.getElementById('autosave-hint');
      if (!el) return;
      if (__lastAutosaveAt) {
        el.textContent = 'Automatisch gespeichert · ' + formatTime(__lastAutosaveAt);
      }
    }
    // ---------- v1.1: Course DB export/import ----------

    function exportCourseDatabase() {
      const payload = {
        schemaVersion: COURSE_DB_SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        courses: state.appState.courses.map(function (c) {
          // clone plain fields, strip runtime-only refs
          return JSON.parse(JSON.stringify(c));
        })
      };
      const data = JSON.stringify(payload, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      // Backup filenames: yyyy.dd.mm
      const stamp = formatDateFile();
      a.href = url;
      a.download = stamp + '_courses-backup.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 0);
      showToast('Plaetze exportiert');
    }

    // Merge incoming courses into appState.
    // Semantik (Entscheid 2026-07-13):
    //  - Es wird NIE geloescht: Plaetze, die nicht (mehr) in der Quelle stehen,
    //    bleiben unveraendert erhalten.
    //  - mode 'import':   die Import-Datei hat immer die aktuellsten Daten ->
    //    bestehende Plaetze werden ueberschrieben (regionTags werden gemerged).
    //  - mode 'embedded': eingebettete DB beim App-Start -> ein bestehender
    //    Platz wird NUR ueberschrieben, wenn der eingebettete Datensatz NEUER
    //    ist (confirmedAt-Vergleich). Verhindert, dass ein aelterer HTML-Stand
    //    einen neueren Laufzeit-Import wieder zuruecksetzt.
    //  - source==='UserDefined' (selbst erfasste Plaetze) wird nie angefasst.
    function mergeCoursesIntoAppState(incomingCourses, opts) {
      const mode = (opts && opts.mode) || 'import';
      const stats = { added: 0, updated: 0, skipped: 0, unchanged: 0 };
      const byId = {};
      state.appState.courses.forEach(function (c) { byId[c.id] = c; });
      incomingCourses.forEach(function (raw) {
        const c = sanitizeCourse(raw);
        if (!c) { stats.skipped++; return; }
        if (byId[c.id]) {
          const existing = byId[c.id];
          if (existing.source === 'UserDefined') {
            // Selbst erfasste Plaetze sind tabu; nur regionTags ergaenzen.
            const merged = (existing.regionTags || []).slice();
            c.regionTags.forEach(function (r) { if (merged.indexOf(r) === -1) merged.push(r); });
            existing.regionTags = merged;
            stats.skipped++;
            return;
          }
          if (mode === 'embedded') {
            const incTs = Date.parse(c.confirmedAt || '') || 0;
            const curTs = Date.parse(existing.confirmedAt || '') || 0;
            // Bestehender Datensatz ist gleich neu oder neuer (z.B. durch einen
            // spaeteren Laufzeit-Import) -> nicht anruehren.
            if (curTs && (!incTs || incTs <= curTs)) { stats.unchanged++; return; }
          }
          // update: merge regionTags, replace everything else with incoming.
          // Auch Felder ENTFERNEN, die im neuen Datensatz fehlen (z.B. ein
          // frueheres holeCountAdjusted) — sonst bleiben veraltete Flags kleben.
          const merged = (existing.regionTags || []).slice();
          c.regionTags.forEach(function (r) { if (merged.indexOf(r) === -1) merged.push(r); });
          c.regionTags = merged;
          Object.keys(existing).forEach(function (k) { if (!(k in c)) delete existing[k]; });
          Object.keys(c).forEach(function (k) { existing[k] = c[k]; });
          stats.updated++;
        } else {
          state.appState.courses.push(c);
          byId[c.id] = c;
          stats.added++;
        }
      });
      saveState();
      return stats;
    }

    // Eingebettete Kurs-Datenbank beim App-Start in den Bestand einpflegen:
    // neue Plaetze ergaenzen, bestehende nur bei neuerem Datensatz aktualisieren,
    // nie loeschen. Laeuft dank Versions-Stempel nur einmal pro DB-Stand.
    // Die eingebettete Kurs-Datenbank ist die ALLEINIGE, autoritative Quelle
    // (Entscheid 2026-07-14: die alte DB hatte zu viele Fehler und wird komplett
    // ersetzt). Bei einem neuen DB-Stand wird der Kursbestand hart auf
    // [eingebettete DB + selbst erfasste Plaetze] zurueckgesetzt — alte/fehler-
    // hafte importierte oder Demo-Plaetze verschwinden. Laufende und gespeicherte
    // Runden behalten ihren courseSnapshot und bleiben spielbar/auswertbar, auch
    // wenn ihr Platz nicht mehr in der DB steht. Laeuft dank Versions-Stempel nur
    // einmal pro DB-Stand.
    function syncEmbeddedCourses() {
      if (!LOADED_COURSE_DB.version || !Array.isArray(LOADED_COURSE_DB.courses)
          || LOADED_COURSE_DB.courses.length === 0) return;
      if (state.appState.embeddedDbVersion === LOADED_COURSE_DB.version) return;
      // Vor dem Ersetzen: jede Runde ohne Snapshot aus ihrem (gleich zu
      // entfernenden) Platz sichern, damit History/Auswertung erhalten bleibt.
      const byIdAll = {};
      state.appState.courses.forEach(function (c) { byIdAll[c.id] = c; });
      (state.appState.rounds || []).concat(state.appState.openRounds || []).forEach(function (r) {
        if (r && r.courseId && !r.courseSnapshot && byIdAll[r.courseId]) {
          r.courseSnapshot = JSON.parse(JSON.stringify(byIdAll[r.courseId]));
        }
      });
      // Nur selbst erfasste Plaetze bleiben erhalten; alles andere wird durch die
      // eingebettete DB ersetzt. Bei Id-Kollision gewinnt die eingebettete Quelle.
      const userDefined = state.appState.courses.filter(function (c) { return c.source === 'UserDefined'; });
      const byId = {};
      const merged = [];
      buildEmbeddedCourses().concat(userDefined).forEach(function (c) {
        if (!byId[c.id]) { byId[c.id] = c; merged.push(c); }
      });
      state.appState.courses = merged;
      state.appState.embeddedDbVersion = LOADED_COURSE_DB.version;
      saveState();
    }

    function importCourseDatabaseFromFile(file, onDone) {
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || typeof parsed !== 'object') throw new Error('shape');
          let stats;
          let extra = '';
          let importedCourses = [];   // fuer die Datenpruefung nach dem Import
          let skippedList = [];       // uebersprungene Plaetze (kein Clubname)
          if (looksLikeGolfAppExport(parsed)) {
            // Kursdaten-Export (golf-app-export/1.0.0): direkt konvertieren.
            const conv = convertGolfAppExport(parsed);
            importedCourses = conv.courses;
            skippedList = conv.stats.skippedList || [];
            stats = mergeCoursesIntoAppState(conv.courses, { mode: 'import' });
            if (conv.stats.skippedUnnamed > 0) {
              extra = ', ' + conv.stats.skippedUnnamed + ' ohne Clubname uebersprungen';
            }
            if (conv.stats.skippedOther > 0) {
              extra += ', ' + conv.stats.skippedOther + ' unvollstaendig uebersprungen';
            }
          } else if (parsed.schemaVersion === COURSE_DB_SCHEMA_VERSION && Array.isArray(parsed.courses)) {
            // App-eigenes Format (z.B. frueher exportierte Plaetze).
            importedCourses = parsed.courses;
            stats = mergeCoursesIntoAppState(parsed.courses, { mode: 'import' });
          } else {
            throw new Error('version');
          }
          // (Kein Reset auf die eingebettete DB nach dem Import — der Import ist
          // eine bewusste Nutzeraktion und wird nicht ueberschrieben.)
          // Datenpruefung: die tatsaechlich im Bestand liegenden importierten
          // Plaetze auf Auffaelligkeiten pruefen (CR-Ausreisser, Slope-Bereich,
          // fehlende Koordinaten/Ratings) und das Ergebnis merken + anzeigen.
          const idsNow = {};
          state.appState.courses.forEach(function (c) { idsNow[c.id] = c; });
          const seenAudit = {};
          const report = auditCourses(importedCourses
            .map(function (c) { return idsNow[c.id]; })
            .filter(function (c) {   // pro courseId nur einmal pruefen (Datei-Duplikate)
              if (!c || seenAudit[c.id]) return false;
              seenAudit[c.id] = 1; return true;
            }));
          state.appState.lastImportReport = {
            at: new Date().toISOString(), count: report.length, items: report,
            skipped: skippedList
          };
          saveState();
          if (onDone) onDone(true, stats);
          showToast(
            'Import: ' + stats.added + ' neu, ' + stats.updated + ' aktualisiert' +
            (stats.skipped ? ', ' + stats.skipped + ' geschuetzt/uebersprungen' : '') +
            extra + ' — bestehende Plaetze bleiben erhalten'
          );
          if (report.length || skippedList.length) showImportAuditDialog(state.appState.lastImportReport);
        } catch (err) {
          if (onDone) onDone(false, err);
          openDialog({
            title: 'Import fehlgeschlagen',
            message: 'Die Datei ist ungueltig. Erwartet wird die Kursdaten-Datei ' +
                     '(golf-app-export) oder eine mit dieser App exportierte Platz-Datei.',
            confirmText: 'OK',
            hideCancel: true
          });
        }
      };
      reader.onerror = function () {
        openDialog({
          title: 'Import fehlgeschlagen',
          message: 'Datei konnte nicht gelesen werden.',
          confirmText: 'OK',
          hideCancel: true
        });
      };
      reader.readAsText(file);
    }

    function triggerCourseDbImport() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.addEventListener('change', function () {
        const file = input.files && input.files[0];
        if (!file) return;
        importCourseDatabaseFromFile(file, function (ok) {
          if (ok) renderAll();
        });
      });
      input.click();
    }

    // Kick off a GPS request; updates appState.gps and re-renders setup.
    // Note: requestCurrentPosition() is a one-shot getCurrentPosition() —
    // no continuous tracking is started. After the fix is obtained, the
    // browser/OS releases the GPS sensor automatically.
    function activateGps() {
      state.appState.gps.status = 'requesting';
      state.appState.gps.lastError = null;
      renderSetup();
      requestCurrentPosition().then(function (pos) {
        state.appState.gps.status = 'ok';
        state.appState.gps.lat = pos.coords.latitude;
        state.appState.gps.lng = pos.coords.longitude;
        state.appState.gps.accuracy = pos.coords.accuracy;
        state.appState.gps.updatedAt = new Date().toISOString();
        state.appState.gps.lastError = null;
        saveState();
        renderSetup();
      }).catch(function (err) {
        state.appState.gps.status = 'error';
        state.appState.gps.lastError = gpsErrorText(err);
        state.appState.gps.accuracy = null;
        saveState();
        renderSetup();
      });
    }
    // Reset GPS state to idle. Clears lat/lng/accuracy and signals to the user
    // that the position is no longer in use (hides Nearby list, balken grau,
    // Statustext "aus"). After this, no implicit re-activation.
    function deactivateGps() {
      state.appState.gps = defaultGpsState();
      saveState();
      renderSetup();
    }

    function importDataFromFile(file, onDone) {
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || typeof parsed !== 'object') throw new Error('bad shape');
          if (parsed.version !== SCHEMA_VERSION) throw new Error('bad version');
          if (!Array.isArray(parsed.players) || !Array.isArray(parsed.courses)) throw new Error('bad arrays');
          state.appState = sanitizeAppState({

            lastBackupAt: parsed.lastBackupAt || null,

            courses: reconstituteCourses(Array.isArray(parsed.courses) ? parsed.courses : []),
            rounds: Array.isArray(parsed.rounds) ? parsed.rounds : [],

            openRounds: Array.isArray(parsed.openRounds) ? parsed.openRounds : [],

          });

            ? state.appState.rounds.find(function (r) { return r.id === state.appState.lastActiveRoundId; }) || null
            : null;

          syncEmbeddedCourses();

        } catch (err) {
          if (onDone) onDone(false, err);
          openDialog({
            title: 'Import fehlgeschlagen',

            confirmText: 'OK',
