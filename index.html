      reader.onerror = function () {
        openDialog({
          title: 'Import fehlgeschlagen',
          message: 'Datei konnte nicht gelesen werden.',
          confirmText: 'OK',
          hideCancel: true
        });
      };
      reader.readAsText(file);
    }

    // ============================================================
    // Calculations
    // ============================================================
    // Playing Handicap (WHS-inspired, rounded):
    //   PH = round(HCI * Slope/113 + (CR - Par)), clamped at 0.
    // Test cases (spot-verified):
    //   (18,    113, 72, 72) -> 18
    //   ( 0,    113, 72, 72) -> 0
    //   (18.4,  130, 71.2, 72) -> round(21.17 - 0.8) = 20
    //   (28.1,  132, 72.8, 72) -> round(32.83 + 0.8) = 34
    //   (-5,    113, 72, 72) -> max(0, -5) = 0
    // 18-hole round: round(HI * SR/113 + (CR - Par)).
    // 9-hole round (WHS): round((HI/2) * SR/113 + (CR9 - Par9)) — half the
    // Handicap Index and the 9-hole Course Rating. Many 9-hole facilities are
    // rated as two loops (18-hole CR ~= 2x the 9-hole value); when the tee still
    // carries such an 18-hole rating, CR is reduced to its 9-hole equivalent.
    // ratingHoles (9|18) states what CR/SR cover; if absent it is inferred.
    // Single source of truth for "what do this tee's CR/SR cover" (9 or 18 holes),
    // used by BOTH the handicap calc and the setup display hint so they can never
    // disagree. Prefers the stored ratingHoles; falls back to a CR-vs-par heuristic
    // for tees imported without it (hand-edited / legacy data).
    function resolveTeeRatingHoles(tee, holeCount) {
      // Gespeicherter Wert gewinnt (6, 9 oder 18 — je nach Platz).
      if (tee && (tee.ratingHoles === 6 || tee.ratingHoles === 9 || tee.ratingHoles === 18)) {
        return tee.ratingHoles;
      }
      // Fallback-Heuristik fuer Daten ohne ratingHoles: ein CR weit ueber dem
      // Par der gespielten Loecher ist ein 18-Loch-Rating.
      if (holeCount < 18 && tee && typeof tee.courseRating === 'number' &&
          typeof tee.par === 'number' && tee.courseRating > tee.par * 1.5) return 18;
      return holeCount < 18 ? holeCount : 18;
    }
    // Kurzrunden (< 18 Loch) anteilig: Faktor = Lochzahl/18.
    // 9 Loch => WHS-Regel (halber Index, halbiertes 18-Loch-CR); 6 Loch => 1/3.
    function calculatePlayingHandicap(handicapIndex, slopeRating, courseRating, par, holeCount, ratingHoles) {
      let hi = handicapIndex;
      let cr = courseRating;
      if (holeCount && holeCount < 18) {
        const f = holeCount / 18;
        hi = handicapIndex * f;
        // ratingHoles resolved by the caller via resolveTeeRatingHoles(); the
        // CR-vs-par fallback only guards a direct call without it.
        const rh = (ratingHoles === 6 || ratingHoles === 9 || ratingHoles === 18)
          ? ratingHoles
          : (courseRating > par * 1.5 ? 18 : holeCount);
        if (rh === 18) cr = courseRating * f;
      }
      const ph = Math.round(hi * (slopeRating / 113) + (cr - par));
      return Math.max(0, ph);
    }
    // Distribute playingHandicap strokes across 18 holes in order of lowest
    // Stroke Index first. If PH > 18, second pass awards an additional stroke
    // starting again at SI 1, and so on.
    // Test cases:
    //   PH 0  -> all zeros
    //   PH 18 -> every hole gets exactly 1
    //   PH 20 -> every hole gets 1, plus SI-1 and SI-2 get +1 (so 2 twice, 16 ones)
    //   PH 36 -> every hole gets 2
    function distributeStrokesPerHole(playingHandicap, holes) {
      // Hole-count-aware: 9-hole courses must allocate over 9 holes, not a
      // hardcoded 18 (otherwise strokes beyond the hole count are written to
      // result[undefined] and silently lost). For 18-hole courses n === 18,
      // so behaviour is unchanged.
      const n = (holes && holes.length) || 18;
      const result = new Array(n).fill(0);
      if (playingHandicap <= 0) return result;
      // Build mapping: SI rank -> hole index
      const order = holes
        .map(function (h, i) { return { i: i, si: h.strokeIndex }; })
        .sort(function (a, b) { return a.si - b.si; })
        .map(function (x) { return x.i; });
      let remaining = playingHandicap;
      let safety = 0;
      while (remaining > 0 && safety < 200) {
        for (let k = 0; k < n && remaining > 0; k++) {
          result[order[k]]++;
          remaining--;
        }
        safety++;
      }
      return result;
    }
    // Standard Stableford scoring (no modified variant):
    //   diff = netStrokes - par
    //   diff >= 2 -> 0 (double bogey or worse)
    //   diff == 1 -> 1 (bogey)
    //   diff == 0 -> 2 (par)
    //   diff == -1 -> 3 (birdie)
    //   diff == -2 -> 4 (eagle)
    //   diff <= -3 -> 5 (albatross)
    // Test cases:
    //   (strokes=4, par=4, given=0) -> net 4, diff 0 -> 2
    //   (strokes=5, par=4, given=0) -> net 5, diff 1 -> 1
    //   (strokes=5, par=4, given=1) -> net 4, diff 0 -> 2
    //   (strokes=6, par=4, given=0) -> net 6, diff 2 -> 0
    //   (strokes=7, par=5, given=2) -> net 5, diff 0 -> 2
    //   (strokes=0 = not entered)   -> 0
    function stablefordForHole(strokes, par, given) {
      if (!strokes || strokes <= 0) return 0;
      const net = strokes - given;
      const diff = net - par;
      if (diff >= 2) return 0;
      if (diff === 1) return 1;
      if (diff === 0) return 2;
      if (diff === -1) return 3;
      if (diff === -2) return 4;
      return 5; // diff <= -3
    }
    function getCourse(courseId) {
      return state.appState.courses.find(function (c) { return c.id === courseId; }) || null;
    }
    // History/persistence: prefer the course snapshot stored with the round,
    // so historical rounds render exactly as saved even if the live course was edited.
    function getCourseForRound(round) {
      if (!round) return null;
      if (round.courseSnapshot && Array.isArray(round.courseSnapshot.holes) && round.courseSnapshot.holes.length > 0) {
        return round.courseSnapshot;
      }
      return getCourse(round.courseId);
    }
    function getTee(course, colorKey) {
      if (!course) return null;
      return course.tees.find(function (t) { return t.colorKey === colorKey; }) || course.tees[0] || null;
    }
    function getHole(course, holeNumber) {
      if (!course || !Array.isArray(course.holes)) return null;
      return course.holes.find(function (h) { return h.holeNumber === holeNumber; }) || null;
    }
    function getStrokesForPlayerHole(round, playerIdx, holeNumber) {
      const score = round.holeScores.find(function (s) {
        return s.playerInRoundIdx === playerIdx && s.holeNumber === holeNumber;
      });
      return score ? (score.strokes || 0) : 0;
    }
    function setStrokesForPlayerHole(round, playerIdx, holeNumber, strokes) {
      let score = round.holeScores.find(function (s) {
        return s.playerInRoundIdx === playerIdx && s.holeNumber === holeNumber;
      });
      const course = getCourseForRound(round);
      const hole = getHole(course, holeNumber);
      round.updatedAt = new Date().toISOString();
      const pir = round.playersInRound[playerIdx];
      const given = pir.strokesPerHole[holeNumber - 1] || 0;
      const net = strokes > 0 ? strokes - given : 0;
      const stbl = stablefordForHole(strokes, hole.par, given);
      if (!score) {
        score = {
          playerInRoundIdx: playerIdx,
          holeNumber: holeNumber,
          strokes: strokes,
          netStrokes: net,
          stablefordPoints: stbl
        };
        round.holeScores.push(score);
      } else {
        score.strokes = strokes;
        score.netStrokes = net;
        score.stablefordPoints = stbl;
      }
    }
    function computeTotals(round, playerIdx) {
      const totals = {
        grossOut: 0, grossIn: 0, grossTotal: 0,
        netOut: 0, netIn: 0, netTotal: 0,
        stablefordOut: 0, stablefordIn: 0, stablefordTotal: 0,
        toParGross: 0, toParNet: 0,
        parPlayedOut: 0, parPlayedIn: 0, parPlayedTotal: 0,
        anyEntered: false
      };
      const course = getCourseForRound(round);
      for (let h = 1; h <= 18; h++) {
        const strokes = getStrokesForPlayerHole(round, playerIdx, h);
        const hole = getHole(course, h);
        const pir = round.playersInRound[playerIdx];
        const given = pir.strokesPerHole[h - 1] || 0;
        if (strokes > 0) {
          totals.anyEntered = true;
          const net = strokes - given;
          const stbl = stablefordForHole(strokes, hole.par, given);
          if (h <= 9) {
            totals.grossOut += strokes;
            totals.netOut += net;
            totals.stablefordOut += stbl;
            totals.parPlayedOut += hole.par;
          } else {
            totals.grossIn += strokes;
            totals.netIn += net;
            totals.stablefordIn += stbl;
            totals.parPlayedIn += hole.par;
          }
        }
      }
      totals.grossTotal = totals.grossOut + totals.grossIn;
      totals.netTotal = totals.netOut + totals.netIn;
      totals.stablefordTotal = totals.stablefordOut + totals.stablefordIn;
      totals.parPlayedTotal = totals.parPlayedOut + totals.parPlayedIn;
      totals.toParGross = totals.grossTotal - totals.parPlayedTotal;
      totals.toParNet = totals.netTotal - totals.parPlayedTotal;
      return totals;
    }
    function getRanking(round) {
      const list = round.playersInRound.map(function (pir, idx) {
        const t = computeTotals(round, idx);
        return { idx: idx, pir: pir, totals: t };
      });
      list.sort(function (a, b) {
        if (b.totals.stablefordTotal !== a.totals.stablefordTotal) {
          return b.totals.stablefordTotal - a.totals.stablefordTotal;
        }
        return a.idx - b.idx;
      });
      let rank = 1;
      for (let i = 0; i < list.length; i++) {
        if (i > 0 && list[i].totals.stablefordTotal < list[i - 1].totals.stablefordTotal) {
          rank = i + 1;
        }
        list[i].rank = rank;
      }
      return list;
    }
    // ---------- v1.1: GPS + distance + filters + nearby ----------

    // Haversine distance in km between two lat/lng pairs.
    function haversineKm(lat1, lng1, lat2, lng2) {
      if (lat1 == null || lng1 == null || lat2 == null || lng2 == null) return null;
      const toRad = function (d) { return d * Math.PI / 180; };
      const R = 6371; // km
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Map accuracy (m) -> { bars, color, label }. null -> 0 bars, grey.
    function computeGpsBars(accuracy) {
      if (typeof accuracy !== 'number' || isNaN(accuracy) || accuracy <= 0) {
        return { bars: 0, color: 'grey', label: 'unbekannt' };
      }
      if (accuracy > 50) return { bars: 1, color: 'red', label: 'schlecht' };
      if (accuracy > 20) return { bars: 2, color: 'orange', label: 'mittel' };
      return { bars: 3, color: 'green', label: 'gut' };
    }

    // Format accuracy for UI text.
    function formatAccuracy(m) {
      if (typeof m !== 'number' || isNaN(m) || m <= 0) return '';
      if (m >= 1000) return '> 1 km';
      if (m >= 100) return 'ca. ' + (Math.round(m / 10) * 10) + ' m';
      return 'ca. ' + Math.round(m) + ' m';
    }

    // Promise wrapper for geolocation (single-shot, high accuracy).
    function requestCurrentPosition() {
      return new Promise(function (resolve, reject) {
        if (!navigator.geolocation) {
          reject(new Error('unsupported'));
          return;
        }
        const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 };
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    // Human-readable error text for geolocation errors.
    function gpsErrorText(err) {
      if (!err) return 'nicht verfuegbar';
      if (err.message === 'unsupported') return 'im Browser nicht verfuegbar';
      if (err.code === 1) return 'Zugriff verweigert';
      if (err.code === 2) return 'nicht verfuegbar';
      if (err.code === 3) return 'Zeitueberschreitung';
      return 'Fehler';
    }

    // Filter a course array by name/region/holeCount. All args optional.
    function filterCoursesForSetup(courses, nameFilter, regionFilter, holeCountFilter, countryFilter) {
      const nf = (nameFilter || '').trim().toLowerCase();
      const rf = (regionFilter && regionFilter !== 'Alle') ? regionFilter : null;
      const hf = (holeCountFilter && holeCountFilter !== 'Alle') ? Number(holeCountFilter) : null;
      const cf = (countryFilter && countryFilter !== 'Alle') ? countryFilter : null;
      return courses.filter(function (c) {
        // Name filter matches course name OR the country name (so "Schweiz" as a text query works too).
        if (nf) {
          const inName = c.name.toLowerCase().indexOf(nf) !== -1;
          const inCountry = (countryDisplayName(c.country) || '').toLowerCase().indexOf(nf) !== -1;
          if (!inName && !inCountry) return false;
        }
        if (rf && !(Array.isArray(c.regionTags) && c.regionTags.indexOf(rf) !== -1)) return false;
        if (hf && c.holeCount !== hf) return false;
        if (cf && (c.country || '') !== cf) return false;
        return true;
      });
    }

    // Courses sorted by distance to current GPS position; filters out courses without coords.
    function getNearbyCourses(limit) {
      const gps = state.appState.gps;
      if (!gps || gps.status !== 'ok' || typeof gps.lat !== 'number') return [];
      const list = state.appState.courses
        .filter(function (c) { return c.location && typeof c.location.lat === 'number' && typeof c.location.lng === 'number'; })
        .map(function (c) {
          return { course: c, distKm: haversineKm(gps.lat, gps.lng, c.location.lat, c.location.lng) };
        })
        .filter(function (x) { return x.distKm !== null; })
        .sort(function (a, b) { return a.distKm - b.distKm; });
      return typeof limit === 'number' ? list.slice(0, limit) : list;
    }


    // Format km distance for display.
    function formatDistKm(km) {
      if (km == null) return '';
      if (km < 1) return Math.round(km * 1000) + ' m';
      if (km < 10) return km.toFixed(1) + ' km';
      return Math.round(km) + ' km';
    }

    // Layout summary string: "27 Loch (3x9)" etc.
    function formatHoleCountLabel(course) {
      const n = course.holeCount || (course.holes && course.holes.length) || 18;
      if (n === 27) return '27 Loch (3x9)';
      if (n === 36) return '36 Loch (2x18)';
      return n + ' Loch';
    }

    function slashChars(n) {
      if (n <= 0) return '';
      if (n === 1) return '/';
      if (n === 2) return '//';
      return '///';
    }
    function formatToPar(n) {
      if (n === 0) return 'E';
      return (n > 0 ? '+' : '') + n;
    }
    function shortName(name, max) {
      if (!name) return '';
      if (name.length <= max) return name;
      return name.slice(0, Math.max(1, max - 1)) + '.';
    }

    // ============================================================
    // Setup draft helpers
    // ============================================================
    function defaultLayoutIdForCourse(course) {
      if (!course || !Array.isArray(course.layouts) || course.layouts.length === 0) return 'standard';
      const def = course.layouts.find(function (l) { return l.isDefault; });
      return (def || course.layouts[0]).id;
    }
    function defaultSetupFilters() {
      // Landvorgabe immer CH; listMode 'auto' = GPS-Naehe wenn aktiv, sonst
      // Landliste. 'country' = Nutzer hat bewusst ein Land/Filter gewaehlt.
      return { name: '', region: 'Alle', holeCount: 'Alle', country: 'CH', listMode: 'auto' };
    }
    function newSetupDraft() {
      // Bewusst OHNE Vorauswahl: kein Platz, keine Spieler. Der Nutzer soll
      // strukturiert waehlen (Grundbild ist leer, nicht der zuletzt gespielte Platz).
      return {
        courseId: null,
        teeForCourse: null,
        layoutId: 'standard',
        players: [],
        filters: defaultSetupFilters()
      };
    }
    function ensureSetupDraft() {
      if (!state.setupDraft) {
        state.setupDraft = newSetupDraft();
      }
      if (!state.setupDraft.filters) {
        state.setupDraft.filters = defaultSetupFilters();
      }
      if (typeof state.setupDraft.filters.listMode !== 'string') {
        state.setupDraft.filters.listMode = 'auto';
      }
      // Platz re-validieren, aber NICHT automatisch einen waehlen: ist der
      // gewaehlte Platz weg (oder keiner gesetzt), bleibt die Auswahl leer.
      const course = getCourse(state.setupDraft.courseId);
      if (!course) {
        state.setupDraft.courseId = null;
        state.setupDraft.teeForCourse = null;
      } else {
        const hasLayout = Array.isArray(course.layouts) && course.layouts.some(function (l) { return l.id === state.setupDraft.layoutId; });
        if (!hasLayout) state.setupDraft.layoutId = defaultLayoutIdForCourse(course);
      }
    }
    function setupIsValid() {
      const d = state.setupDraft;
      if (!d || !d.courseId) return false;
      if (d.players.length < 1 || d.players.length > 4) return false;
      for (let i = 0; i < d.players.length; i++) {
        const p = d.players[i];
        if (!p.displayName || p.displayName.trim().length === 0) return false;
        if (typeof p.handicapIndex !== 'number' || isNaN(p.handicapIndex)) return false;
        if (!p.teeColorKey) return false;
      }
      return true;
    }
    function startRoundFromDraft() {
      const d = state.setupDraft;
      const course = getCourse(d.courseId);
      const playersInRound = d.players.map(function (p) {
        const tee = getTee(course, p.teeColorKey);
        const ph = calculatePlayingHandicap(p.handicapIndex, tee.slopeRating, tee.courseRating, tee.par, course.holeCount, resolveTeeRatingHoles(tee, course.holeCount));
        return {
          playerId: p.playerId || null,
          displayName: p.displayName.trim(),
          handicapIndexAtRound: p.handicapIndex,
          teeColorKey: p.teeColorKey,
          playingHandicap: ph,
          strokesPerHole: distributeStrokesPerHole(ph, course.holes)
        };
      });
      // Resolve layout -> holeNumbers (snapshot into round)
      const layoutId = d.layoutId || defaultLayoutIdForCourse(course);
      let layout = (course.layouts || []).find(function (l) { return l.id === layoutId; });
      if (!layout) layout = (course.layouts || [])[0] || null;
      let holeNumbers;
      if (layout && Array.isArray(layout.holeNumbers) && layout.holeNumbers.length > 0) {
        holeNumbers = layout.holeNumbers.slice();
      } else {
        holeNumbers = [];
        const n = course.holeCount || course.holes.length || 18;
        for (let i = 1; i <= n; i++) holeNumbers.push(i);
      }
      const now = new Date().toISOString();
      // Deep-clone the course so the saved round keeps a stable snapshot,
      // independent of later edits to the live course catalogue.
      const courseSnapshot = JSON.parse(JSON.stringify(course));
      const round = {
        id: uid('round'),
        courseId: course.id,
        courseName: course.name,
        courseSnapshot: courseSnapshot,
        courseLayoutId: layout ? layout.id : 'standard',
        holeNumbers: holeNumbers,
        date: now,
        createdAt: now,
        updatedAt: now,
        playersInRound: playersInRound,
        currentHole: 1,
        status: 'draft', // new round is always a draft until finished
        holeScores: []
      };
      // Add as a new open round (multiple open rounds are allowed).
      round.status = 'in_progress';
      addOrUpdateOpenRound(round);
      state.activeRound = round;
      state.setupDraft = null;
      saveState();
      // Rundenstart ist der wichtigste Moment fuer den App-Look: laeuft im
      // Klick-Kontext, daher darf hier Vollbild angefordert werden (No-Op, wenn
      // schon aktiv, und fehlertolerant, wenn der Browser es ablehnt).
      enterAppFullscreen();
    }
    // Open/History lifecycle:
    //  - Open rounds are editable drafts (autosaved).
    //  - History rounds are finished snapshots (read-only).
    // discardActiveRound treats both cases distinctly; moveOpenRoundToHistory
    // is the only path from "open" into "history".
    function discardActiveRound() {
      flushAutosave();
      const ar = state.activeRound;
      if (ar && ar.status !== 'finished') {
        // Active round was an open draft -> drop it from openRounds.
        removeOpenRound(ar.id);
      }
      // If active round was a finished history round, we just stop viewing it
      // (do not touch state.appState.rounds[]).
      state.activeRound = null;
      saveState();
    }
    function finishActiveRound() {
      flushAutosave();
      const ar = state.activeRound;
      if (!ar) return;
      // Finishing only applies to open rounds. Already finished is a noop.
      if (ar.status !== 'finished') {
        const moved = moveOpenRoundToHistory(ar.id);
        if (moved) state.activeRound = moved; // keep viewing the now-finished round
      }
      saveState();
    }
    // Convenience used by the Setup "Offene Spiele" list entries.
    function resumeOpenRound(id) {
      const round = getOpenRounds().find(function (r) { return r.id === id; });
      if (!round) { showToast('Runde nicht mehr verfuegbar.'); return; }
      flushAutosave();
      state.activeRound = round;
      state.segment = 'live';
      setScreen('play');
    }
    function archiveOpenRound(id) {
      const moved = moveOpenRoundToHistory(id);
      if (!moved) { showToast('Runde nicht mehr verfuegbar.'); return; }
      // Stay on Setup; user sees updated list. Optionally could jump to history.
      showToast('Runde in History verschoben');
      if (state.activeRound && state.activeRound.id === moved.id) {
        state.activeRound = moved;
      }
      renderAll();
    }
    // Open a saved round from the history list and switch to the scorecard view.
    function openSavedRound(roundId) {
      const round = state.appState.rounds.find(function (r) { return r.id === roundId; });
      if (!round) { showToast('Runde nicht gefunden.'); return; }
      state.activeRound = round;
      state.segment = 'card'; // historical rounds: go straight to scorecard view
      setScreen('play');
    }
    function deleteSavedRound(roundId) {
      const idx = state.appState.rounds.findIndex(function (r) { return r.id === roundId; });
      if (idx < 0) return;
      state.appState.rounds.splice(idx, 1);
      if (state.activeRound && state.activeRound.id === roundId) {
        state.activeRound = null;
      }
      saveState();
      renderHistory();
      renderBottomNav();
    }
    // Discard a specific open round by id (or the active one if no id).
    function discardDraft(id) {
      flushAutosave();
      const targetId = id || (state.activeRound ? state.activeRound.id : null);
      if (!targetId) return;
      if (state.activeRound && state.activeRound.id === targetId) {
        state.activeRound = null;
      }
      removeOpenRound(targetId);
      saveState();
    }

    // ============================================================
    // Navigation
    // ============================================================
    function setScreen(name) {
      // If user taps Spiel/Ergebnis without an activeRound but exactly one open
      // round exists, auto-resume it. Multiple → user must pick one on Setup.
      if ((name === 'play' || name === 'results') && !state.activeRound) {
        const openList = getOpenRounds();
        if (openList.length === 1) {
          state.activeRound = openList[0];
        } else if (openList.length > 1) {
          showToast('Bitte im Setup ein offenes Spiel waehlen.');
          state.activeScreen = 'setup';
          state.setupSubScreen = 'hub';
          renderAll();
          return;
        } else {
          showToast('Bitte zuerst eine Runde im Setup starten.');
          return;
        }
      }
      // v1.8: Tab-Wechsel zum Setup landet immer auf dem Hub —
      // Sub-View-Scrollpositionen bleiben gecached fuer die naechste Hub-Navigation.
      if (name === 'setup') {
        state.setupSubScreen = 'hub';
      }
      state.activeScreen = name;
      renderAll();
    }
    function setSegment(name) {
      state.segment = name;
      // Die Scorekarte immer bei 100% oeffnen (fuellt die Breite; der Nutzer
      // kann bei Bedarf hineinzoomen). Verhindert, dass ein zuvor gesetzter
      // kleiner Zoom haengen bleibt.
      if (name === 'card') __cardZoom = 1;
      renderPlay();
      renderBottomNav();
    }
    function hasActiveRound() {
      // Active if viewing a round OR at least one open round exists.
      return !!state.activeRound || getOpenRounds().length > 0;
    }

    // ============================================================
    // Top bar & nav rendering
    // ============================================================
    function renderTopbar() {
      const w = document.getElementById('storage-warn');
      if (state.storageAvailable) w.classList.add('hidden');
      else w.classList.remove('hidden');
    }
    function renderBottomNav() {
      const nav = document.getElementById('bottomnav');
      const buttons = nav.querySelectorAll('button');
      buttons.forEach(function (btn) {
        const target = btn.getAttribute('data-screen');
        btn.classList.remove('is-active', 'is-disabled');
        if (target === state.activeScreen) btn.classList.add('is-active');
        if ((target === 'play' || target === 'results') && !hasActiveRound()) {
          btn.classList.add('is-disabled');
        }
      });
    }

    // ============================================================
    // Setup screen rendering
    // ============================================================
    // ============================================================
    // Setup Screen — split into Hub / Course / Players sub-views (v1.8)
    // Reason: previous monolithic Setup screen scrolled to top on every
    // interaction because root.innerHTML='' destroyed the .scroll-area.
    // The fix is twofold:
    //   1. Split into three focused sub-views to reduce vertical length.
    //   2. Save+restore scrollTop per sub-view across re-renders so taps
    //      (e.g. tee pill, HCP stepper, player add) keep the user in place.
    // ============================================================
    const __setupScroll = { hub: 0, course: 0, players: 0, playersDb: 0 };
    let __setupSubLastRendered = null;

    function setSetupSubScreen(name) {
      state.setupSubScreen = name;
      renderSetup();
    }

    function renderSetup() {
      ensureSetupDraft();
      if (!state.setupSubScreen) state.setupSubScreen = 'hub';
      const sub = state.setupSubScreen;
      const root = document.getElementById('screen-setup');

      // Save current scroll position before destroying the DOM.
      const oldArea = root.querySelector('.scroll-area');
      if (oldArea && __setupSubLastRendered) {
        __setupScroll[__setupSubLastRendered] = oldArea.scrollTop;
      }

      root.innerHTML = '';

      if (sub === 'course') renderSetupCourseView(root);
      else if (sub === 'preview') renderSetupPreviewView(root);
      else if (sub === 'players') renderSetupPlayersView(root);
      else if (sub === 'playersDb') renderSetupPlayersDbView(root);
      else renderSetupHubView(root);

      __setupSubLastRendered = sub;

      // Restore scroll position so re-renders (tee click, HCP +/-, etc.)
      // keep the user exactly where they were. rAF ensures layout is ready.
      const newArea = root.querySelector('.scroll-area');
      if (newArea) {
        const target = __setupScroll[sub] || 0;
        requestAnimationFrame(function () {
          try { newArea.scrollTop = target; } catch (e) {}
        });
      }
    }

    // Setup Hub — Startseite mit zwei grossen Bereichs-Buttons +
    // Open-Rounds-Liste + Daten-Akkordeon + "Runde starten"-Footer.
    // Tage seit dem letzten Backup (Infinity, wenn nie gesichert).
    function daysSinceBackup() {
      const t = state.appState.lastBackupAt;
      if (!t) return Infinity;
      const then = new Date(t).getTime();
      if (isNaN(then)) return Infinity;
      return (Date.now() - then) / 86400000;
    }
    // Gibt es schuetzenswerte EIGENE Daten? (Damit ein frischer Start mit den 3
    // Beispiel-Spielern nicht sofort nervt: es zaehlen nur Runden oder Spieler,
    // die NICHT zu den Vorgabe-Beispielen gehoeren.)
    const SAMPLE_PLAYER_IDS = { 'player-mueller': 1, 'player-schmidt': 1, 'player-weber': 1 };
    function hasUserData() {
      const s = state.appState;
      if ((s.rounds && s.rounds.length > 0) || (s.openRounds && s.openRounds.length > 0)) return true;
      return (s.players || []).some(function (p) { return !SAMPLE_PLAYER_IDS[p.id]; });
    }
    // Dezente Backup-Erinnerung auf dem Hub — nur, wenn es Daten gibt und lange
    // (>= 14 Tage) oder noch nie gesichert wurde. Nach dem Sichern verschwindet
    // sie automatisch (lastBackupAt aktualisiert).
    const BACKUP_REMIND_DAYS = 14;
    function renderBackupReminder() {
      if (!hasUserData()) return null;
      const d = daysSinceBackup();
      if (d < BACKUP_REMIND_DAYS) return null;
      const box = el('div', { class: 'backup-reminder' });
      box.appendChild(el('div', { class: 'br-text' }, [
        (d === Infinity)
          ? '🛟 Noch kein Backup. Sichere Spieler + Runden in eine Datei, damit nichts verloren geht.'
          : ('🛟 Seit ' + Math.floor(d) + ' Tagen kein Backup — jetzt sichern, damit nichts verloren geht.')
      ]));
      const row = el('div', { class: 'row', style: 'gap:8px; margin-top:8px;' });
      const save = el('button', { class: 'btn btn-primary grow', type: 'button' }, ['Jetzt sichern']);
      save.addEventListener('click', function () { exportData(); renderSetup(); });
      const restore = el('button', { class: 'btn grow', type: 'button' }, ['Wiederherstellen']);
      restore.addEventListener('click', triggerImport);
      row.appendChild(save);
      row.appendChild(restore);
      box.appendChild(row);
      return box;
    }
    function renderSetupHubView(root) {
      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });

      padded.appendChild(el('div', { class: 'setup-hub-title' }, ['Runde vorbereiten']));

      // Backup-Erinnerung (nur wenn ueberfaellig)
      const backupR = renderBackupReminder();
      if (backupR) padded.appendChild(backupR);

      // Open rounds list (existing block)
      const openBlock = renderOpenRoundsBlock();
      if (openBlock) padded.appendChild(openBlock);

      const d = state.setupDraft;
      const course = getCourse(d.courseId);
      const valid = setupIsValid();

      if (!course) {
        // Kein Platz in Vorbereitung -> ein klarer Einstieg in den Ablauf.
        const startNew = el('button', { class: 'hub-btn hub-btn-primary', type: 'button', 'aria-label': 'Neue Runde vorbereiten' });
        startNew.appendChild(el('div', { class: 'hub-btn-title' }, ['Neue Runde']));
        startNew.appendChild(el('div', { class: 'hub-btn-status' }, ['Platz waehlen › Spieler › starten']));
        startNew.appendChild(el('span', { class: 'hub-btn-arrow', 'aria-hidden': 'true' }, ['›']));
        startNew.addEventListener('click', startNewRoundFlow);
        padded.appendChild(startNew);
      } else {
        // Vorbereitung laeuft: Zusammenfassung + naechster Schritt.
        const card = el('div', { class: 'draft-card' });
        card.appendChild(el('div', { class: 'label' }, ['Vorbereitung']));
        card.appendChild(el('div', { class: 'course-name' }, [course.name]));
        const pc = d.players.length;
        card.appendChild(el('div', { class: 'course-meta' }, [
          countryDisplayName(course.country) + ' · ' + formatHoleCountLabel(course) + ' · ' +
          (pc === 0 ? 'noch keine Spieler' : (pc + ' Spieler: ' + d.players.map(function (p) { return p.displayName; }).join(', ')))
        ]));
        const nextBtn = el('button', { class: 'btn btn-primary btn-block btn-large', type: 'button' },
          [valid ? 'Runde starten' : 'Weiter zur Spielerwahl']);
        nextBtn.addEventListener('click', function () {
          if (valid) { startRoundFromDraft(); state.segment = 'live'; setScreen('play'); }
          else { setSetupSubScreen('players'); }
        });
        card.appendChild(nextBtn);
        const row = el('div', { class: 'row', style: 'gap:8px; margin-top:8px;' });
        const changeCourse = el('button', { class: 'btn grow', type: 'button' }, ['Anderer Platz']);
        changeCourse.addEventListener('click', function () { setSetupSubScreen('course'); });
        const discard = el('button', { class: 'btn grow', type: 'button' }, ['Verwerfen']);
        discard.addEventListener('click', function () {
          state.setupDraft = newSetupDraft();
          renderSetup();
        });
        row.appendChild(changeCourse);
        row.appendChild(discard);
        card.appendChild(row);
        padded.appendChild(card);
      }

      // Spielerverwaltung — direkter Zugang OHNE vorherige Platzwahl. Fuehrt in
      // die vollwertige Spieler-DB (anlegen / HCP / Tee / loeschen). Loeschen wirkt
      // hier DAUERHAFT — im Gegensatz zum "aus dieser Runde entfernen" (✕) der
      // Rundenliste, das die Datenbank nie veraendert.
      const managePlayers = el('button', { class: 'hub-btn', type: 'button', 'aria-label': 'Spieler verwalten' });
      managePlayers.appendChild(el('div', { class: 'hub-btn-title' }, ['Spieler']));
      managePlayers.appendChild(el('div', { class: 'hub-btn-status' }, ['Anlegen · HCP · Tee · loeschen']));
      managePlayers.appendChild(el('span', { class: 'hub-btn-arrow', 'aria-hidden': 'true' }, ['›']));
      managePlayers.addEventListener('click', function () { setSetupSubScreen('playersDb'); });
      padded.appendChild(managePlayers);

      // Data accordion (kept on hub for quick access without scrolling deep)
      const accord = el('details', { class: 'accordion' });
      const summary = el('summary', {}, ['Backup & Daten']);
      const body = el('div', { class: 'accordion-body stack', style: 'padding-top:12px;' });
      const exportBtn = el('button', { class: 'btn btn-block', type: 'button' }, ['Backup erstellen (Datei)']);
      exportBtn.addEventListener('click', function () { exportData(); renderSetup(); });
      const importBtn = el('button', { class: 'btn btn-block', type: 'button' }, ['Backup wiederherstellen (Datei)']);
      importBtn.addEventListener('click', triggerImport);
      const updateBtn = el('button', { class: 'btn btn-block is-disabled', type: 'button', disabled: 'disabled' }, ['Plaetze aktualisieren']);
      const btBtn = el('button', { class: 'btn btn-block is-disabled', type: 'button', disabled: 'disabled' }, ['Geraete-Sync (Bluetooth)']);
      body.appendChild(exportBtn);
      body.appendChild(importBtn);
      body.appendChild(updateBtn);
      body.appendChild(el('div', { class: 'small' }, ['Online-Update von Plaetzen ist fuer eine spaetere Version geplant.']));
      body.appendChild(btBtn);
      body.appendChild(el('div', { class: 'small' }, ['Geraete-Sync ueber Bluetooth ist fuer eine spaetere Version geplant.']));
      accord.appendChild(summary);
      accord.appendChild(body);
      padded.appendChild(accord);

      scroll.appendChild(padded);
      root.appendChild(scroll);
    }
    // Startet den gefuehrten Ablauf: frischer Draft (kein Platz/Spieler),
    // dann Platzauswahl. Ist GPS aus, wird gefragt (Ja/Nein).
    function startNewRoundFlow() {
      state.setupDraft = newSetupDraft();
      state.setupSubScreen = 'course';
      maybeAskGpsForCourse();
      renderSetup();
    }
    // GPS-Frage beim Betreten der Platzauswahl. Nur fragen, wenn GPS aus ist.
    function maybeAskGpsForCourse() {
      const gps = state.appState.gps || defaultGpsState();
      if (gps.status === 'ok') {
        // Bereits aktiv -> Naehe-Modus (ueber alle Laender nach Distanz).
        state.setupDraft.filters.listMode = 'auto';
        return;
      }
      if (gps.status === 'requesting') return;
      openDialog({
        title: 'Standort verwenden?',
        message: 'GPS einschalten, damit die naechstgelegenen Plaetze zuerst erscheinen? Ohne GPS werden die Schweizer Plaetze alphabetisch angezeigt.',
        confirmText: 'Ja, GPS ein',
        cancelText: 'Nein, ohne',
        onConfirm: function () {
          state.setupDraft.filters.listMode = 'auto';
          activateGps();   // rendert bei Erfolg/Fehler neu
        },
        onCancel: function () {
          state.setupDraft.filters.listMode = 'country';
          state.setupDraft.filters.country = 'CH';
          renderSetup();
        }
      });
    }

    // Subview-Header used by Course and Players sub-views.
    function buildSubViewHeader(title) {
      const header = el('div', { class: 'subview-header' });
      const backBtn = el('button', { class: 'back-btn', type: 'button', 'aria-label': 'Zurueck zum Setup' }, ['‹ Zurueck']);
      backBtn.addEventListener('click', function () { setSetupSubScreen('hub'); });
      header.appendChild(backBtn);
      header.appendChild(el('div', { class: 'subview-title' }, [title]));
      return header;
    }

    // Setup Course View — Platzauswahl: GPS, Suchfeld/Land, Liste. KEIN
    // vorausgewaehlter Platz, KEINE Tee-/Layout-Wahl hier (Tee ist pro Spieler).
    // Ein Tippen auf einen Platz oeffnet zuerst die Scorekarte-Vorschau.
    function renderSetupCourseView(root) {
      root.appendChild(buildSubViewHeader('Platz waehlen'));

      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });

      padded.appendChild(renderGpsStatusBlock());
      padded.appendChild(renderCourseFilterBar());
      padded.appendChild(renderCourseList());

      scroll.appendChild(padded);
      root.appendChild(scroll);
    }

    // Setup Players View — Spielerauswahl mit Liste, HCP, Tee pro Spieler.
    function renderSetupPlayersView(root) {
      // Eigener Header: zurueck fuehrt zur Platzauswahl (Wizard-Schritt zurueck).
      const header = el('div', { class: 'subview-header' });
      const backBtn = el('button', { class: 'back-btn', type: 'button', 'aria-label': 'Zurueck zur Platzauswahl' }, ['‹ Platz']);
      backBtn.addEventListener('click', function () { setSetupSubScreen('course'); });
      header.appendChild(backBtn);
      header.appendChild(el('div', { class: 'subview-title' }, ['Spieler']));
      root.appendChild(header);

      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });

      if (course) {
        const cc = el('div', { class: 'course-meta', style: 'margin-bottom:4px;' }, [

      }

          'Waehle Spieler aus oder lege neue an.'
        ]));
      } else {
        state.setupDraft.players.forEach(function (p, idx) {
          playersBox.appendChild(renderSetupPlayerRow(p, idx, course));
        });
      }
      padded.appendChild(playersBox);

      const addRow = el('div', { class: 'row', style: 'margin-top:8px;' });
      const canAdd = state.setupDraft.players.length < 4;
      const addBtn = el('button', { class: 'btn' + (canAdd ? '' : ' is-disabled'), type: 'button' }, ['+ Spieler auswaehlen / anlegen']);
      if (canAdd) addBtn.addEventListener('click', openAddPlayerSheet);
      else addBtn.disabled = true;
      const lastRow = el('div', { class: 'small grow', style: 'text-align:right;' }, [
        state.setupDraft.players.length + ' / 4 Spieler'
      ]);
      addRow.appendChild(addBtn);
      addRow.appendChild(lastRow);
      padded.appendChild(addRow);

      scroll.appendChild(padded);
      root.appendChild(scroll);

      // Sticky-Footer: von hier aus direkt starten (kein Rueckweg zum Grundbild noetig).
      const valid = setupIsValid();
      const footer = el('div', { class: 'padded', style: 'border-top:1px solid #C8C1B2; background:#EAE4D8;' });
      const startBtn = el('button', {
        class: 'btn btn-primary btn-block btn-large' + (valid ? '' : ' is-disabled'),
        type: 'button'
      }, [getOpenRounds().length > 0 ? 'Neue Runde starten' : 'Runde starten']);
      if (!valid) startBtn.disabled = true;
      startBtn.addEventListener('click', function () {
        if (!setupIsValid()) return;
        startRoundFromDraft();
        state.segment = 'live';
        setScreen('play');
      });
      footer.appendChild(startBtn);
      if (!valid) {
        footer.appendChild(el('div', { class: 'small', style: 'text-align:center; margin-top:4px;' }, [
          'Mind. ein Spieler mit Name, HCP und Tee noetig.'
        ]));
      }
      root.appendChild(footer);
    }
    // v1.5: "Offene Spiele" block on Setup screen — lists in-progress rounds
    // with Weiter / Beenden actions. Returns null if there are no open rounds.
    function renderOpenRoundsBlock() {
      const openList = getOpenRounds();
      if (openList.length === 0) return null;
      const block = el('div', { class: 'open-rounds-block' });
      block.appendChild(el('div', { class: 'or-title' }, [
        openList.length === 1 ? 'Offenes Spiel' : ('Offene Spiele (' + openList.length + ')')
      ]));
      // Sort by updatedAt desc so recently touched rounds are on top.
      const sorted = openList.slice().sort(function (a, b) {
        const tb = new Date(b.updatedAt || b.createdAt || b.date || 0).getTime();
        const ta = new Date(a.updatedAt || a.createdAt || a.date || 0).getTime();
        return tb - ta;
      });
      sorted.forEach(function (r) {
        block.appendChild(renderOpenRoundCard(r));
      });
      return block;
    }
    function renderOpenRoundCard(r) {
      const card = el('div', { class: 'open-round-card', 'data-round-id': r.id });
      const line1 = el('div', { class: 'or-line1' });
      line1.appendChild(el('span', { class: 'or-date' }, [formatDate(r.date || r.createdAt)]));
      line1.appendChild(el('span', { class: 'or-course', title: r.courseName || '' }, [r.courseName || 'Unbekannter Platz']));
      line1.appendChild(el('span', { class: 'or-status' }, ['in Bearbeitung']));
      card.appendChild(line1);

      const names = (r.playersInRound || []).map(function (p) { return p.displayName; }).join(', ');
      const line2bits = [];
      if (names) line2bits.push(names);
      if (r.currentHole) line2bits.push('Loch ' + r.currentHole);
      const saved = r.updatedAt ? ('zuletzt ' + formatTime(r.updatedAt)) : null;
      if (saved) line2bits.push(saved);
      if (line2bits.length) card.appendChild(el('div', { class: 'or-line2' }, [line2bits.join(' · ')]));

      const actions = el('div', { class: 'or-actions' });
      const resumeBtn = el('button', { class: 'btn btn-primary', type: 'button' }, ['Weiterspielen']);
      resumeBtn.addEventListener('click', function () { resumeOpenRound(r.id); });
      const finishBtn = el('button', { class: 'btn btn-danger', type: 'button' }, ['Beenden / Speichern']);
      finishBtn.addEventListener('click', function () {
        openDialog({
          title: 'Runde beenden?',
          message: 'Moechtest du diese Runde beenden und in die History verschieben? Sie kann dann nicht mehr bearbeitet werden.',
          confirmText: 'Beenden & speichern',
          confirmKind: 'danger',
          onConfirm: function () { archiveOpenRound(r.id); }
        });
      });
      actions.appendChild(resumeBtn);
      actions.appendChild(finishBtn);
      card.appendChild(actions);
      return card;
    }

    // v1.1 helpers for setup screen
    function renderGpsStatusBlock() {
      const gps = state.appState.gps || defaultGpsState();
      const row = el('div', { class: 'gps-row' });
      row.appendChild(el('span', { class: 'gps-label' }, ['GPS']));

      const bars = computeGpsBars(gps.accuracy);
      const barsEl = el('span', { class: 'gps-bars is-' + (bars.color === 'grey' ? 'grey' : bars.color) });
      if (gps.status === 'requesting') barsEl.classList.add('is-pulsing');
      for (let i = 1; i <= 3; i++) {
        const b = el('span', { class: 'bar' + (i <= bars.bars ? ' on' : '') });
        barsEl.appendChild(b);
      }
      row.appendChild(barsEl);

      let text;
      if (gps.status === 'idle') text = 'aus';
      else if (gps.status === 'requesting') text = 'wird ermittelt …';
      else if (gps.status === 'ok') text = formatAccuracy(gps.accuracy);
      else text = gps.lastError || 'nicht verfuegbar';
      row.appendChild(el('span', { class: 'gps-text' }, [text]));

      // Action buttons:
      //   idle / error  -> "Aktivieren"
      //   requesting    -> disabled "Aktivieren"
      //   ok            -> [⟳ Aktualisieren] [Deaktivieren]
      // Wenn der Platz feststeht, kann der Nutzer GPS bewusst ausschalten —
      // rein UX-bezogen, da getCurrentPosition() ohnehin nicht dauerhaft trackt.
      const actionsWrap = el('span', { class: 'gps-actions' });
      if (gps.status === 'ok') {
        const refreshBtn = el('button', {
          class: 'gps-activate-btn gps-refresh-btn',
          type: 'button',
          'aria-label': 'GPS-Position aktualisieren',
          title: 'Position aktualisieren'
        }, ['⟳']);
        refreshBtn.addEventListener('click', activateGps);
        actionsWrap.appendChild(refreshBtn);
        const offBtn = el('button', {
          class: 'gps-activate-btn gps-deactivate-btn',
          type: 'button',
          'aria-label': 'GPS deaktivieren'
        }, ['Aus']);
        offBtn.addEventListener('click', deactivateGps);
        actionsWrap.appendChild(offBtn);
      } else {
        const btn = el('button', { class: 'gps-activate-btn', type: 'button' }, ['Aktivieren']);
        if (gps.status === 'requesting') btn.disabled = true;
        btn.addEventListener('click', activateGps);
        actionsWrap.appendChild(btn);
      }
      row.appendChild(actionsWrap);
      return row;
    }
    function renderCourseFilterBar() {
      const f = state.setupDraft.filters;
      const gps = state.appState.gps;
      const gpsOk = gps && gps.status === 'ok' && typeof gps.lat === 'number';
      const nearbyMode = gpsOk && f.listMode === 'auto';

      const wrap = el('div', { class: 'filter-bar' });
      // WICHTIG gegen Androids Autofill-Leiste (Schluessel/Karte/Standort):
      // Chrome stuft ein Feld als Adress-/Login-/Zahlungsfeld ein, wenn Typ/Name
      // oder Platzhalter Schluesselwoerter enthalten. Darum: type="search" +
      // neutraler name + KEIN "Name"/"Laender" im Platzhalter + autocomplete=off
      // + Passwort-Manager-Opt-outs. (Die Leiste selbst ist Chrome-System-UI und
      // laesst sich nicht ausblenden — das reduziert aber die eingeblendeten Daten
      // und verhindert, dass echte Passwoerter/Karten/Adressen angeboten werden.)
      const nameIn = el('input', {
        type: 'search',
        name: 'platzsuche',
        placeholder: 'Platz suchen (weltweit)',
        'aria-label': 'Golfplatz suchen',
        value: f.name || '',
        autocomplete: 'off',
        autocorrect: 'off',
        autocapitalize: 'none',
        spellcheck: 'false',
        inputmode: 'search',
        enterkeyhint: 'search',
        'data-1p-ignore': '',
        'data-lpignore': 'true',
        'data-bwignore': '',
        'data-form-type': 'other',
        'data-protonpass-ignore': ''
      });
      nameIn.addEventListener('input', function () {
        f.name = nameIn.value;
        renderCourseList(true);
      });
      wrap.appendChild(nameIn);

      const row2 = el('div', { class: 'filter-row2' });

      // Land: Standard CH. Bei aktivem GPS im Auto-Modus zeigt das Feld "Naehe
      // (GPS)" und die Liste ist nach Distanz sortiert. Ein bewusst gewaehltes
      // Land schaltet auf die alphabetische Landliste um.
      const countrySel = el('select');
      const shownCountry = nearbyMode ? 'Alle' : (f.country || 'CH');
      const countryOpts = [{ v: 'Alle', t: nearbyMode ? 'Naehe (GPS)' : 'Alle Laender' }].concat(
        availableCountries().map(function (iso) { return { v: iso, t: countryDisplayName(iso) }; })
      );
      countryOpts.forEach(function (opt) {
        const o = document.createElement('option');
        o.value = opt.v;
        o.textContent = opt.t;
        if (opt.v === shownCountry) o.selected = true;
        countrySel.appendChild(o);
      });
      countrySel.addEventListener('change', function () {
        const v = countrySel.value;
        f.country = v;
        // 'Alle' -> Auto-Modus: ohne GPS zeigt das ohnehin alle Laender
        // alphabetisch, und sobald GPS aktiv wird, springt es automatisch auf
        // Naehe. Ein konkretes Land -> fester Landfilter.
        f.listMode = (v === 'Alle') ? 'auto' : 'country';
        renderCourseList(true);
      });
      row2.appendChild(countrySel);

      const holeSel = el('select');
      ['Alle', '6', '9', '18', '27', '36'].forEach(function (h) {
        const o = document.createElement('option');
        o.value = h;
        o.textContent = h === 'Alle' ? 'Alle Lochanzahlen' : (h + ' Loch');
        if (h === f.holeCount) o.selected = true;
        holeSel.appendChild(o);
      });
      holeSel.addEventListener('change', function () {
        f.holeCount = holeSel.value;
        renderCourseList(true);
      });
      row2.appendChild(holeSel);

      wrap.appendChild(row2);
      return wrap;
    }
    // Akzent-unempfindliche Normalisierung fuer die Namenssuche (é->e, ü->u ...).
    function normName(s) {
      return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }
    // Durchsuchbarer Text je Platz (Name + Ort + Land), einmalig gecacht — bei
    // tausenden Plaetzen sonst zu teuer pro Tastendruck.
    function courseSearchHay(c) {
      if (c._searchNorm == null) {
        c._searchNorm = normName((c.name || '') + ' ' + (c.region || '') + ' ' + (countryDisplayName(c.country) || ''));
      }
      return c._searchNorm;
    }
    // Kursliste: bei EINGABE globale Namenssuche ueber alle Laender; sonst
    // GPS-Naehe (nach Distanz) ODER Landliste (alphabetisch, Standard CH).
    // Ein Tippen oeffnet die Scorekarte-Vorschau (nicht direkt auswaehlen).
    function renderCourseList(replaceExisting) {
      const f = state.setupDraft.filters;
      const gps = state.appState.gps;
      const gpsOk = gps && gps.status === 'ok' && typeof gps.lat === 'number';
      const nearbyMode = gpsOk && f.listMode === 'auto';
      const nfRaw = (f.name || '').trim();
      const hf = (f.holeCount && f.holeCount !== 'Alle') ? Number(f.holeCount) : null;
      const SEARCH_CAP = 60;

      let entries;   // [{ course, distKm, rank? }]
      let headerText;
      let countText = null;   // Suche: "X von Y"; sonst = Anzahl Eintraege
      if (nfRaw) {
        // Globale Namenssuche ueber ALLE Laender: akzent-unempfindlich, Teiltreffer
        // und Wortreihenfolge egal (jedes Wort muss irgendwo in Name/Ort/Land
        // vorkommen). So findet man einen Platz auch mit nur einem Namensteil.
        const q = normName(nfRaw);
        const tokens = q.split(/\s+/).filter(Boolean);
        const scored = [];
        state.appState.courses.forEach(function (c) {
          if (hf && c.holeCount !== hf) return;
          const hay = courseSearchHay(c);
          for (let i = 0; i < tokens.length; i++) { if (hay.indexOf(tokens[i]) === -1) return; }
          const nameN = normName(c.name);
          let rank = 2;
          if (nameN.indexOf(q) === 0) rank = 0;        // Name beginnt mit der Eingabe
          else if (nameN.indexOf(q) !== -1) rank = 1;  // Eingabe als zusammenhaengender Teil
          let dist = null;
          if (gpsOk && c.location && typeof c.location.lat === 'number') {
            dist = haversineKm(gps.lat, gps.lng, c.location.lat, c.location.lng);
          }
          scored.push({ course: c, distKm: dist, rank: rank });
        });
        scored.sort(function (a, b) {
          return (a.rank - b.rank) ||
            (a.course.name || '').toLowerCase().localeCompare((b.course.name || '').toLowerCase());
        });
        const total = scored.length;
        entries = scored.slice(0, SEARCH_CAP);
        headerText = 'Suchergebnisse — alle Laender';
        countText = (total > SEARCH_CAP) ? (SEARCH_CAP + ' von ' + total) : String(total);
      } else if (nearbyMode) {
        headerText = 'Plaetze in der Naehe';
        entries = getNearbyCourses().filter(function (e) {
          return !(hf && e.course.holeCount !== hf);
        }).slice(0, 80);
      } else {
        const list = filterCoursesForSetup(state.appState.courses, '', f.region, f.holeCount, f.country)
          .slice().sort(function (a, b) {
            return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
          });
        entries = list.map(function (c) { return { course: c, distKm: null }; });
        const cName = (f.country && f.country !== 'Alle') ? countryDisplayName(f.country) : 'alle Laender';
        headerText = 'Plaetze — ' + cName;
      }

      const container = el('div', { class: 'course-list-wrap', id: 'all-courses-list' });
      let note = headerText + ' (' + (countText != null ? countText : entries.length) + ')';
      if (!nfRaw && gps && gps.status === 'requesting') note = 'GPS wird ermittelt … — ' + note;
      container.appendChild(el('div', { class: 'section-title' }, [note]));

      const list = el('div', { class: 'all-courses-list' });
      if (entries.length === 0) {
        list.appendChild(el('div', { class: 'empty-state' }, ['Keine Plaetze gefunden.']));
      } else {
        entries.forEach(function (entry) {
          const c = entry.course;
          const btn = el('button', { class: 'course-item', type: 'button' });
          const top = el('div', { class: 'ni-top' });
          top.appendChild(el('span', { class: 'ci-name' }, [c.name]));
          if (entry.distKm != null) top.appendChild(el('span', { class: 'ni-dist' }, [formatDistKm(entry.distKm)]));
          btn.appendChild(top);
          btn.appendChild(el('div', { class: 'ci-meta' }, [
            countryDisplayName(c.country) + (c.region ? ' / ' + c.region : '') + ' · ' + formatHoleCountLabel(c)
          ]));
          btn.addEventListener('click', function () { openScorecardPreview(c.id); });
          list.appendChild(btn);
        });
      }
      container.appendChild(list);
      if (replaceExisting) {
        const old = document.getElementById('all-courses-list');
        if (old && old.parentNode) old.parentNode.replaceChild(container, old);
      }
      return container;
    }
    // Tippen auf einen Platz -> erst die Scorekarte zeigen (Distanz-Kontrolle),
    // Auswahl gilt erst beim Bestaetigen in der Vorschau.
    function openScorecardPreview(courseId) {
      const c = getCourse(courseId);
      if (!c) return;
      state.previewCourseId = courseId;
      setSetupSubScreen('preview');
    }
    // Erst hier gilt der Platz als gewaehlt -> direkt weiter zur Spielerwahl.
    function confirmCourseSelection(courseId) {
      const c = getCourse(courseId);
      if (!c) return;
      state.setupDraft.courseId = c.id;
      const defTee = getTee(c, 'yellow') || c.tees[0];
      state.setupDraft.teeForCourse = defTee ? defTee.colorKey : null;
      state.setupDraft.layoutId = defaultLayoutIdForCourse(c);
      const availableKeys = new Set(c.tees.map(function (t) { return t.colorKey; }));
      state.setupDraft.players.forEach(function (p) {
        if (!p._teeOverride || !availableKeys.has(p.teeColorKey)) {
          p.teeColorKey = state.setupDraft.teeForCourse;
          p._teeOverride = false;
        }
      });
      setSetupSubScreen('players');
    }

    // Scorekarte-Vorschau: zeigt Loecher, Par, SI und Laengen je Tee, damit der
    // Nutzer per Distanz erkennt, ob es der richtige Platz ist. Auswahl gilt erst
    // beim Bestaetigen; Abbruch fuehrt zurueck zur Liste.
    function renderSetupPreviewView(root) {
      const header = el('div', { class: 'subview-header' });
      const backBtn = el('button', { class: 'back-btn', type: 'button', 'aria-label': 'Zurueck zur Liste' }, ['‹ Liste']);
      backBtn.addEventListener('click', function () { setSetupSubScreen('course'); });
      header.appendChild(backBtn);
      header.appendChild(el('div', { class: 'subview-title' }, ['Scorekarte']));
      root.appendChild(header);

      const course = getCourse(state.previewCourseId);
      const scroll = el('div', { class: 'scroll-area' });
      const padded = el('div', { class: 'padded stack' });

      if (!course) {
        padded.appendChild(el('div', { class: 'empty-state' }, ['Platz nicht gefunden.']));
        scroll.appendChild(padded);
        root.appendChild(scroll);
        return;
      }

      padded.appendChild(el('div', { class: 'course-name', style: 'font-size:18px;' }, [course.name]));
      const gps = state.appState.gps;
      let distTxt = '';
      if (gps && gps.status === 'ok' && course.location && typeof course.location.lat === 'number') {
        const km = haversineKm(gps.lat, gps.lng, course.location.lat, course.location.lng);
        if (km != null) distTxt = ' · ' + formatDistKm(km) + ' entfernt';
      }
      padded.appendChild(el('div', { class: 'course-meta' }, [
        countryDisplayName(course.country) + (course.region ? ' / ' + course.region : '') +
        ' · ' + formatHoleCountLabel(course) + distTxt
      ]));
      padded.appendChild(el('div', { class: 'small', style: 'margin-top:2px;' }, [
        'Laengen in Metern — pruefe, ob es der richtige Platz ist.'
      ]));
      padded.appendChild(buildScorecardTable(course));

      scroll.appendChild(padded);
      root.appendChild(scroll);

      const footer = el('div', { class: 'padded', style: 'border-top:1px solid #C8C1B2; background:#EAE4D8; display:flex; gap:8px;' });
      const backList = el('button', { class: 'btn grow', type: 'button' }, ['‹ Zurueck']);
      backList.addEventListener('click', function () { setSetupSubScreen('course'); });
      const choose = el('button', { class: 'btn btn-primary grow', type: 'button' }, ['Diesen Platz waehlen ›']);
      choose.addEventListener('click', function () { confirmCourseSelection(course.id); });
      footer.appendChild(backList);
      footer.appendChild(choose);
      root.appendChild(footer);
    }

    function buildScorecardTable(course) {
      const tees = course.tees || [];
      const holes = course.holes || [];
      const n = holes.length;
      const wrap = el('div', { class: 'sc-scroll' });
      const table = el('table', { class: 'sc-table' });

      const thead = el('thead');
      const hr = el('tr');
      ['Loch', 'Par', 'SI'].forEach(function (h) { hr.appendChild(el('th', {}, [h])); });
      tees.forEach(function (t) { hr.appendChild(el('th', {}, [t.colorLabel])); });
      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = el('tbody');
      let parOut = 0, parIn = 0;
      const teeOut = tees.map(function () { return 0; });
      const teeIn = tees.map(function () { return 0; });
      const teeTot = tees.map(function () { return 0; });
      function metreCell(v) { return (typeof v === 'number' && v > 0) ? String(Math.round(v)) : '–'; }
      function sumRow(label, par, sums, cls) {
        const tr = el('tr', { class: cls || 'sc-sum' });
        tr.appendChild(el('td', {}, [label]));
        tr.appendChild(el('td', {}, [par ? String(par) : '']));
        tr.appendChild(el('td', {}, ['']));
        sums.forEach(function (s) { tr.appendChild(el('td', {}, [s ? String(Math.round(s)) : '–'])); });
        return tr;
      }
      holes.forEach(function (h, i) {
        const tr = el('tr');
        tr.appendChild(el('td', {}, [String(h.holeNumber)]));
        tr.appendChild(el('td', {}, [String(h.par)]));
        tr.appendChild(el('td', {}, [String(h.strokeIndex)]));
        tees.forEach(function (t, ti) {
          const v = (t.holeYardage || [])[i];
          tr.appendChild(el('td', {}, [metreCell(v)]));
          if (typeof v === 'number' && v > 0) {
            teeTot[ti] += v;
            if (i < 9) teeOut[ti] += v; else teeIn[ti] += v;
          }
        });
        if (typeof h.par === 'number') { if (i < 9) parOut += h.par; else parIn += h.par; }
        tbody.appendChild(tr);
        if (n >= 18 && i === 8) tbody.appendChild(sumRow('OUT', parOut, teeOut));
      });
      if (n >= 18) tbody.appendChild(sumRow('IN', parIn, teeIn));
      // Fehlen die Loch-Laengen fuer ein Tee (Summe 0), aber die Gesamtlaenge ist
      // bekannt, dann diese in der Total-Zeile zeigen statt "–".
      const teeTotDisplay = tees.map(function (t, ti) {
        if (teeTot[ti] > 0) return teeTot[ti];
        return (typeof t.totalDistance === 'number' && t.totalDistance > 0) ? t.totalDistance : 0;
      });
      tbody.appendChild(sumRow('Total', parOut + parIn, teeTotDisplay, 'sc-total'));
      table.appendChild(tbody);

      const tfoot = el('tfoot');
      const crRow = el('tr', { class: 'sc-foot' });
      crRow.appendChild(el('td', { colspan: '3' }, ['CR / SR']));
      tees.forEach(function (t) {
        crRow.appendChild(el('td', {}, [

        ]));

      if (!anyYard) {

          return t.colorLabel + ': ' + (t.totalDistance != null ? Math.round(t.totalDistance) + ' m' : '–');
        }).join('  ·  ');
        wrap.appendChild(el('div', { class: 'small', style: 'margin-top:6px;' }, ['Keine Loch-Laengen — Gesamtlaenge: ' + totals]));
      }
      return wrap;
    }

    // Spieler hinzufuegen — Mehrfachauswahl aus der Datenbank (Checkboxen) UND

      const f3 = el('div', { class: 'field' });
      f3.appendChild(el('span', { class: 'label' }, ['Standard-Tee']));
      let chosenTee = defaultTee;
      const teePal = el('div', { class: 'tee-palette' });
      if (course) {
        course.tees.forEach(function (t) {
          const pill = el('button', { class: 'tee-pill' + (t.colorKey === chosenTee ? ' is-selected' : ''), type: 'button' });
          pill.appendChild(el('span', { class: 'dot tee-dot-' + t.colorKey }));
          pill.appendChild(el('span', {}, [t.colorLabel]));
          pill.addEventListener('click', function () {
            chosenTee = t.colorKey;

      const save = el('button', { class: 'btn btn-primary', type: 'button' }, ['Hinzufuegen']);
      save.addEventListener('click', function () {
        const picked = checkboxes.filter(function (c) { return c.input.checked; });
        const newName = nameIn.value.trim();
        const newHcp = parseFloat(hcpIn.value);
        if (picked.length === 0 && !newName) { showToast('Bitte Spieler waehlen oder anlegen.'); return; }
        if (newName && isNaN(newHcp)) { showToast('Bitte HCP fuer den neuen Spieler eingeben.'); return; }

        let skipped = 0;
        const hasRoom = function () { return state.setupDraft.players.length < 4; };
        picked.forEach(function (c) {
          if (!hasRoom()) { skipped++; return; }
          // defaultTeeColorKey nur uebernehmen, wenn dieser Platz das Tee hat —
          // sonst auf das Platz-Standardtee zurueckfallen. Ein ungueltiges Tee
          // wuerde sonst die Validierung passieren, und startRoundFromDraft
          // wiche still auf tees[0] aus (falsche Vorgabe, kein Fehlerhinweis).
          const teeOk = c.defaultTeeColorKey && availableKeys.has(c.defaultTeeColorKey);
          state.setupDraft.players.push({
            tempId: uid('pir'), playerId: c.id, displayName: c.name, handicapIndex: c.hcp,
            teeColorKey: teeOk ? c.defaultTeeColorKey : defaultTee, _teeOverride: teeOk
          });
        });
        if (newName) {
          if (!hasRoom()) { skipped++; }
          else {
            const newPlayer = { id: uid('player'), name: newName, handicapIndex: newHcp, defaultTeeColorKey: chosenTee, createdAt: new Date().toISOString() };
            state.appState.players.push(newPlayer);
            state.setupDraft.players.push({
              tempId: uid('pir'), playerId: newPlayer.id, displayName: newName, handicapIndex: newHcp,
              teeColorKey: chosenTee, _teeOverride: true
            });
          }
        }
        saveState();
        closeOverlay();
        renderSetup();
        if (skipped > 0) showToast('Maximal 4 Spieler — ' + skipped + ' nicht hinzugefuegt.');
      });
      actions.appendChild(cancel);
      actions.appendChild(save);
      content.appendChild(actions);
      openSheet(content);

    function triggerImport() {
